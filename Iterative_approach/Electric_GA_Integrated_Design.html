      const ext = reserveFor(spec, E, cr, ws, ld).ext;
      const c = SZ.energyCoeffs(t, Object.assign({}, ext, { usable: ext.usable }));
      const A = c.aCr + c.aRes, fe = ext.usable * c.eJ;
      if (f.mode === 'A') return m * (1 - spec.ewf) - spec.payload - (A * m + c.Efix) / fe;
      return fe * mb - c.Efix - A * m;                                 // D, closure on range
    };
  }

  /* Bounded root search: log-spaced scan for sign changes, then bisection */
  function findRoots(fn, lo, hi, opts) {
    opts = opts || {};
    const n = opts.n || 600, tol = opts.tol || 1e-13, maxIt = opts.maxIt || 200;
    const xs = [], fs = [];
    const L = Math.log(lo), H = Math.log(hi);
    for (let i = 0; i < n; i++) { const x = Math.exp(L + (H - L) * i / (n - 1)); xs.push(x); fs.push(fn(x)); }
    const roots = [];
    for (let i = 1; i < n; i++) {
      const fa = fs[i - 1], fb = fs[i];
      if (!(Number.isFinite(fa) && Number.isFinite(fb))) continue;
      if (fa === 0) { roots.push({ x: xs[i - 1], fx: 0, it: 0, width: 0, converged: true }); continue; }
      if (Math.sign(fa) === Math.sign(fb)) continue;
      let a = xs[i - 1], b = xs[i], fA = fa, it = 0;
      for (; it < maxIt && (b - a) > tol * Math.max(1, Math.abs(a)); it++) {
        const m = 0.5 * (a + b), fm = fn(m);
        if (!Number.isFinite(fm)) break;
        if (Math.sign(fm) === Math.sign(fA)) { a = m; fA = fm; } else b = m;
      }
      const x = 0.5 * (a + b);
      roots.push({ x, fx: fn(x), it, width: b - a, converged: (b - a) <= tol * Math.max(1, Math.abs(a)) * 1.0000001 });
    }
    return { roots, scanned: n, lo, hi };
  }

  /* ------------------------------------------------------------------ *
   * 8. Sizing input object (source engine conventions)
   * ------------------------------------------------------------------ */
  function sizingInputs(spec, ld) {
    return { range: spec.range, ld, ewf: spec.ewf, payload: spec.payload, specificEnergy: spec.specificEnergy, etaProp: spec.etaProp, etaSys: spec.etaSys,
      gravity: spec.gravity, takeoffMass: spec.takeoffMass, batteryMass: spec.batteryMass, batteryEnergy: spec.batteryEnergy };
  }
  function constraintParams(spec, atm) {
    return { CLmax_TO: spec.CLmax_TO, CLmax_L: spec.CLmax_L, CD0: spec.CD0, AR: spec.AR, e: spec.e, eta_p: spec.etaProp,
      S_GTO: spec.S_GTO, sigma_TO: atm.to.sigma, S_GL: spec.S_GL, WL_WTO: spec.WL_WTO, sigma_L: atm.ld.sigma,
      V_cr_kt: spec.V_cr_kt, sigma_cr: atm.cr.sigma, Wcr_WTO: spec.Wcr_WTO };
  }

  /* Constraints listed by the source as future refinements: shown as unverified */
  const UNVERIFIED = CA.CONSTRAINTS.filter((c) => !c.implemented).map((c) => ({ id: c.id, name: c.name, note: c.note }));

  /* ------------------------------------------------------------------ *
   * 9. Full evaluation
   * ------------------------------------------------------------------ */
  function evaluate(spec, opts) {
    opts = opts || {};
    const E = engineFor(spec.constants);
    const R = { spec, E, constants: E.CONST.set };
    const V = validateSpec(spec);
    R.errors = Object.assign({}, V.err); R.warnings = Object.assign({}, V.warn);

    // atmosphere
    const atm = { to: resolveAtmo(E, spec.atmo.to), cr: resolveAtmo(E, spec.atmo.cr), ld: resolveAtmo(E, spec.atmo.ld) };
    R.atmo = atm;
    for (const [w, key] of [['to', 'sigma_TO'], ['cr', 'sigma_cr'], ['ld', 'sigma_L']]) if (!atm[w].ok) R.errors[key] = atm[w].error;

    // constraint model
    const p = constraintParams(spec, atm);
    const model = opts.model || E.buildModel(p, spec.enforce);
    R.model = model; R.params = p;
    for (const k of Object.keys(model.errors)) if (!R.errors[k]) R.errors[k] = model.errors[k];
    for (const k of Object.keys(model.warnings)) if (!R.warnings[k]) R.warnings[k] = model.warnings[k];
    const crC = model.byId.cruise, cr = crC && crC.valid ? crC.data : null;

    // design point
    const f = spec.formulation;
    let ws = spec.ws, wp = spec.wp, geo = null;
    if (spec.pointDef === 'geometry') {
      if (cr && !V.err.S && !V.err.P && !V.err.usable && !V.err.ldManual) {
        geo = solveGeometry(spec, E, cr);
        if (geo.ok) {
          const W = geo.m * spec.gravity / U.LBF_N;
          ws = W / spec.S; wp = W / spec.P;
        } else { ws = NaN; wp = NaN; }
      } else { geo = { ok: false, message: 'Fix the highlighted inputs to solve the fixed-geometry closure.' }; ws = NaN; wp = NaN; }
    }
    R.point = { def: spec.pointDef, ws, wp, geo };
    const wsOK = num(ws) && ws > 0, wpOK = num(wp) && wp > 0;

    // aerodynamics
    const aero = { valid: false };
    if (cr && wsOK) {
      const a = aeroAt(cr, ws, spec.CD0);
      Object.assign(aero, a, {
        valid: true, r: cr.r, k: cr.k, CD0: spec.CD0, q: cr.q, q_Pa: cr.q * U.PSF_PA, V_fts: cr.V, V_kt: spec.V_cr_kt, V_ms: cr.V * U.FT_M,
        rho: cr.rho, rho_SI: cr.rho * U.SLUGFT3_KGM3, sigma: atm.cr.sigma,
        LDmax: cr.LDmaxAero, CLstar: Math.sqrt(spec.CD0 / cr.k), wsBest: cr.wsBestLD,
        V_bestLD_kt: Math.sqrt(2 * cr.r * ws / (cr.rho * Math.sqrt(spec.CD0 / cr.k))) / E.CONST.kt_to_fts,
        CL_mp: Math.sqrt(3 * spec.CD0 / cr.k),
        V_minP_kt: Math.sqrt(2 * cr.r * ws / (cr.rho * Math.sqrt(3 * spec.CD0 / cr.k))) / E.CONST.kt_to_fts,
        LD_minP: Math.sqrt(3 * spec.CD0 / cr.k) / (spec.CD0 + cr.k * 3 * spec.CD0 / cr.k),
      });
    }
    R.aero = aero;

    // L/D used by the sizing engine
    const manual = spec.ldMode === 'manual';
    const ld = { mode: spec.ldMode, aero: aero.valid ? aero.LD : NaN, manual: manual ? spec.ldManual : NaN };
    ld.used = manual ? spec.ldManual : ld.aero;
    ld.eff = manual ? spec.ldManual / spec.Wcr_WTO : (aero.valid ? aero.LD / cr.r : NaN);
    if (manual && aero.valid) { ld.diff = spec.ldManual - aero.LD; ld.diffPct = 100 * ld.diff / aero.LD; }
    R.ld = ld;

    // sizing
    const t = sizingInputs(spec, ld.eff);
    let sz, reserve = { ext: { usable: spec.usable, reserveKind: 'none' }, info: { kind: 'none', basis: spec.rangeBasis } };
    const sizingBlocked = !num(ld.eff) || V.err.usable || V.err.reservePct || V.err.reserveEnergy || V.err.reserveMin || V.err.reserveV || V.err.Wcr_WTO;
    if (sizingBlocked) {
      sz = { status: 'indeterminate', message: !num(ld.eff) ? (manual ? 'Enter a valid prescribed L/D.' : 'Cruise L/D cannot be computed until the cruise condition, drag polar and W/S are valid.') : 'Fix the energy-budget inputs.', reason: 'Indeterminate',
        takeoffMass: NaN, emptyMass: NaN, batteryMass: NaN, payloadMass: NaN, batteryFraction: NaN, payloadFraction: NaN, batteryEnergy: NaN, range: NaN, mtowMargin: NaN, metric: NaN, checks: [] };
    } else {
      reserve = cr ? reserveFor(spec, E, cr, ws, ld.eff) : reserve;
      if (!cr && spec.rangeBasis === 'mission' && spec.reserveKind === 'time' && spec.reserveCond === 'speed') {
        sz = { status: 'indeterminate', message: 'The reserve condition needs a valid cruise atmosphere and drag polar.', reason: 'Indeterminate', takeoffMass: NaN, emptyMass: NaN, batteryMass: NaN, payloadMass: NaN, batteryFraction: NaN, payloadFraction: NaN, batteryEnergy: NaN, range: NaN, mtowMargin: NaN, metric: NaN, checks: [] };
      } else {
        if (!cr) reserve = reserveFor(spec, E, { r: spec.Wcr_WTO, V: spec.V_cr_kt * E.CONST.kt_to_fts, k: NaN, kr: NaN, rho: NaN, q: NaN }, ws, ld.eff);
        sz = SZ.sizeWithBudget(t, f, reserve.ext);
      }
    }
    // Round-off guard: payload-constrained closure with EWF + f_bat = 1 to within round-off. The source
    // engine divides by a denominator of order 1e-17 there and returns m0 ≈ 1e19 kg; report infeasible.
    if (sz.status === 'ok' && f.mode === 'A' && Number.isFinite(sz.metric) && sz.metric <= ROUNDOFF_DEN) {
      sz = Object.assign({}, sz, { status: 'infeasible', reason: 'EWF + f_bat = 1', roundoffGuard: true,
        message: 'EWF + f_bat = 1 to within floating-point round-off (payload fraction ' + sz.metric.toExponential(2) + '): no finite takeoff mass carries the payload. The source engine would report m0 \u2248 ' + sz.takeoffMass.toExponential(2) + ' kg here.',
        takeoffMass: NaN, emptyMass: NaN, batteryMass: NaN, payloadMass: NaN, payloadFraction: NaN, mtowMargin: NaN, batteryEnergy: NaN, energy: undefined });
    }
    if (sz.status === 'ok' && f.mode === 'A' && Number.isFinite(sz.metric) && sz.metric < 0.05) {
      R.warnings.sensitivity = 'The payload fraction is only ' + (100 * sz.metric).toFixed(2) + ' %: near the feasibility limit MTOW grows as 1/(1 − EWF − f_bat) and reacts strongly to every input.';
    }
    R.sizing = sz; R.reserve = reserve.info; R.reserveExt = reserve.ext;
    R.determinacy = SZ.determinacy(f);
    R.sizingIssues = SZ.issues(t, f).filter((x) => x.key !== 'ld' || manual);

    // weight force and geometry
    const prescribedMass = f.mode === 'B' || f.mode === 'C' || (f.mode === 'D' && singleClosure(f) === 'takeoffMass');
    let m = NaN, wSource = null;
    if (sz.status === 'ok') { m = sz.takeoffMass; wSource = 'sized'; }
    else if (prescribedMass && num(spec.takeoffMass) && spec.takeoffMass > 0 && f.mode !== 'D') { m = spec.takeoffMass; wSource = 'prescribed'; }
    else if (prescribedMass && f.mode === 'D' && f.closures.length === 1 && num(spec.takeoffMass) && spec.takeoffMass > 0) { m = spec.takeoffMass; wSource = 'prescribed'; }
    const weight = { source: wSource, m_kg: m, m_lb: m / U.LB_KG, W_N: m * spec.gravity, W_lbf: m * spec.gravity / U.LBF_N, g: spec.gravity };
    R.weight = weight;
    const W = weight.W_lbf, Wok = num(W) && W > 0;
    const geom = { S_ft2: NaN, S_m2: NaN, b_ft: NaN, b_m: NaN, c_ft: NaN, c_m: NaN, AR: spec.AR };
    if (Wok && wsOK) {
      geom.S_ft2 = W / ws; geom.S_m2 = geom.S_ft2 * U.FT2_M2;
      if (num(spec.AR) && spec.AR > 0) { geom.b_ft = Math.sqrt(spec.AR * geom.S_ft2); geom.b_m = geom.b_ft * U.FT_M; geom.c_ft = geom.S_ft2 / geom.b_ft; geom.c_m = geom.c_ft * U.FT_M; }
    }
    R.geometry = geom;

    // geometry-mode closure check through the loading pipeline
    if (geo && geo.ok && sz.status === 'ok') {
      geo.loopResidual = (sz.takeoffMass - geo.m) / geo.m;
      if (!opts.skipSolverCheck && (geo.method === 'quadratic' || geo.method === 'linear')) {
        const fn = geometryResidualFn(spec, E, cr);
        const mMax = 2000 * spec.S * U.LBF_N / spec.gravity;   // W/S up to 2000 lbf/ft²
        const nr = findRoots(fn, 1e-3, mMax, { n: 700 });
        geo.numeric = nr;
        const near = nr.roots.reduce((best, rt) => (best === null || Math.abs(rt.x - geo.m) < Math.abs(best.x - geo.m) ? rt : best), null);
        geo.numericAgreement = near ? Math.abs(near.x - geo.m) / geo.m : NaN;
        geo.numericRoot = near;
      }
    }

    // forces and power
    const pw = { inst_hp: NaN, inst_kW: NaN, req_hp: NaN, req_kW: NaN, margin_hp: NaN, margin_pct: NaN, cr_shaft_hp: NaN, cr_shaft_kW: NaN, cr_elec_kW: NaN, inst_elec_kW: NaN, throttle: NaN };
    const forces = { L_lbf: NaN, D_lbf: NaN, L_N: NaN, D_N: NaN, D_fromPolar_lbf: NaN };
    let env = null;
    if (wsOK && model) env = E.envelopeAt(model, ws);
    R.envelope = env;
    if (Wok && wpOK) { pw.inst_hp = W / wp; pw.inst_kW = pw.inst_hp * U.HP_KW; pw.inst_elec_kW = pw.inst_kW / spec.etaSys; }
    if (Wok && env) {
      if (env.wp === Infinity) { pw.req_hp = 0; pw.req_kW = 0; }
      else if (num(env.wp) && env.wp > 0) { pw.req_hp = W / env.wp; pw.req_kW = pw.req_hp * U.HP_KW; }
      pw.reqGov = env.gov;
      if (num(pw.inst_hp) && num(pw.req_hp)) { pw.margin_hp = pw.inst_hp - pw.req_hp; pw.margin_kW = pw.margin_hp * U.HP_KW; pw.margin_pct = pw.req_hp > 0 ? 100 * (pw.inst_hp / pw.req_hp - 1) : NaN; }
    }
    if (Wok && aero.valid) {
      forces.L_lbf = cr.r * W; forces.D_lbf = forces.L_lbf / aero.LD;
      forces.L_N = forces.L_lbf * U.LBF_N; forces.D_N = forces.D_lbf * U.LBF_N;
      if (num(geom.S_ft2)) forces.D_fromPolar_lbf = aero.q * geom.S_ft2 * aero.CD;
      pw.cr_shaft_hp = forces.D_lbf * cr.V / (E.CONST.hp * spec.etaProp);
      pw.cr_shaft_kW = pw.cr_shaft_hp * U.HP_KW;
      pw.cr_elec_kW = pw.cr_shaft_kW / spec.etaSys;
      pw.cr_shaft_fromConstraint_hp = W / cr.wp(ws);
      if (num(pw.inst_hp)) pw.throttle = pw.cr_shaft_hp / pw.inst_hp;
    }
    const Ekwh = sz.status === 'ok' && sz.energy ? sz.energy.installed_kWh : NaN, Euse = sz.status === 'ok' && sz.energy ? sz.energy.usable_kWh : NaN;
    pw.cRate_cruise = Ekwh > 0 ? pw.cr_elec_kW / Ekwh : NaN;
    pw.cRate_takeoff = Ekwh > 0 ? pw.inst_elec_kW / Ekwh : NaN;
    pw.endurance_h = Euse > 0 && pw.cr_elec_kW > 0 ? Euse / pw.cr_elec_kW : NaN;
    pw.cont = { known: num(spec.Pcont), rating_kW: spec.Pcont };
    if (pw.cont.known && num(pw.cr_shaft_kW)) { pw.cont.margin_kW = spec.Pcont - pw.cr_shaft_kW; pw.cont.ok = pw.cont.margin_kW >= -1e-9 * spec.Pcont; pw.cont.aboveInstalled = num(pw.inst_kW) && spec.Pcont > pw.inst_kW * (1 + 1e-12); }
    pw.elec = { known: num(spec.Pelec), cap_kW: spec.Pelec };
    if (pw.elec.known && num(pw.inst_elec_kW)) { pw.elec.margin_kW = spec.Pelec - pw.inst_elec_kW; pw.elec.ok = pw.elec.margin_kW >= -1e-9 * spec.Pelec; }
    R.power = pw; R.forces = forces;

    // constraint evaluation at the design point
    const ev = E.evaluatePoint(model, ws, wp);
    R.ev = ev;
    R.stall = E.stallSpeeds(p, ws);

    // checks and overall status
    R.checks = buildChecks(R, spec);
    const counted = R.checks.filter((c) => c.counts);
    const fails = counted.filter((c) => c.status === 'fail'), indet = counted.filter((c) => c.status === 'indeterminate');
    R.status = fails.length ? 'infeasible' : indet.length ? 'indeterminate' : 'feasible';
    R.statusReasons = (fails.length ? fails : indet).map((c) => c.detail || c.label);
    R.unverifiedCount = R.checks.filter((c) => c.status === 'unverified').length;
    R.implementedCount = R.checks.filter((c) => c.group === 'Performance constraints' && c.status !== 'unverified').length;
    return R;
  }

  function buildChecks(R, spec) {
    const out = [];
    const add = (o) => out.push(Object.assign({ counts: true }, o));
    const errKeys = Object.keys(R.errors);
    add({ id: 'inputs', group: 'Inputs', label: 'Input validation', status: errKeys.length ? 'indeterminate' : 'pass', detail: errKeys.length ? errKeys.length + ' input' + (errKeys.length > 1 ? 's need' : ' needs') + ' attention' : 'All inputs are valid numbers in range.' });
    const sz = R.sizing;
    const sizeStatus = sz.status === 'ok' ? 'pass' : sz.status === 'infeasible' || sz.status === 'overconstrained' ? 'fail' : 'indeterminate';
    add({ id: 'closure', group: 'Weight and energy', label: 'Mass and energy closure', status: sizeStatus, detail: sz.status === 'ok' ? 'm0 = m_empty + m_battery + m_payload closes (residual ' + (Number.isFinite(sz.closureResidual) ? sz.closureResidual.toExponential(1) : '—') + ' kg).' : sz.message });
    if (sz.status === 'ok' && Number.isFinite(sz.mtowMargin)) {
      const f = spec.formulation;
      const label = f.mode === 'B' ? 'Reference payload fits' : 'MTOW limit (check only)';
      add({ id: 'mtow', group: 'Weight and energy', label, status: sz.mtowMargin >= 0 ? 'pass' : 'fail',
        detail: f.mode === 'B' ? (sz.mtowMargin >= 0 ? 'The reference payload fits with ' + sz.mtowMargin.toFixed(1) + ' kg of takeoff-mass margin.' : 'Carrying the reference payload needs ' + (-sz.mtowMargin).toFixed(1) + ' kg more takeoff mass than prescribed.')
          : (sz.mtowMargin >= 0 ? sz.mtowMargin.toFixed(1) + ' kg below the MTOW limit.' : 'Required takeoff mass is ' + (-sz.mtowMargin).toFixed(1) + ' kg above the MTOW limit.') });
    }
    if (R.point.def === 'geometry') {
      const g = R.point.geo;
      add({ id: 'geo', group: 'Weight and energy', label: 'Fixed-geometry closure', status: g && g.ok ? 'pass' : (R.errors.S || R.errors.P ? 'indeterminate' : 'fail'), detail: g ? g.message : '' });
    }
    if (spec.ldMode === 'coupled') add({ id: 'aero', group: 'Aerodynamics', label: 'Cruise aerodynamics', status: R.aero.valid ? 'pass' : 'indeterminate', detail: R.aero.valid ? 'L/D computed from the drag polar at the selected W/S.' : 'Cruise L/D cannot be computed with the current inputs.' });
    const ev = R.ev;
    for (const row of ev.rows) {
      let status, detail;
      if (!row.enabled) { status = 'off'; detail = 'Not enforced (switched off).'; }
      else if (!row.valid) { status = 'indeterminate'; detail = row.issue || 'Cannot be evaluated.'; }
      else if (row.satisfied === null) { status = 'indeterminate'; detail = 'Design point is not valid.'; }
      else if (row.satisfied) { status = 'pass'; detail = row.type === 'power' ? 'Allowable W/P ' + row.value.toFixed(2) + ' lbf/hp; margin ' + row.margin.toFixed(2) + ' lbf/hp (' + row.marginPct.toFixed(1) + ' %).' : 'W/S limit ' + row.value.toFixed(2) + ' lbf/ft²; margin ' + row.margin.toFixed(2) + ' lbf/ft² (' + row.marginPct.toFixed(1) + ' %).'; }
      else { status = 'fail'; detail = R.E.violationMessage(row, ev.ws, ev.wp); }
      add({ id: 'c-' + row.id, group: 'Performance constraints', label: row.name, status, detail, counts: row.enabled, row });
    }
    if (ev.pointErrors.length) add({ id: 'point', group: 'Performance constraints', label: 'Design point', status: 'indeterminate', detail: ev.pointErrors.join(' ') });
    const pw = R.power;
    add({ id: 'p-cont', group: 'Power', label: 'Continuous cruise power', counts: pw.cont.known,
      status: !pw.cont.known ? 'unverified' : pw.cont.ok === undefined ? 'indeterminate' : pw.cont.ok ? 'pass' : 'fail',
      detail: !pw.cont.known ? 'No continuous motor rating given: continuous cruise operation is not verified.' : pw.cont.ok === undefined ? 'Cruise power is not available.' : (pw.cont.ok ? 'Continuous rating exceeds cruise shaft power by ' : 'Cruise shaft power exceeds the continuous rating by ') + Math.abs(pw.cont.margin_kW).toFixed(1) + ' kW.' });
    add({ id: 'p-elec', group: 'Power', label: 'Electrical power capability', counts: pw.elec.known,
      status: !pw.elec.known ? 'unverified' : pw.elec.ok === undefined ? 'indeterminate' : pw.elec.ok ? 'pass' : 'fail',
      detail: !pw.elec.known ? 'No battery/inverter power capability given: not verified.' : pw.elec.ok === undefined ? 'Installed power is not available.' : (pw.elec.ok ? 'Capability exceeds the electrical input at installed shaft power by ' : 'Electrical input at installed shaft power exceeds the capability by ') + Math.abs(pw.elec.margin_kW).toFixed(1) + ' kW.' });
    for (const u of UNVERIFIED) add({ id: 'u-' + u.id, group: 'Not modeled', label: u.name, status: 'unverified', detail: u.note, counts: false });
    return out;
  }

  /* ------------------------------------------------------------------ *
   * 10. Study variables and outputs (shared by trade studies and optimizer)
   * ------------------------------------------------------------------ */
  const VARIABLES = {
    range: { sym: 'R', label: 'Design range', q: 'length', unit: 'nm', get: (s) => s.range, set: (s, v) => { s.range = v; }, dom: [0, Infinity, true], study: [150, 350] },
    payload: { sym: 'm_pay', label: 'Payload mass', q: 'mass', unit: 'kg', get: (s) => s.payload, set: (s, v) => { s.payload = v; }, dom: [0, Infinity, true], study: [160, 480] },
    takeoffMass: { sym: 'm0', label: 'Takeoff mass', q: 'mass', unit: 'kg', get: (s) => s.takeoffMass, set: (s, v) => { s.takeoffMass = v; }, dom: [0, Infinity, false], study: [800, 1600] },
    batteryMass: { sym: 'm_bat', label: 'Battery mass', q: 'mass', unit: 'kg', get: (s) => s.batteryMass, set: (s, v) => { s.batteryMass = v; }, dom: [0, Infinity, false], study: [230, 430] },
    batteryEnergy: { sym: 'E_bat', label: 'Battery energy capacity', q: 'energy', unit: 'kWh', get: (s) => s.batteryEnergy, set: (s, v) => { s.batteryEnergy = v; }, dom: [0, Infinity, false], study: [92, 172] },
    ewf: { sym: 'EWF', label: 'Empty weight fraction', q: 'none', unit: '', get: (s) => s.ewf, set: (s, v) => { s.ewf = v; }, dom: [0, 1, true, false], study: [0.35, 0.55] },
    specificEnergy: { sym: 'e*', label: 'Battery specific energy', q: 'none', unit: 'Wh/kg', get: (s) => s.specificEnergy, set: (s, v) => { s.specificEnergy = v; }, dom: [0, Infinity, false], study: [250, 650] },
    usable: { sym: 'φ', label: 'Usable energy fraction', q: 'none', unit: '', get: (s) => s.usable, set: (s, v) => { s.usable = v; }, dom: [0, 1, false, true], study: [0.8, 1] },
    etaProp: { sym: 'ηp', label: 'Propeller efficiency', q: 'none', unit: '', get: (s) => s.etaProp, set: (s, v) => { s.etaProp = v; }, dom: [0, 1, false, true], study: [0.7, 0.9] },
    etaSys: { sym: 'η_sys', label: 'Electrical system efficiency', q: 'none', unit: '', get: (s) => s.etaSys, set: (s, v) => { s.etaSys = v; }, dom: [0, 1, false, true], study: [0.8, 1] },
    ldManual: { sym: 'L/D', label: 'Prescribed L/D', q: 'none', unit: '', get: (s) => s.ldManual, set: (s, v) => { s.ldManual = v; }, dom: [0, Infinity, false], study: [10, 20], manualOnly: true },

    if (k === 'marker') return `<circle cx="${x + 12}" cy="${y}" r="4.5" fill="${it.fill || it.color}" stroke="${it.color}" stroke-width="1.5"/>`;
    if (k === 'diamond') return `<path d="M${x + 12} ${y - 6}L${x + 18} ${y}L${x + 12} ${y + 6}L${x + 6} ${y}Z" fill="${it.color}"/>`;

  function layoutLegend(items, maxW, font) {
    const rows = [];

      if (row.length && w + iw > maxW) { rows.push({ items: row, w }); row = []; w = 0; }

  /* ---------------- label placement ---------------- */
  function placeLabels(spec, g, FONT) {
    const { sx, sy, ix, R } = g;
    const res = [], placed = [];
    const inner = { x0: R.x0 + 3, x1: R.x1 - 3, y0: R.y0 + 3, y1: R.y1 - 3 };
    const inside = (b) => b.x >= inner.x0 && b.y >= inner.y0 && b.x + b.w <= inner.x1 && b.y + b.h <= inner.y1;
    const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
    const marks = (spec.markers || []).filter((k) => Number.isFinite(k.x) && Number.isFinite(k.y))
      .map((k) => ({ x: sx(k.x) - 13, y: sy(k.y) - 13, w: 26, h: 26 }));
    const fns = (spec.lines || []).filter((l) => l.fn && l.obstacle).map((l) => l.fn);
    const vxs = (spec.vlines || []).filter((v) => v.obstacle !== false && Number.isFinite(v.x)).map((v) => sx(v.x));
    function clear(b) {
      if (!inside(b)) return false;
      for (const p of placed) if (hit(b, p)) return false;
      for (const k of marks) if (hit(b, k)) return false;
      for (const vx of vxs) if (vx >= b.x - 3 && vx <= b.x + b.w + 3) return false;
      for (const fn of fns) {
        for (let j = 0; j <= 12; j++) {
          const y = fn(ix(b.x + (b.w * j) / 12));
          if (!Number.isFinite(y)) continue;
          const py = sy(y);
          if (py >= b.y - 2 && py <= b.y + b.h + 2) return false;

    }

    for (const ln of spec.lines || []) {
      if (!ln.label || !ln.fn) continue;
      const w = textWidth(ln.label, font) + 2 * pad, h = fs + 2 * pad;
      let best = null;
      for (const f of ln.labelAt || [0.6, 0.5, 0.7, 0.4, 0.8, 0.3, 0.9, 0.2]) {
        const cx = R.x0 + f * R.w;
        const yc = ln.fn(ix(cx));
        if (!Number.isFinite(yc)) continue;
        const pyc = sy(yc);
        if (pyc < R.y0 || pyc > R.y1) continue;
        let top = Infinity, bot = -Infinity;
        for (let j = 0; j <= 12; j++) {
          const y = ln.fn(ix(cx - w / 2 + (w * j) / 12));
          if (!Number.isFinite(y)) continue;
          const py = sy(y);
          if (py < top) top = py;
          if (py > bot) bot = py;
        }
        for (const b of [{ x: cx - w / 2, y: top - 6 - h, w, h }, { x: cx - w / 2, y: bot + 6, w, h }]) {
          if (clear(b)) { best = b; break; }
        }
        if (best) break;
      }
      if (best) { placed.push(best); res.push({ kind: 'box', box: best, text: ln.label, color: ln.labelColor || ln.color, fs, weight }); }
    }

    for (const v of spec.vlines || []) {

    const rl = spec.regionLabel;

          y = Math.min(y, yb - h - 5);

          const b = { x: cx - w / 2, y, w, h };

          const score = avail - 0.12 * Math.abs(cx - (xa + xb) / 2);
          if (score > bestScore) { bestScore = score; best = b; }

      if (best) { placed.push(best); res.push({ kind: 'box', box: best, text: rl.text, color: rl.color || null, fs: fsR, weight: 700, region: true }); }
    }

  }

  function labelMarkup(labs, pal) {
    let s = '';

      const b = L.box, col = L.color || pal.ink;
      if (L.kind === 'vbox') {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
        s += `<g transform="translate(${r2(cx)} ${r2(cy)}) rotate(-90)"><rect x="${r2(-b.h / 2)}" y="${r2(-b.w / 2)}" width="${r2(b.h)}" height="${r2(b.w)}" rx="2" fill="${pal.plot}" fill-opacity="0.9"/>` +
          `<text x="0" y="${r2(L.fs * 0.36)}" text-anchor="middle" font-size="${L.fs}" font-weight="${L.weight}" fill="${col}">${esc(L.text)}</text></g>`;
      } else {
        if (!L.region) s += `<rect x="${r2(b.x)}" y="${r2(b.y)}" width="${r2(b.w)}" height="${r2(b.h)}" rx="2" fill="${pal.plot}" fill-opacity="0.9"/>`;
        s += `<text x="${r2(b.x + b.w / 2)}" y="${r2(b.y + b.h / 2 + L.fs * 0.36)}" text-anchor="middle" font-size="${L.fs}" font-weight="${L.weight}" fill="${col}">${esc(L.text)}</text>`;

    return s;
  }

  /* ---------------- markers ---------------- */
  function markerMarkup(markers, sx, sy, R, pal, FONT, hits) {
    let s = '';
    const pts = [];
    for (const p of markers || []) {
      if (!Number.isFinite(p.x) || !Number.isFinite(p.y)) continue;
      const px = sx(p.x), py = sy(p.y);
      if (!Number.isFinite(px) || !Number.isFinite(py)) continue;
      if (px < R.x0 - 0.5 || px > R.x1 + 0.5 || py < R.y0 - 0.5 || py > R.y1 + 0.5) continue;
      pts.push({ p, px, py });
    }
    for (const { p, px, py } of pts) {
      const X = r2(px), Y = r2(py), c = p.color || pal.ink;
      if (p.kind === 'active') {
        s += `<circle cx="${X}" cy="${Y}" r="11" fill="none" stroke="${pal.plot}" stroke-width="4" stroke-opacity="0.85"/>` +
          `<circle cx="${X}" cy="${Y}" r="11" fill="none" stroke="${c}" stroke-width="1.4"/>` +
          `<path d="M${r2(px - 17)} ${Y}H${r2(px - 7)}M${r2(px + 7)} ${Y}H${r2(px + 17)}M${X} ${r2(py - 17)}V${r2(py - 7)}M${X} ${r2(py + 7)}V${r2(py + 17)}" stroke="${c}" stroke-width="1.4"/>` +
          `<circle cx="${X}" cy="${Y}" r="4.6" fill="${p.fill || c}" stroke="${pal.plot}" stroke-width="1.6"/>`;
      } else if (p.kind === 'opt') {
        s += `<path d="M${X} ${r2(py - 8)}L${r2(px + 8)} ${Y}L${X} ${r2(py + 8)}L${r2(px - 8)} ${Y}Z" fill="${c}" stroke="${pal.plot}" stroke-width="1.6"/>`;
      } else if (p.kind === 'ref') {
        s += `<rect x="${r2(px - 4.5)}" y="${r2(py - 4.5)}" width="9" height="9" fill="${p.fill || c}" stroke="${pal.plot}" stroke-width="1.4"/>`;
      } else if (p.kind === 'hollow') {

      } else {

      const sides = p.labelPos === 'left' ? ['l', 'r'] : ['r', 'l'];

  /* ---------------- full render ---------------- */

    out.push(`<defs><clipPath id="${id}-clip"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath></defs>`);

      if (ylog) { for (const v of yt.minor) minor += `M${R.x0} ${r2(sy(v))}H${R.x1}`; }
      else { const my = yt.step / 5; if (my * ky >= 7) for (let k = Math.ceil(y0 / my - 1e-9), n = 0; k * my <= y1 + 1e-9 && n < 800; k++, n++) minor += `M${R.x0} ${r2(sy(k * my))}H${R.x1}`; }

      if (minor) body.push(`<path d="${minor}" stroke="${pal.gridMinor}" stroke-width="1" fill="none"/>`);

      body.push(`<image href="${im.href}" x="${r2(Math.min(ax, bx))}" y="${r2(Math.min(ay, by))}" width="${r2(Math.abs(bx - ax))}" height="${r2(Math.abs(by - ay))}" preserveAspectRatio="none"${im.opacity != null ? ` opacity="${im.opacity}"` : ''}/>`);
    }
    for (const f of spec.fills || []) {
      const pts = [];
      for (const q of f.points) { const px = sx(q[0]), py = sy(q[1]); if (Number.isFinite(px) && Number.isFinite(py)) pts.push([px, py]); }
      const c = clipPolygon(pts, RP);
      if (c.length >= 3) body.push(`<path d="M${c.map((q) => r2(q[0]) + ' ' + r2(q[1])).join('L')}Z" fill="${f.color}" fill-opacity="${f.opacity == null ? 1 : f.opacity}" stroke="none"/>`);

            if (box.x < R.x0 + 1 || box.x + box.w > R.x1 - 1) continue;
            if (tplaced.some((b) => box.x < b.x + b.w && b.x < box.x + box.w && box.y < b.y + b.h && b.y < box.y + box.h)) continue;

          px = qx; py = qy; break;
        }
        if (!Number.isFinite(px)) continue;
        tx += `<text x="${r2(px)}" y="${r2(py)}" text-anchor="${t.anchor || 'start'}" font-size="${t.size || 11.5}" font-weight="${t.weight || 700}" fill="${t.color || pal.ink}"${t.halo === false ? '' : ` stroke="${pal.plot}" stroke-width="3" stroke-linejoin="round" paint-order="stroke"`}>${esc(t.text)}</text>`;
      }
      if (tx) out.push(`<g>${tx}</g>`);

    if (spec.showLabels !== false) out.push(labelMarkup(placeLabels(spec, { sx, sy, ix, iy, R }, FONT), pal));
    for (const v of spec.vlines || []) {
      if (!v.offAxisNote || !Number.isFinite(v.x)) continue;

      const right = px > R.x1;
      out.push(`<text x="${right ? R.x1 - 8 : R.x0 + 8}" y="${R.y0 + 18}" text-anchor="${right ? 'end' : 'start'}" font-size="11.5" font-weight="700" fill="${v.color}" stroke="${pal.plot}" stroke-width="3" paint-order="stroke">${esc((right ? '' : '\u2039 ') + v.offAxisNote + (right ? ' \u203A' : ''))}</text>`);

    for (const v of yt.values) { const Y = r2(sy(v)); tk += `M${R.x0} ${Y}h-5`; tl += `<text x="${r2(R.x0 - 8)}" y="${r2(Y + 4)}" text-anchor="end">${ylog ? logTickText(v) : spec.yFmt ? esc(spec.yFmt(v)) : tickText(v, yt.step)}</text>`; }
    out.push(`<rect x="${R.x0}" y="${R.y0}" width="${pw}" height="${ph}" fill="none" stroke="${pal.axis}" stroke-width="1.2"/>`);

    const E = R.E, ws = R.point.ws, r = a.r, rho = a.rho, k = a.k, CD0 = a.CD0, Vc = a.V_kt;
    const W = R.weight.W_lbf, etaP = SPEC.etaProp;
    const v = state.aeroView;
    const markers = [], lines = [], hlines = [], texts = [];
    if (v === 'polar') {
      const CLs = [], CDs = [];
      const top = Math.max(1.6, a.CL * 1.3, a.CLstar * 1.5);
      for (let i = 0; i <= 200; i++) { const CL = top * i / 200; CLs.push(CL); CDs.push(CD0 + k * CL * CL); }
      lines.push({ x: CDs, y: CLs, color: col.cruise, width: 2.4, fn: null });
      const CDstar = CD0 + k * a.CLstar * a.CLstar;
      lines.push({ x: [0, CDstar * 1.9], y: [0, a.LDmax * CDstar * 1.9], color: col.muted, width: 1.2, dash: '5 4' });
      const crAbove = a.CL > a.CLstar;
      markers.push({ id: 'best', x: CDstar, y: a.CLstar, kind: 'ref', color: col.envelope, label: 'L/D max ' + fmt(a.LDmax, 2), labelPos: crAbove ? 'below' : 'left' });
      markers.push({ id: 'cr', x: a.CD, y: a.CL, kind: 'active', color: col.point, fill: col.cruise, label: 'Cruise ' + fmt(a.LD, 2), labelPos: crAbove ? 'left' : 'below' });
      const xMax = Math.max(CD0 + k * top * top, a.CD * 1.4);
      return { xLabel: 'Drag coefficient CD', yLabel: 'Lift coefficient CL', home: { x0: 0, x1: xMax, y0: 0, y1: top * 1.05 }, lines, markers, hlines, texts, showLabels: false, grid: true };
    }
    const Vs = [], LDs = [], Ps = [];
    const Vlo = Math.max(25, 0.35 * Vc), Vhi = Math.max(Vc * 1.9, a.V_bestLD_kt * 1.6);
    for (let i = 0; i <= 300; i++) {
      const V = Vlo + (Vhi - Vlo) * i / 300, Vf = V * E.CONST.kt_to_fts, q = 0.5 * rho * Vf * Vf, CL = r * ws / q, CD = CD0 + k * CL * CL, LD = CL / CD;
      Vs.push(V); LDs.push(LD);
      Ps.push(isNum(W) ? (r * W / LD) * Vf / (E.CONST.hp * etaP) * U.HP_KW : NaN);
    }
    if (v === 'ld') {
      lines.push({ x: Vs, y: LDs, color: col.cruise, width: 2.4 });
      const crFast = Vc > a.V_bestLD_kt;
      markers.push({ id: 'best', x: a.V_bestLD_kt, y: a.LDmax, kind: 'ref', color: col.envelope, label: 'L/D max ' + fmt(a.LDmax, 2), labelPos: crFast ? 'left' : 'right' });
      markers.push({ id: 'mp', x: a.V_minP_kt, y: a.LD_minP, kind: 'hollow', color: col.muted, label: 'Min power', labelPos: 'below' });
      markers.push({ id: 'cr', x: Vc, y: a.LD, kind: 'active', color: col.point, fill: col.cruise, label: 'Cruise ' + fmt(a.LD, 2), labelPos: crFast ? 'right' : 'left' });
      if (state.ldMode === 'manual' && isNum(R.ld.manual)) hlines.push({ y: R.ld.manual, color: col.warn, width: 1.6, dash: '6 4', label: 'Prescribed L/D ' + fmt(R.ld.manual, 2), labelLeft: true });
      const yMax = Math.max(a.LDmax, isNum(R.ld.manual) && state.ldMode === 'manual' ? R.ld.manual : 0) * 1.15;
      return { xLabel: 'True airspeed (kt) at W/S ' + fmt(ws, 1) + ' lbf/ft² and cruise density', yLabel: 'Lift-to-drag ratio L/D', home: { x0: Vlo, x1: Vhi, y0: 0, y1: yMax }, lines, markers, hlines, texts, showLabels: false, grid: true };
    }
    if (!isNum(W)) return { empty: 'Power required needs a takeoff weight; the current sizing does not provide one.' };
    lines.push({ x: Vs, y: Ps, color: col.cruise, width: 2.4 });
    const Pcr = R.power.cr_shaft_kW, Pin = R.power.inst_kW;
    if (isNum(Pin)) hlines.push({ y: Pin, color: col.takeoff, width: 1.8, dash: '6 4', label: 'Installed shaft power ' + fmt(Pin, 1) + ' kW', labelLeft: true });
    if (R.power.cont.known) hlines.push({ y: R.power.cont.rating_kW, color: col.warn, width: 1.6, dash: '2 3', label: 'Continuous rating ' + fmt(R.power.cont.rating_kW, 1) + ' kW', labelLeft: true });
    markers.push({ id: 'cr', x: Vc, y: Pcr, kind: 'active', color: col.point, fill: col.cruise, label: 'Cruise ' + fmt(Pcr, 1) + ' kW', labelPos: 'right' });
    const mpP = (() => { const Vf = a.V_minP_kt * E.CONST.kt_to_fts, q = 0.5 * rho * Vf * Vf, CL = r * ws / q, LD = CL / (CD0 + k * CL * CL); return (r * W / LD) * Vf / (E.CONST.hp * etaP) * U.HP_KW; })();
    markers.push({ id: 'mp', x: a.V_minP_kt, y: mpP, kind: 'hollow', color: col.muted, label: 'Min power', labelPos: 'below' });
    const yMax = Math.max(...Ps.filter(isNum), isNum(Pin) ? Pin : 0) * 1.1;
    return { xLabel: 'True airspeed (kt) at cruise density', yLabel: 'Shaft power required (kW)', home: { x0: Vlo, x1: Vhi, y0: 0, y1: yMax }, lines, markers, hlines, texts, showLabels: false, grid: true };
  }
  function aeroHover(x, y) {
    const a = R.aero; if (!a.valid) return null;
    const E = R.E, ws = R.point.ws, r = a.r;
    if (state.aeroView === 'polar') {
      if (!(y > 0)) return null;
      const CD = a.CD0 + a.k * y * y;
      return `<div class="tt-h">CL ${fmt(y, 3)}<span>CD ${fmt(CD, 5)}</span></div><div class="tt-r">L/D on the polar<b>${fmt(y / CD, 3)}</b></div><div class="tt-r">Equivalent TAS at the design W/S<b>${fmt(Math.sqrt(2 * r * ws / (a.rho * y)) / E.CONST.kt_to_fts, 1)} kt</b></div>`;
    }
    if (!(x > 0)) return null;
    const Vf = x * E.CONST.kt_to_fts, q = 0.5 * a.rho * Vf * Vf, CL = r * ws / q, CD = a.CD0 + a.k * CL * CL, LD = CL / CD;
    const W = R.weight.W_lbf;
    const P = isNum(W) ? (r * W / LD) * Vf / (E.CONST.hp * SPEC.etaProp) * U.HP_KW : NaN;
    return `<div class="tt-h">TAS ${fmt(x, 1)} kt<span>q ${fmt(q, 2)} lbf/ft²</span></div><div class="tt-r">CL<b>${fmt(CL, 4)}</b></div><div class="tt-r">CD<b>${fmt(CD, 5)}</b></div><div class="tt-r">L/D<b>${fmt(LD, 3)}</b></div>` +
      (isNum(P) ? `<div class="tt-r">Shaft power required<b>${fmt(P, 1)} kW</b></div><div class="tt-r">Electrical input<b>${fmt(P / SPEC.etaSys, 1)} kW</b></div>` : '');
  }

  /* ================= 14. Mass budget ================= */
  function budgetHTML(r, big) {
    const sz = r.sizing, f = state.formulation;
    const mU = state.units.mass, alt = mU === 'kg' ? 'lb' : 'kg';
    const M = (kg) => (mU === 'kg' ? fmt(kg, 1) + ' kg' : fmt(kg / U.LB_KG, 0) + ' lb');
    const A = (kg) => (alt === 'kg' ? fmt(kg, 1) + ' kg' : fmt(kg / U.LB_KG, 0) + ' lb');
    if (sz.status === 'ok') {
      const segs = [{ k: 'empty', label: 'Empty', kg: sz.emptyMass }];
      const E = sz.energy;
      if (sz.extended && E && E.installed_kWh > 0) {
        const mb = sz.batteryMass, fi = (x) => mb * x / E.installed_kWh;
        segs.push({ k: 'battery', label: 'Battery: cruise energy', kg: fi(E.cruise_kWh) });
        if (E.reserve_kWh > 1e-12) segs.push({ k: 'reserve', label: 'Battery: reserve energy', kg: fi(E.reserve_kWh) });
        if (E.unusable_kWh > 1e-12) segs.push({ k: 'unusable', label: 'Battery: unusable energy', kg: fi(E.unusable_kWh) });
      } else segs.push({ k: 'battery', label: 'Battery', kg: sz.batteryMass });
      if (f.mode === 'B' && SPEC.payload > 0) {
        const ref = Math.min(SPEC.payload, sz.payloadMass);
        segs.push({ k: 'payload', label: 'Reference payload', kg: ref });
        if (sz.payloadMass - ref > 1e-9) segs.push({ k: 'spare', label: 'Spare payload capacity', kg: sz.payloadMass - ref });
      } else segs.push({ k: 'payload', label: 'Payload', kg: sz.payloadMass });
      const limitApplies = SZ.role('takeoffMass', f) === 'constraint';
      const limit = limitApplies ? SPEC.takeoffMass : null;
      if (limit !== null && limit > sz.takeoffMass) segs.push({ k: 'margin', label: 'MTOW margin', kg: limit - sz.takeoffMass });
      const scale = limit !== null ? Math.max(limit, sz.takeoffMass) : sz.takeoffMass;
      const over = limit !== null && limit < sz.takeoffMass;
      let s = `<div class="budget-eq"><span><strong>${M(sz.takeoffMass)}</strong> = ${M(sz.emptyMass)} + ${M(sz.batteryMass)} + ${M(sz.payloadMass)}</span><span class="faint">m<sub>0</sub> = m<sub>empty</sub> + m<sub>battery</sub> + m<sub>payload</sub></span></div>`;
      s += '<div class="budget-bar" role="img" aria-label="Mass budget">' + segs.map((g) => `<div class="seg-m ${g.k}" style="width:${(100 * g.kg / scale).toFixed(3)}%" title="${esc(g.label)}: ${M(g.kg)}">${g.kg / scale > 0.11 ? esc(g.label.replace('Battery: ', '')) : ''}</div>`).join('');
      if (limit !== null) s += `<div class="limit-mark${limit / scale > 0.7 ? ' end' : limit / scale < 0.3 ? ' start' : ''}" style="left:${(100 * limit / scale).toFixed(3)}%"><span>${over ? 'MTOW limit ' + M(limit) + ', exceeded by ' + M(sz.takeoffMass - limit) : 'MTOW limit ' + M(limit)}</span></div>`;
      s += '</div>';
      s += '<ul class="budget-legend">' + segs.map((g) => `<li><span class="sw seg-m ${g.k}" style="height:11px"></span><span>${esc(g.label)}</span><span class="lgv">${M(g.kg)}</span><span class="lgv alt">${A(g.kg)}</span><span class="lgv alt">${g.k === 'margin' ? pct(g.kg / limit, 1) + ' of limit' : pct(g.kg / sz.takeoffMass, 1)}</span></li>`).join('') + '</ul>';
      if (big) s += `<p class="faint" style="margin-top:8px;font-size:12.5px">Mass closure residual m<sub>empty</sub> + m<sub>battery</sub> + m<sub>payload</sub> − m<sub>0</sub> = ${esc(sz.closureResidual.toExponential(2))} kg.</p>`;
      return s;
    }
    if (sz.status === 'infeasible' && isNum(sz.batteryFraction)) {
      const parts = [{ k: 'empty', label: 'Empty', f: SPEC.ewf }, { k: 'battery', label: 'Battery', f: sz.batteryFraction }];
      if (f.mode === 'C') parts[1] = { k: 'payload', label: 'Payload', f: SPEC.payload / SPEC.takeoffMass };
      const sum = parts.reduce((a, b) => a + b.f, 0), sc = Math.max(sum, 1) * 1.03;
      return `<div class="budget-eq"><strong>EWF + ${f.mode === 'C' ? 'm<sub>payload</sub>/m<sub>0</sub>' : 'f<sub>battery</sub>'} = ${fmt(sum, 4)}</strong></div>` +
        '<div class="budget-bar">' + parts.map((p) => `<div class="seg-m ${p.k}" style="width:${(100 * p.f / sc).toFixed(3)}%">${p.f / sc > 0.12 ? esc(p.label) + ' ' + pct(p.f, 1) : ''}</div>`).join('') +
        `<div class="seg-m over" style="width:${(100 * Math.max(sum - 1, 0) / sc).toFixed(3)}%"></div><div class="limit-mark${1 / sc > 0.7 ? ' end' : ''}" style="left:${(100 / sc).toFixed(3)}%"><span>100 % of m<sub>0</sub></span></div></div>` +
        `<p class="overflow-note">${esc(sz.message)}</p>`;
    }
    return `<div class="budget-empty">${esc(sz.message || 'The mass budget appears once the design is fully determined.')}</div>`;
  }

  /* ================= 15. Checklist ================= */
  function checklistHTML(r) {
    const groups = {};
    for (const c of r.checks) (groups[c.group] = groups[c.group] || []).push(c);
    const icon = (s) => ({ pass: '✓', fail: '✕', indeterminate: '!', unverified: '?', off: '–' }[s] || '?');
    let s = '';
    for (const [g, list] of Object.entries(groups)) {
      if (g === 'Not modeled') continue;
      s += `<div class="ck-group">${esc(g)}</div><ul class="checks">` + list.map((c) => `<li><span class="ck ${c.status}" aria-label="${c.status}">${icon(c.status)}</span><span><span class="ck-l">${esc(c.label)}</span><span class="ck-d"> ${esc(c.detail || '')}</span></span></li>`).join('') + '</ul>';
    }
    const nm = groups['Not modeled'] || [];
    s += `<details class="more"><summary>${nm.length} requirements not modeled: unverified, not passed</summary><ul class="checks">` + nm.map((c) => `<li><span class="ck unverified">?</span><span><span class="ck-l">${esc(c.label)}</span><span class="ck-d"> ${esc(c.detail)}</span></span></li>`).join('') + '</ul></details>';
    return s;
  }

  /* ================= 17. Weight sizing tab ================= */
  const specSig = () => JSON.stringify(SPEC);
  let limitsCache = { sig: null, rows: null };
  function card(title, id, sub) { return h('div', { class: 'card', style: 'margin-bottom:12px' }, h('div', { class: 'card-h' }, h('span', { class: 'card-t' }, title), sub ? h('span', { class: 'card-s', id: id + 'Sub' }, sub) : null), h('div', { class: 'card-b', id })); }
  function buildSizing(panel) {
    panel.append(
      h('p', { class: 'panel-intro' }, 'Electric Breguet range model and mass closure from the source sizing tool, fed with the cruise L/D of the selected configuration. These are the same numbers the status strip, inspector and constraint diagram use.'),

  }
  function readout(label, primary, secondary, opts) {
    opts = opts || {};
    return `<div class="readout${opts.tone ? ' ' + opts.tone : ''}"><dt>${esc(label)}${opts.input ? '<span class="tag">input</span>' : ''}</dt><dd><span class="r1">${primary}</span>${secondary ? `<span class="r2">${secondary}</span>` : ''}</dd></div>`;
  }
  function renderSizing() {
    const r = R, sz = r.sizing, f = state.formulation, sp = SPEC, a = r.aero;
    const det = r.determinacy;
    const eta = sp.etaSys * sp.etaProp, eJ = sp.specificEnergy * 3600;
    const fb = sp.range * 1852 * sp.gravity / (eta * r.ld.eff * eJ);
    let eq = `<p><b>${esc(MODE_INFO[f.mode].name)} (${f.mode}).</b> ${esc(MODE_INFO[f.mode].detail)} Solves for ${esc(det.unknowns.join(', '))}: ${esc(det.message)}.</p>`;
    eq += `<div class="eqn">f<sub>bat</sub> = R·g / (η<sub>sys</sub>·η<sub>p</sub>·(W/D)·e*) = ${fmt(sp.range * 1852, 0)} m × ${trimNum(sp.gravity, 5)} / (${trimNum(sp.etaSys, 4)} × ${trimNum(sp.etaProp, 4)} × ${fmt(r.ld.eff, 4)} × ${fmt(eJ, 0)} J/kg) = ${fmt(fb, 5)}</div>`;
    if (f.mode === 'A') eq += `<div class="eqn">m<sub>0</sub> = m<sub>pay</sub> / (1 − EWF − f<sub>bat</sub>${sz.extended ? ' − reserve and usable-energy terms' : ''}) = ${isNum(sz.takeoffMass) ? fmt(sz.takeoffMass, 3) + ' kg' : 'no positive solution'}</div>`;
    if (f.mode === 'B') eq += `<div class="eqn">m<sub>pay</sub> = m<sub>0</sub>·(1 − EWF − f<sub>bat</sub>) = ${isNum(sz.payloadMass) ? fmt(sz.payloadMass, 3) + ' kg' : 'negative: infeasible'}</div>`;
    if (f.mode === 'C') eq += `<div class="eqn">R = (η<sub>sys</sub>·η<sub>p</sub>·(W/D)·e*/g)·(m<sub>bat</sub>/m<sub>0</sub>), m<sub>bat</sub> = m<sub>0</sub>(1 − EWF) − m<sub>pay</sub> → R = ${isNum(sz.range) ? fmt(sz.range, 3) + ' nm' : '—'}</div>`;
    if (f.mode === 'D') eq += `<div class="eqn">Battery ${f.batterySpec === 'mass' ? 'mass' : 'energy'} prescribed; closure on ${esc(f.closures.join(' + ') || 'nothing yet')}.</div>`;
    if (sz.checks && sz.checks.length) {
      eq += '<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Quantity</th><th class="n">Prescribed</th><th class="n">Implied</th><th>Agrees</th></tr></thead><tbody>' +
        sz.checks.map((c) => `<tr><td>${esc(c.closure)}</td><td class="n">${fmt(c.prescribed, 3)}</td><td class="n">${fmt(c.implied, 3)}</td><td>${c.consistent ? '<span class="pf pass">yes</span>' : '<span class="pf fail">no</span>'}</td></tr>`).join('') + '</tbody></table></div>';

  }

  function drawCarpet() {
    const st = state.study, k1 = st.var1, k2 = st.var2, out = st.output;
    if (!EC.outputAvailable(out, SPEC)) { notices([]); studyEmpty(SZ.notComputedReason(out, state.formulation)); return; }
    const a = studyValues(k1, 25), b = studyValues(k2, 25);
    if (a.err || b.err) { notices([]); studyEmpty(a.err || b.err); return; }
    const shear = num(st.shear);
    if (!isNum(shear)) { notices([]); studyEmpty('Enter a numeric carpet shear.'); return; }
    const c = ES.carpet(SPEC, k1, a.vals, k2, b.vals, out);
    const col = colorSet(false), nl = [];
    const a0 = a.vals[0], a1 = a.vals[a.vals.length - 1], b0 = b.vals[0], b1 = b.vals[b.vals.length - 1];
    const CX = (x, y) => (x - a0) / (a1 - a0) + shear * (y - b0) / (b1 - b0);
    const Y = (v) => outDisp(out, v);
    const nodeY = c.nodes.cells.flat().map((s) => Y(s.y)).filter(isNum);
    if (!nodeY.length) { notices([]); studyEmpty('All ' + a.vals.length * b.vals.length + ' carpet grid points are infeasible for these ranges. Narrow the ranges or change the fixed inputs.'); return; }
    const bad = a.vals.length * b.vals.length - nodeY.length;
    if (bad) nl.push({ level: 'warning', text: bad + ' of ' + a.vals.length * b.vals.length + ' grid points do not close and are left out; their lines stop at the feasibility boundary.' });
    const f1c = col.dark ? '#2fb4c0' : '#00737F', f2c = col.dark ? '#f0793e' : '#D9541A';
    const lines = [], markers = [], texts = [], pts = [];
    for (const fam of c.fam2) lines.push({ x: fam.pts.map((p) => CX(p.a, p.b)), y: fam.pts.map((p) => Y(p.s.y)), color: f1c, width: 2.2 });
    for (const fam of c.fam1) lines.push({ x: fam.pts.map((p) => CX(p.a, p.b)), y: fam.pts.map((p) => Y(p.s.y)), color: f2c, width: 2.2 });
    for (const fam of c.fam1.concat(c.fam2)) for (const p of fam.pts) if (isNum(p.s.y)) pts.push({ x: CX(p.a, p.b), y: Y(p.s.y), a: p.a, b: p.b, s: p.s });
    c.nodes.cells.forEach((row, j) => row.forEach((s, i) => { if (isNum(s.y)) markers.push({ id: 'n' + i + '-' + j, x: CX(a.vals[i], b.vals[j]), y: Y(s.y), kind: 'hollow', color: col.muted }); }));
    const yr = yRangeFor(nodeY, { clip: st.clip, floorZero: out !== 'mtowMargin' });
    let { y0, y1 } = yr;
    const inR = (v) => isNum(v) && v >= y0 && v <= y1;
    b.vals.forEach((bv, j) => { for (let i = a.vals.length - 1; i >= 0; i--) { const v = Y(c.nodes.cells[j][i].y); if (inR(v)) { texts.push({ x: CX(a.vals[i], bv), y: v, dx: 9, dy: 4, text: varEq(k2, bv), color: f1c, avoid: true }); break; } } });
    a.vals.forEach((av, i) => { const js = b.vals.map((_, j) => j).filter((j) => inR(Y(c.nodes.cells[j][i].y))); if (!js.length) return; const jlo = js.reduce((p, q) => (Y(c.nodes.cells[q][i].y) < Y(c.nodes.cells[p][i].y) ? q : p)); texts.push({ x: CX(av, b.vals[jlo]), y: Y(c.nodes.cells[jlo][i].y), dx: -4, dy: 17, text: varEq(k1, av), color: f2c, anchor: 'start', size: 10.5, avoid: true }); });
    const n1 = EC.VARIABLES[k1].get(SPEC), n2 = EC.VARIABLES[k2].get(SPEC);
    if (n1 >= a0 && n1 <= a1 && n2 >= b0 && n2 <= b1) { const s = ES.at2(SPEC, k1, n1, k2, n2, out); if (isNum(s.y)) markers.push({ id: 'nom', x: CX(n1, n2), y: Y(s.y), kind: 'active', color: col.point, fill: col.ok, label: 'Current design' }); }
    else nl.push({ level: 'info', text: 'The current design lies outside these study ranges, so its marker is hidden.' });
    const hlines = [];
    const lim = st.showLimit ? limitLine(out) : null;
    if (lim) { const ly = Y(lim.y), span = y1 - y0; if (ly >= y0 - 0.6 * span && ly <= y1 + 0.6 * span) { y0 = Math.min(y0, ly - 0.05 * span); y1 = Math.max(y1, ly + 0.05 * span); hlines.push({ y: ly, color: col.warn, width: 2, dash: '2 3', label: lim.label + ' ' + fmt(ly, 1) + ' ' + outUnit(out), labelLeft: true }); } }
    if (yr.clipped) nl.push({ level: 'info', text: 'Some lines continue off-scale toward a feasibility boundary.' });
    notices(nl);
    clearEmpty();
    const xsAll = pts.map((p) => p.x), xMin = Math.min(...xsAll), xMax = Math.max(...xsAll), xr = xMax - xMin || 1;
    STUDY.data = { kind: 'carpet', c, pts, k1, k2, out, sx: xr, sy: (y1 - y0) || 1, a: a.vals, b: b.vals };
    STUDY.chart.o.noZoom = false; STUDY.chart.userView = null;
    STUDY.spec = { xLabel: 'Carpet offset coordinate X = ' + EC.VARIABLES[k1].label + ' + ' + fmtSig(shear, 3) + ' × ' + EC.VARIABLES[k2].label + ' (normalized; no physical scale)', yLabel: outLabel(out), xTicks: false,
      home: { x0: xMin - 0.08 * xr, x1: xMax + 0.32 * xr, y0, y1 }, grid: true, showLabels: false, lines, markers, texts, hlines };
    showHost('chart'); STUDY.chart.setSpec(STUDY.spec);
    $('#studyTitle').textContent = (EC.OUTPUTS[out].sizing ? SZ.outputLabel(out, state.formulation) : EC.OUTPUTS[out].label) + ' carpet: ' + lc(EC.VARIABLES[k1].label) + ' × ' + lc(EC.VARIABLES[k2].label);
    $('#studyHint').textContent = 'Turquoise lines: constant ' + lc(EC.VARIABLES[k2].label) + '; orange lines: constant ' + lc(EC.VARIABLES[k1].label) + '. The horizontal axis is artificial.';

  }
  function matrixTable(g, out) {

    $('#studyTable').innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${esc(EC.VARIABLES[g.k2].label)} \\ ${esc(EC.VARIABLES[g.k1].label)}</th>${g.v1.map((v) => `<th class="n">${esc(varFmt(g.k1, v))}</th>`).join('')}</tr></thead><tbody>` +
      g.cells.map((row, j) => `<tr><th>${esc(varFmt(g.k2, g.v2[j]))}</th>${row.map((s) => `<td class="n">${isNum(s.y) ? fmtSig(Y(s.y), 6) : '—'}</td>`).join('')}</tr>`).join('') + '</tbody></table></div>';

  function drawGrid(kind) {
    const st = state.study, k1 = st.var1, k2 = st.var2, out = st.output;
    if (!EC.outputAvailable(out, SPEC)) { notices([]); studyEmpty(SZ.notComputedReason(out, state.formulation)); return; }
    const a = studyValues(k1, 101), b = studyValues(k2, 101);
    if (a.err || b.err) { notices([]); studyEmpty(a.err || b.err); return; }
    const res = Math.max(11, Math.min(101, Math.round(num(st.resolution)) || 41));
    const v1 = SZ.linspace12(a.vals[0], a.vals[a.vals.length - 1], res), v2 = SZ.linspace12(b.vals[0], b.vals[b.vals.length - 1], res);
    const g = ES.grid(SPEC, k1, v1, k2, v2, out);
    const X = (v) => varDisp(k1, v), Yv = (v) => varDisp(k2, v), Z = (v) => outDisp(out, v);
    const xs = v1.map(X), ys = v2.map(Yv);
    const zMat = g.cells.map((row) => row.map((s) => Z(s.y)));
    const zFlat = zMat.flat().filter(isNum);
    const nl = [];
    if (!zFlat.length) { notices([]); studyEmpty('No determinate designs anywhere in these ranges. Widen the ranges or change the fixed inputs.'); return; }
    const rr = VZ.robustRange(zFlat, st.clip, 3);
    const col = colorSet(false);
    const title = (EC.OUTPUTS[out].sizing ? SZ.outputLabel(out, state.formulation) : EC.OUTPUTS[out].label);
    STUDY.data = { kind: kind === 'contour' ? 'contour' : 'surface', g, xs, ys, k1, k2, out, zMat };
    if (g.cells.some((row) => row.some((s) => s.st !== 'ok'))) nl.push({ level: 'warning', text: kind === 'contour' ? 'Shaded red where the mass and energy closure fails; the dashed red line is the feasibility boundary.' : 'Combinations that do not close are left as a gap in the surface.' });
    const n1 = EC.VARIABLES[k1].get(SPEC), n2 = EC.VARIABLES[k2].get(SPEC);
    const inside = n1 >= v1[0] && n1 <= v1[res - 1] && n2 >= v2[0] && n2 <= v2[res - 1];
    if (!inside) nl.push({ level: 'info', text: 'The current design lies outside these ranges, so its marker is hidden.' });
    $('#stCsvM').hidden = false;
    matrixTable(ES.grid(SPEC, k1, a.vals, k2, b.vals, out), out);
    $('#studyTitle').textContent = title + (kind === 'contour' ? ' contours over ' : ' response surface over ') + lc(EC.VARIABLES[k1].label) + ' and ' + lc(EC.VARIABLES[k2].label);
    if (kind === 'surface') {
      if (rr.clipped) nl.push({ level: 'info', text: 'Values beyond ' + fmtSig(rr.max, 4) + ' ' + outUnit(out) + ' near the feasibility boundary are omitted from the surface; turn off clipping to include them.' });
      notices(nl);
      const zClip = zMat.map((row) => row.map((v) => (isNum(v) && (v > rr.max || v < rr.min) ? NaN : v)));
      showHost('surf');
      const s0 = inside ? ES.at2(SPEC, k1, n1, k2, n2, out) : null;
      STUDY.surf.setData({ x: xs, y: ys, z: zClip, zmin: rr.min, zmax: rr.max, xLabel: varLabel(k1), yLabel: varLabel(k2), zLabel: outLabel(out), meshEvery: Math.max(1, Math.round(res / 10)),
        marker: s0 && isNum(s0.y) ? { x: X(n1), y: Yv(n2), z: Z(s0.y), label: 'Current design' } : null,
        hover: (i, j) => tipFor(g.cells[j][i], `<div class="tt-h">${esc(varFmt(k1, v1[i]))}<span>${esc(varFmt(k2, v2[j]))}</span></div><div class="tt-r">${esc(EC.OUTPUTS[out].label)}<b>${isNum(zMat[j][i]) ? fmtSig(zMat[j][i], 6) + ' ' + esc(outUnit(out)) : '—'}</b></div>`).replace('<div class="tt-f">Click to inspect this point</div>', '') });
      $('#studyHint').textContent = res + ' × ' + res + ' coupled evaluations. Drag to rotate, scroll to zoom, double-click to reset the view.';
      return;
    }
    const step = VZ.niceLevelStep(rr.max - rr.min, 11), start = Math.ceil(rr.min / step) * step;
    const zC = zMat.map((row) => row.map((v) => (isNum(v) ? Math.max(rr.min, Math.min(rr.max, v)) : NaN)));
    const img = VZ.bandedRaster(xs, ys, zC, { zmin: rr.min, zmax: rr.max, step, start: Math.floor(rr.min / step) * step });
    const images = [{ href: img, x0: xs[0], x1: xs[res - 1], y0: ys[0], y1: ys[res - 1] }];
    const mask = g.cells.map((row) => row.map((s) => s.st !== 'ok'));
    if (mask.some((r) => r.some(Boolean))) images.push({ href: VZ.maskRaster(xs, ys, mask, col.dark ? 'rgba(255,122,110,0.30)' : 'rgba(179,38,30,0.22)'), x0: xs[0], x1: xs[res - 1], y0: ys[0], y1: ys[res - 1] });
    const lines = [], texts = [];
    const dec = VZ.decimalsFor(step);
    for (let L = start; L <= rr.max + 1e-9 * Math.abs(rr.max); L += step) {
      const ch = VZ.joinSegments(VZ.contourSegments(xs, ys, zMat, L));
      if (!ch.length) continue;
      const ln = VZ.chainsToLine(ch);
      lines.push({ x: ln.x, y: ln.y, color: col.dark ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.75)', width: 1 });
      const longest = ch.reduce((p, q) => (q.length > p.length ? q : p));
      const at = (f) => longest[Math.min(longest.length - 1, Math.floor(f * (longest.length - 1)))];
      const cands = [0.5, 0.35, 0.65, 0.2, 0.8, 0.1, 0.9].map((f) => ({ x: at(f)[0], y: at(f)[1] }));
      texts.push(Object.assign({ text: fmt(L, dec), color: '#ffffff', anchor: 'middle', size: 10.5, halo: false, avoid: true, alts: cands.slice(1) }, cands[0]));
    }
    const metric = g.cells.map((row) => row.map((s) => (isNum(s.metric) ? s.metric : NaN)));
    const fb = VZ.joinSegments(VZ.contourSegments(xs, ys, metric, 0));
    if (fb.length) { const ln = VZ.chainsToLine(fb); lines.push({ x: ln.x, y: ln.y, color: col.bad, width: 2.4, dash: '6 4' }); }
    const lim = st.showLimit ? limitLine(out) : null;
    if (lim) {
      const dz = zMat.map((row) => row.map((v) => (isNum(v) ? v - outDisp(out, lim.y) : NaN)));
      const lc = VZ.joinSegments(VZ.contourSegments(xs, ys, dz, 0));
      if (lc.length) { const ln = VZ.chainsToLine(lc); lines.push({ x: ln.x, y: ln.y, color: col.dark ? '#F2B24C' : '#A15C00', width: 2.6, dash: '2 3' }); const lp = (f) => lc[0][Math.min(lc[0].length - 1, Math.floor(f * (lc[0].length - 1)))]; const cs = [0.5, 0.25, 0.75, 0.1, 0.9].map((f) => ({ x: lp(f)[0], y: lp(f)[1] })); texts.unshift(Object.assign({ dy: -6, text: lim.label, color: col.dark ? '#F2B24C' : '#A15C00', avoid: true, alts: cs.slice(1) }, cs[0])); }
      else if (zFlat.every((v) => v > outDisp(out, lim.y)) && out === 'takeoffMass') nl.push({ level: 'warning', text: 'No design in this map meets the ' + lc(lim.label) + '.' });
    }
    const markers = [];
    if (inside) markers.push({ id: 'nom', x: X(n1), y: Yv(n2), kind: 'active', color: '#000', fill: '#fff', label: 'Current design' });
    if (rr.clipped) nl.push({ level: 'info', text: 'Colours saturate above ' + fmtSig(rr.max, 4) + ' ' + outUnit(out) + ' near the feasibility boundary; hover shows exact values.' });
    notices(nl);
    clearEmpty();
    STUDY.chart.o.noZoom = false; STUDY.chart.userView = null;
    STUDY.spec = { xLabel: varLabel(k1), yLabel: varLabel(k2), home: { x0: xs[0], x1: xs[res - 1], y0: ys[0], y1: ys[res - 1] }, grid: false, showLabels: false, images, lines, texts, markers, marginRight: 92,
      decorate: (gg, pal) => VZ.colorbarSVG(gg, pal, { zmin: rr.min, zmax: rr.max, title: outLabel(out) }) };
    showHost('chart'); STUDY.chart.setSpec(STUDY.spec);
    $('#studyHint').textContent = res + ' × ' + res + ' coupled evaluations, contour step ' + fmt(step, dec) + ' ' + outUnit(out) + '. Click a point to inspect it.';
  }

      if (items.length === 1) nl.push({ level: 'info', text: 'Save iterations in Design history to compare their mass budgets here.' });

    $('#studyTable').innerHTML = '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Design</th><th class="n">m0 <span class="u">kg</span></th><th class="n">Empty</th><th class="n">Battery</th><th class="n">Payload</th><th class="n">Energy <span class="u">kWh</span></th><th class="n">L/D</th><th class="n">S <span class="u">ft²</span></th><th class="n">P <span class="u">hp</span></th><th>Status</th></tr></thead><tbody>' +

  function scenValues() {
    const st = state.study, key = st.scenKey, V = EC.VARIABLES[key];
    const parts = String(st.scenList).split(/[;,\s]+/).filter(Boolean);
    if (!parts.length) return { err: 'Enter at least one value.' };
    const vals = [];
    for (const t of parts) { const v = num(t); if (!isNum(v)) return { err: '“' + t + '” is not a number. Separate values with commas.' }; vals.push(V.q === 'mass' ? (state.units.mass === 'lb' ? v * U.LB_KG : v) : V.q === 'length' ? v / RANGE_UNITS[state.units.range] : v); }

    for (const v of vals) if (!EC.inVarDomain(key, v)) return { err: V.label + ' = ' + v + ' lies outside the valid range of this input.' };
    return { vals };
  }

    return s + '<div class="tt-f">Governing allowable W/P for each scenario</div>';
  }
  function drawScenarios() {

    const items = ES.scenarios(SPEC, key, sv.vals);
    const col = colorSet(false);

  function liveIdentities() {

      add('Drag from L/D = q·S·CD', r.forces.D_lbf, r.forces.D_fromPolar_lbf, 1e-12);
      add('Cruise shaft power D·V/(550·ηp) = W/(cruise allowable W/P)', r.power.cr_shaft_hp, r.power.cr_shaft_fromConstraint_hp, 1e-12);
      if (state.ldMode === 'coupled') add('L/D passed to sizing = drag-polar L/D (coupled)', r.ld.eff * r.aero.r, r.aero.LD, 1e-15);
    }
    if (r.sizing.status === 'ok') {
      out.push({ name: 'Mass closure m_empty + m_bat + m_payload − m0 (kg)', a: r.sizing.closureResidual, b: 0, e: Math.abs(r.sizing.closureResidual) / r.sizing.takeoffMass, tol: 1e-12, pass: Math.abs(r.sizing.closureResidual) <= 1e-12 * r.sizing.takeoffMass });

  /* ================= 22. Methodology ================= */
  function buildMethod(panel) {
    const d = (title, body, open) => `<details${open ? ' open' : ''}><summary>${title}</summary><div class="mb">${body}</div></details>`;
    const eq = (s) => `<div class="eqn">${s}</div>`;
    const unv = EC.UNVERIFIED.map((u) => `<li><b>${esc(u.name)}.</b> ${esc(u.note)}</li>`).join('');
    panel.append(h('div', { class: 'method', html:
      d('Computational sequence', `<ol class="seq">
        <li>Read the shared design state. Inputs are kept as typed; invalid values are flagged and never clamped, and every dependent result is reported as indeterminate.</li>
        <li>Resolve takeoff, cruise and landing densities from density ratios or the ISA model (pressure altitude and temperature deviation).</li>
        <li>Build the Roskam-style constraint model: takeoff ground roll, landing ground roll, cruise speed.</li>
        <li>Evaluate cruise aerodynamics at the selected wing loading: q, CL, CDi, CD, L/D.</li>
        <li>Pass L/D (coupled) or the prescribed L/D (legacy) to the electric Breguet sizing of the selected formulation A–D, with the optional energy budget.</li>
        <li>Convert takeoff mass to weight force W = m·g and size the wing and motor: S = W/(W/S), P = W/(W/P), b = √(AR·S), c = S/b.</li>
        <li>Evaluate the design point against every enforced constraint, report power quantities and margins, and combine all checks into the feasibility status.</li>
      </ol><p>L/D depends on wing loading, not on absolute weight, because CL = r·(W/S)/q. With W/S as the design variable the chain therefore has no loop: it is solved in closed form in one pass (about 40 µs), and every slider, drag or study point re-runs the whole chain. Holding the wing area fixed instead does create a loop; see <i>Fixed-geometry closure</i>.</p>`, true) +
      d('Electric weight sizing (source: electric aircraft sizing and trade studies)', `<p>Constant-mass electric Breguet range with pack specific energy e* in J/kg (Wh/kg × 3600):</p>` +
        eq('R = (η<sub>sys</sub>·η<sub>p</sub>·(W/D)·e*/g)·(m<sub>bat</sub>/m<sub>0</sub>) → f<sub>bat</sub> = R·g/(η<sub>sys</sub>·η<sub>p</sub>·(W/D)·e*)') +
        eq('m<sub>0</sub> = m<sub>empty</sub> + m<sub>bat</sub> + m<sub>pay</sub>, m<sub>empty</sub> = EWF·m<sub>0</sub> (battery excluded)') +
        `<ul><li><b>A, payload-constrained:</b> m<sub>0</sub> = m<sub>pay</sub>/(1 − EWF − f<sub>bat</sub>), valid only while the denominator is positive. The takeoff-mass input is a check-only MTOW limit.</li>
        <li><b>B, MTOW-constrained:</b> m<sub>pay</sub> = m<sub>0</sub>(1 − EWF − f<sub>bat</sub>). The payload input is a reference for the margin check.</li>
        <li><b>C, maximum range:</b> m<sub>bat</sub> = m<sub>0</sub>(1 − EWF) − m<sub>pay</sub>, R from the range equation.</li>
        <li><b>D, battery-constrained:</b> battery mass or energy plus exactly one of range, payload or takeoff mass. Zero closures is underdetermined (no result is reported); more than one is over-constrained and is checked for consistency.</li></ul>
        <p>The source engine was transcribed from the minified bundle with its operation order intact; in development it matched the original bit for bit in 120,000 random cases, and it reproduces the 150 MATLAB carpet values in the Verification tab. One guard was added in the integration layer only: when 1 − EWF − f<sub>bat</sub> is zero to within round-off (≤ 10⁻¹²), the design is reported infeasible instead of an MTOW near 10¹⁹ kg.</p>`) +
      d('Aerodynamic coupling', eq('q = ½·ρ·V², CL = W<sub>cr</sub>/(q·S) = r·(W/S)<sub>TO</sub>/q, k = 1/(π·AR·e)') + eq('CDi = k·CL², CD = CD0 + CDi, L/D = CL/CD, D = q·S·CD') + eq('(L/D)<sub>max</sub> = 1/(2√(CD0·k)) at CL* = √(CD0/k)') +
        `<p>r = W<sub>cr</sub>/W<sub>TO</sub> defaults to 1.00 because a battery-electric aircraft keeps its mass. The value passed to the range equation is W<sub>TO</sub>/D = (L/D)/r, so the drag in the energy balance uses the cruise weight; with r = 1 this is simply L/D. The cruise constraint uses the same polar (D/W<sub>TO</sub> = q·CD0/(W/S) + k·r²·(W/S)/q), and the verification tab checks that L/D·r = 1/(D/W) at the design point, so the diagram and the sizing never disagree.</p>
        <p><b>Coupled mode</b> (default) computes L/D from the configuration. <b>Prescribed mode</b> reproduces the source studies with an independent L/D and always shows the difference from the drag-polar value; the two are never forced to agree.</p>
        <p>Assumptions: parabolic drag polar with constant e and clean CD0; incompressible flow; cruise at constant weight and TAS. The reference chord c = S/b is the mean geometric chord of an equivalent rectangular wing. It equals the mean aerodynamic chord only for an untapered planform; no planform (taper, sweep) is modeled.</p>`) +
      d('Constraint analysis (source: electric GA constraint analysis)', eq('Takeoff: S<sub>G,TO</sub> = 4.9·TOP + 0.009·TOP², W/P = TOP·σ<sub>TO</sub>·CL<sub>max,TO</sub>/(W/S)') + eq('Landing: S<sub>G,L</sub> = 0.265·V<sub>s,L</sub>² (kt), (W/S)<sub>TO</sub> = ½·ρ<sub>L</sub>·V<sub>s,L</sub>²·CL<sub>max,L</sub>/(W<sub>L</sub>/W<sub>TO</sub>)') + eq('Cruise: W/P = 550·η<sub>p</sub>/(V·D/W), D/W = q·CD0/(W/S) + k·r²·(W/S)/q') +
        `<ul><li>Higher W/P means less installed power for a given weight. The feasible region lies below every enforced power-loading curve and left of every enforced wing-loading limit; boundary points count as feasible.</li>
        <li>Takeoff and landing constraints describe ground roll only, not certified field length or obstacle clearance.</li>
        <li>The cruise constraint assumes the installed shaft power is available at the cruise condition (no lapse or throttle schedule).</li>
        <li>Landing uses its own density (sea level by default, as in the MATLAB script), never the takeoff density.</li>
        <li>Switching off Enforce removes a requirement from feasibility; it is then reported as not enforced.</li></ul>
        <p>The engine is the original v1.0 source refactored into a factory (for the constant-set option) with the optional cruise-weight ratio; at the defaults it is bit-identical to the original and its 163-check MATLAB-transcription suite passes unchanged.</p>`) +
      d('Fixed-geometry closure', `<p>When S and P are held instead of W/S and W/P, the wing loading depends on the unknown mass and the drag depends on wing loading, so mass and L/D are coupled. Because D(m) = q·S·CD0 + k·r²·(m·g)²/(q·S) at fixed S, the usable energy is a quadratic E(m) = c<sub>0</sub> + c<sub>1</sub>·m + c<sub>2</sub>·m², and the closure is solved in closed form:</p>` +
        eq('A: (c<sub>2</sub>/φe*)·m² − (1 − EWF − c<sub>1</sub>/φe*)·m + (m<sub>pay</sub> + c<sub>0</sub>/φe*) = 0') + eq('D (range closure): c<sub>2</sub>·m² + c<sub>1</sub>·m + c<sub>0</sub> − φ·e*·m<sub>bat</sub> = 0') +
        `<p>Mode A generally has two roots: a lighter design at lower wing loading and a heavier one on the back side of the L/D curve. The lighter root is used unless you choose otherwise; no real root means the wing cannot close the mission. As an independent check, the residual of the full loading-mode pipeline is scanned on a logarithmic grid, sign changes are bracketed and bisected to 10⁻¹³, and the agreement, iteration count and loop residual are reported.</p>`) +
      d('Energy budget and reserves', eq('E<sub>cr</sub> = D·R/(η<sub>sys</sub>·η<sub>p</sub>), E<sub>use</sub> = E<sub>cr</sub> + E<sub>res</sub>, E<sub>inst</sub> = E<sub>use</sub>/φ, m<sub>bat</sub> = E<sub>inst</sub>/e*') +
        `<ul><li>Reserve as a margin on cruise energy (E<sub>res</sub> = p·E<sub>cr</sub>), a fixed usable energy, or a time at a flight condition (cruise, or a set TAS at cruise altitude using the drag polar).</li>
        <li>Range basis prevents double counting: when the design range already contains the reserve allowance (the source convention and default), no separate reserve can be added.</li>
        <li>Usable fraction φ = 1 reproduces the source model, which applies no usable-energy factor to the pack-level specific energy.</li>
        <li>With φ = 1 and no reserve the source engine itself is called, so legacy results are unchanged.</li>
        <li>Time-based reserves are simplified estimates: steady level flight at constant weight with cruise efficiencies. There is no validated climb, descent, taxi or go-around segment model.</li></ul>`) +
      d('Power definitions', `<ul><li><b>Installed shaft power</b> P = W/(W/P): the motor rating chosen on the diagram, sized by takeoff.</li>
        <li><b>Minimum required shaft power</b> = W divided by the governing allowable W/P at the selected W/S.</li>
        <li><b>Cruise shaft power</b> = D·V/η<sub>p</sub>, identical to W divided by the cruise allowable W/P at the design W/S.</li>
        <li><b>Cruise electrical power</b> = cruise shaft power/η<sub>sys</sub>; electrical input at installed power is reported separately.</li>
        <li>Installed (peak) and continuous ratings are not interchanged. Continuous cruise operation is asserted only when a continuous motor rating is entered; otherwise it is shown as unverified. The same applies to the battery and inverter power limit.</li>
        <li>Discharge rates (C) are informational only: discharge-rate and thermal constraints are not modeled.</li></ul>`) +
      d('Units, constants and mass versus weight', `<ul><li>Exact definitions in the integration layer: 1 lb = 0.45359237 kg, 1 lbf = 4.4482216152605 N, 1 ft = 0.3048 m, 1 nm = 1852 m, 1 kt = 1852/3600 m/s, 1 hp = 550 ft·lbf/s = 745.69987158227 W, 1 Wh = 3600 J.</li>
        <li>Mass is in kg or lb (pound-mass); weight force is W = m·g in N or lbf. W/S and W/P use lbf. The gravity input (9.81 m/s² in the MATLAB source) is used consistently in the range equation and in W = m·g; with 9.81 m/s² the weight in lbf is 0.034 % larger than the mass in lb. The Excel scenario uses 9.80665 m/s², the standard gravity that makes them coincide.</li>
        <li>The constraint engine keeps the MATLAB constants ρ<sub>SL</sub> = 0.0023769 slug/ft³ and 1 kt = 1.68781 ft/s so that the original suite reproduces MATLAB to round-off. The exact option uses ρ<sub>SL</sub> = 1.225 kg/m³ = 0.00237689 slug/ft³ and the exact knot; results move by a few parts per million.</li>
        <li>ISA: T<sub>0</sub> = 288.15 K, lapse 6.5 K/km to 11 km, isothermal to 20 km, R = 287.05287 J/(kg·K), g<sub>0</sub> = 9.80665 m/s².</li></ul>`) +
      d('Trade studies and optimization', `<p>Every study point and every optimizer candidate is a full evaluate() call: the same aerodynamics, sizing, geometry and constraint checks as the main view, with no surrogate. Sensitivity curves are refined near feasibility limits by bisection on the closure metric, as in the source tool.</p>
        <p>The design-point search scans W/S densely (W/P on the governing envelope for power and mass objectives, or fixed for margin objectives), then refines with golden-section search and reports iterations, bracket width, evaluations, binding constraints and whether the optimum sits on a bound.</p>
        <ul><li>Aspect ratio can be added as a search variable, but the empty weight fraction, e and CD0 do not change with it: there is no wing-weight penalty, so a high AR looks free. An optimum on the upper AR bound is a model limitation, not a recommendation.</li>
        <li>Cruise speed and field lengths are requirements, so they are not optimized.</li>
        <li>The power–area tradeoff is computed with MTOW responding to W/S and compared with the source's fixed-weight analysis.</li></ul>`) +
      d('Not modeled (shown as unverified, never as passed)', `<ul>${unv}<li><b>FAR Part 23 compliance.</b> A feasible design satisfies only the implemented takeoff, landing and cruise constraints and the mass and energy closure.</li><li><b>Compressibility, propeller maps, motor efficiency maps, battery ageing and temperature effects, structural sizing.</b></li></ul>`) +
      d('Source traceability', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Module</th><th class="wrap">Origin</th><th class="wrap">Changes in this build</th></tr></thead><tbody>
        <tr><td>Constraint engine</td><td class="wrap">Electric GA Constraint Analysis, numerical engine v1.0 (MATLAB transcription)</td><td class="wrap">Factory for constant sets; optional cruise-weight ratio (bit-identical at 1.00). Everything else verbatim.</td></tr>
        <tr><td>Constraint verification</td><td class="wrap">Same source, verification suite (163 checks)</td><td class="wrap">Unchanged; runs against the refactored engine.</td></tr>
        <tr><td>Sizing engine</td><td class="wrap">Electric aircraft sizing and trade studies (minified React bundle)</td><td class="wrap">Transcribed with original arithmetic; energy-budget extension used only when its options are active.</td></tr>
        <tr><td>Sizing verification</td><td class="wrap">Same source: MATLAB baseline, 150 carpet values, round trips, feasibility boundary</td><td class="wrap">Unchanged data; included in the suite.</td></tr>
        <tr><td>Plotting</td><td class="wrap">Constraint-diagram SVG engine v1.0</td><td class="wrap">Log axis, annotations, limit lines, raster images. Plotly is replaced by built-in contour, surface and bar renderers so the file works offline.</td></tr>
        <tr><td>Integration layer</td><td class="wrap">New</td><td class="wrap">Shared state, aerodynamic coupling, geometry, power, fixed-geometry closure, energy budget, optimizer, studies, history, tests.</td></tr></tbody></table></div>`) }));
  }

  /* ================= 23. Exports ================= */
  const CSVNUM = (v) => (typeof v !== 'number' ? String(v == null ? '' : v) : Number.isNaN(v) ? 'NaN' : v === Infinity ? 'Inf' : v === -Infinity ? '-Inf' : String(Number(v.toPrecision(12))));
  function csvLine(arr) { return arr.map((v) => { const s = CSVNUM(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(','); }
  function csvDoc(rows, header) { return (header || []).map((x) => '# ' + x).concat(rows.map(csvLine)).join('\r\n') + '\r\n'; }
  const stamp = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  function download(filename, data, mime) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename, style: 'display:none' });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Downloaded ' + filename + '.');
    } catch (err) { toast('Could not save ' + filename + ': ' + (err && err.message), 'bad'); }
  }
  function exportFigure(chart, kind, name, specFn, title) {

    if (kind === 'svg') download('ega_' + name + '_' + stamp() + '.svg', chart.exportSVG(opt), 'image/svg+xml');
    else chart.exportPNG(Object.assign(opt, { scale: 2 })).then((b) => download('ega_' + name + '_' + stamp() + '.png', b)).catch((e) => toast(e.message, 'bad'));
  }

  }

    }
    const head = ['Electric GA integrated design: trade study ' + state.study.type, 'Units: masses in kg, range in nm, areas in ft², power in hp unless noted', 'Generated ' + new Date().toISOString()];
    const cols = ['Status', 'Closure metric', 'Takeoff mass [kg]', 'Payload [kg]', 'Battery mass [kg]', 'Battery fraction [-]', 'Battery energy [kWh]', 'Range [nm]', 'Wing area [ft2]', 'Span [ft]', 'Installed power [hp]', 'Cruise L/D [-]', 'CL [-]'];
    const sumRow = (s) => [s.st, s.metric, s.m0, s.mp, s.mb, s.fb, s.E, s.R, s.S, s.b, s.P, s.LD, s.CL];

    else if (D.kind === 'carpet' || D.kind === 'contour' || D.kind === 'surface') {
