<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electric GA design environment: sizing, constraints and aerodynamics</title>
<meta name="description" content="Integrated conceptual-design environment for battery-electric general-aviation aircraft: electric Breguet weight sizing, Roskam-style W/S–W/P constraint analysis and drag-polar aerodynamics in one coupled loop.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* ---------- Tokens (shared lineage with both source applications) ---------- */
:root {
  color-scheme: light;
  --paper: #E5E9ED; --sheet: #FFFFFF; --sheet-2: #F3F5F7; --sheet-3: #E9EDF1;
  --ink: #15202B; --ink-2: #45566A; --ink-3: #6A798A;
  --rule: #D2D9E0; --rule-2: #B6C1CB;
  --accent: #0B5CAD; --accent-2: #084A8C; --accent-soft: #E2EDF8; --on-accent: #FFFFFF;
  --ok: #1D7539; --ok-soft: #E3F1E7; --bad: #B42318; --bad-soft: #FBE9E7; --warn: #875800; --warn-soft: #FAF0D8;
  --info: #36536E; --info-soft: #E5ECF3; --unv: #5D6A79; --unv-soft: #EEF1F4;
  --c-takeoff: #0072BD; --c-cruise: #D95319; --c-landing: #7E2F8E; --c-envelope: #3D8B37; --c-feasible: #D1EBD6; --feasible-opacity: 0.75;
  --c-point: #15202B; --c-opt: #A0730A; --c-saved: #5A6B7D;
  --m-empty: #6E7F8D; --m-battery: #3F5FB0; --m-reserve: #7F97D9; --m-unusable: #B8C3D9; --m-payload: #8A5A9E; --m-spare: rgba(138, 90, 158, 0.2);
  --chart-bg: #FFFFFF; --chart-plot: #FFFFFF; --chart-grid: #DAE0E7; --chart-grid-minor: #EFF2F5; --chart-axis: #2E3A47; --chart-cross: #7D8B99; --scene: #F2F4F7;
  --strip: #16212C; --strip-2: #1F2C39; --strip-ink: #E8EEF3; --strip-ink-2: #9FB0C0; --strip-rule: #2E3D4C;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
  --font-num: "B612", Verdana, "DejaVu Sans", "Segoe UI", sans-serif;
  --radius: 4px;
  --shadow-pop: 0 8px 28px rgba(14, 26, 40, 0.2);
  --pane-l: 304px; --pane-r: 336px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0B1015; --sheet: #131A21; --sheet-2: #18212A; --sheet-3: #1E2832;
    --ink: #E1E7ED; --ink-2: #A3B0BE; --ink-3: #7E8D9C; --rule: #25303A; --rule-2: #36424F;
    --accent: #5AA9FF; --accent-2: #86C0FF; --accent-soft: #15283C; --on-accent: #06121F;
    --ok: #5CC77A; --ok-soft: #122D1C; --bad: #FF7B6B; --bad-soft: #391714; --warn: #F0B545; --warn-soft: #30240B; --info: #9DB8D3; --info-soft: #17222D; --unv: #93A3B3; --unv-soft: #1A232C;
    --c-takeoff: #4DB3FF; --c-cruise: #FF8A4C; --c-landing: #C58BD9; --c-envelope: #6CCB5F; --c-feasible: #2E6B3E; --feasible-opacity: 0.55;
    --c-point: #E1E7ED; --c-opt: #F2C14E; --c-saved: #9AAABB;
    --m-empty: #7D8C99; --m-battery: #5F7FD6; --m-reserve: #8EA6E6; --m-unusable: #4A5878; --m-payload: #A77BBD; --m-spare: rgba(167, 123, 189, 0.25);
    --chart-bg: #131A21; --chart-plot: #0F151B; --chart-grid: #26313B; --chart-grid-minor: #19212A; --chart-axis: #9AA8B6; --chart-cross: #6D7C8B; --scene: #18212A;
    --strip: #0E151C; --strip-2: #16202A; --strip-ink: #E1E7ED; --strip-ink-2: #8FA1B2; --strip-rule: #26323E;
    --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0B1015; --sheet: #131A21; --sheet-2: #18212A; --sheet-3: #1E2832;
  --ink: #E1E7ED; --ink-2: #A3B0BE; --ink-3: #7E8D9C; --rule: #25303A; --rule-2: #36424F;
  --accent: #5AA9FF; --accent-2: #86C0FF; --accent-soft: #15283C; --on-accent: #06121F;
  --ok: #5CC77A; --ok-soft: #122D1C; --bad: #FF7B6B; --bad-soft: #391714; --warn: #F0B545; --warn-soft: #30240B; --info: #9DB8D3; --info-soft: #17222D; --unv: #93A3B3; --unv-soft: #1A232C;
  --c-takeoff: #4DB3FF; --c-cruise: #FF8A4C; --c-landing: #C58BD9; --c-envelope: #6CCB5F; --c-feasible: #2E6B3E; --feasible-opacity: 0.55;
  --c-point: #E1E7ED; --c-opt: #F2C14E; --c-saved: #9AAABB;
  --m-empty: #7D8C99; --m-battery: #5F7FD6; --m-reserve: #8EA6E6; --m-unusable: #4A5878; --m-payload: #A77BBD; --m-spare: rgba(167, 123, 189, 0.25);
  --chart-bg: #131A21; --chart-plot: #0F151B; --chart-grid: #26313B; --chart-grid-minor: #19212A; --chart-axis: #9AA8B6; --chart-cross: #6D7C8B; --scene: #18212A;
  --strip: #0E151C; --strip-2: #16202A; --strip-ink: #E1E7ED; --strip-ink-2: #8FA1B2; --strip-rule: #26323E;
  --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55);
}

/* ---------- Base ---------- */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
sub { font-size: 0.72em; line-height: 0; }
sup { font-size: 0.72em; line-height: 0; }
h1, h2, h3, h4 { margin: 0; }
p { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Application grid ---------- */
.app { height: 100%; display: grid; grid-template-columns: var(--pane-l) minmax(0, 1fr) var(--pane-r); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "strip strip strip" "inputs work inspector"; }
.strip { grid-area: strip; }
.pane-inputs { grid-area: inputs; overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--rule); }
.work { grid-area: work; min-width: 0; display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; container-name: work; }
.pane-inspector { grid-area: inspector; overflow-y: auto; background: var(--sheet); border-left: 1px solid var(--rule); }
@media (max-width: 1360px) { :root { --pane-l: 282px; --pane-r: 306px; } body { font-size: 13.5px; } }
@media (max-width: 1120px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "strip" "inputs" "work" "inspector"; }
  .pane-inputs, .pane-inspector { overflow: visible; border: 0; border-bottom: 1px solid var(--rule); }
  .work { overflow: visible; }
  .tabpanel { overflow: visible !important; }
}

/* ---------- Instrument strip ---------- */
.strip { display: flex; align-items: stretch; background: var(--strip); color: var(--strip-ink); min-height: 64px; border-bottom: 1px solid var(--strip-rule); }
.brand { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-width: 0; flex: 0 1 auto; border-right: 1px solid var(--strip-rule); }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--font-num); font-weight: 700; font-size: 13px; line-height: 1.2; white-space: nowrap; }
.brand-sub { font-size: 12.5px; color: var(--strip-ink-2); white-space: nowrap; }
.readouts { display: flex; flex: 1 1 auto; min-width: 0; }
.ro { flex: 1 1 0; min-width: 0; padding: 8px 14px 7px; border-right: 1px solid var(--strip-rule); display: flex; flex-direction: column; justify-content: center; position: relative; }
.ro-label { font-size: 12px; color: var(--strip-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ro-main { font-family: var(--font-num); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; letter-spacing: -0.01em; }
.ro-main .u { font-size: 12px; font-weight: 400; color: var(--strip-ink-2); margin-left: 3px; }
.ro-sub { font-family: var(--font-num); font-size: 11.5px; color: var(--strip-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.ro.changed::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #5AA9FF; animation: fadebar 1.6s ease-out forwards; }
@keyframes fadebar { from { opacity: 1; } to { opacity: 0; } }
.ro.status { flex: 1.25 1 0; border-left: 4px solid var(--strip-ink-2); }
.ro.status.feasible { border-left-color: #3FB25E; }
.ro.status.infeasible { border-left-color: #F0604F; }
.ro.status.indeterminate { border-left-color: #E5A53A; }
.ro.status .ro-main { font-size: 17px; }
.ro.status.feasible .ro-main { color: #7DDC95; }
.ro.status.infeasible .ro-main { color: #FF8F80; }
.ro.status.indeterminate .ro-main { color: #F3C36A; }
.strip-actions { display: flex; align-items: center; gap: 6px; padding: 8px 12px; flex: none; }
.strip .btn { background: var(--strip-2); border-color: var(--strip-rule); color: var(--strip-ink); }
.strip .btn:hover { background: #26384A; }
.strip .btn.primary { background: #2F7BD8; border-color: #2F7BD8; color: #fff; }
.strip .btn.primary:hover { background: #3C8AE8; }
.strip .icon-btn { color: var(--strip-ink); }
.strip .icon-btn:hover { background: var(--strip-2); }
@media (max-width: 1720px) { .brand-sub { display: none; } }
@media (max-width: 1480px) { .ro { padding: 8px 10px 7px; } .ro-main { font-size: 17px; } }
@media (max-width: 1240px) { .brand-name span { display: none; } }

/* ---------- Buttons and controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 11px; border: 1px solid var(--rule-2); border-radius: var(--radius); background: var(--sheet); cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.btn:hover { background: var(--sheet-2); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-2); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 13px; }
.btn.danger { color: var(--bad); }
.btn svg { width: 15px; height: 15px; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: var(--radius); background: none; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--sheet-2); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-weight: 600; font-size: 13px; }
.link-btn:hover { text-decoration: underline; }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: var(--radius); overflow: hidden; background: var(--sheet); max-width: 100%; }
.seg-btn { border: 0; background: none; padding: 4px 9px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.seg-btn + .seg-btn { border-left: 1px solid var(--rule-2); }
.seg-btn[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }
.seg-btn:not([aria-checked="true"]):hover { background: var(--sheet-2); color: var(--ink); }
.seg.full { display: flex; width: 100%; }
.seg.full .seg-btn { flex: 1 1 0; padding: 5px 4px; white-space: normal; line-height: 1.15; }
.select, .txt { height: 30px; border: 1px solid var(--rule-2); border-radius: var(--radius); background: var(--sheet); padding: 0 8px; min-width: 0; }
.select:focus, .txt:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13.5px; }
.check input { width: 15px; height: 15px; accent-color: var(--accent); margin: 0; }
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.switch input { appearance: none; -webkit-appearance: none; width: 28px; height: 16px; border-radius: 8px; background: var(--rule-2); position: relative; cursor: pointer; margin: 0; transition: background 0.15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform 0.15s; }
.switch input:checked { background: var(--accent); }
.switch input:checked::after { transform: translateX(12px); }

/* ---------- Input pane ---------- */
.pane-head { padding: 11px 14px 9px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pane-title { font-family: var(--font-num); font-size: 13px; font-weight: 700; }
.pane-note { font-size: 12.5px; color: var(--ink-3); }
.grp { border-bottom: 1px solid var(--rule); }
.grp > summary { list-style: none; display: flex; align-items: center; gap: 9px; padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 15px; user-select: none; }
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before { content: ""; width: 7px; height: 7px; flex: none; border-right: 1.6px solid var(--ink-2); border-bottom: 1.6px solid var(--ink-2); transform: rotate(-45deg); transition: transform 0.15s; }
.grp[open] > summary::before { transform: rotate(45deg); }
.grp > summary:hover { background: var(--sheet-2); }
.grp-title { flex: 1; }
.grp-flag { font-size: 12px; font-weight: 600; }
.grp-flag.err { color: var(--bad); }
.grp-flag.warn { color: var(--warn); }
.grp-body { padding: 2px 14px 14px; }
.sub-h { font-size: 12.5px; font-weight: 700; color: var(--ink-2); margin: 12px 0 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sub-h:first-child { margin-top: 4px; }
.fld { padding: 6px 0 7px; border-top: 1px dashed transparent; }
.fld + .fld { border-top-color: var(--sheet-3); }
.fld-row { display: grid; grid-template-columns: minmax(0, 1fr) 118px; gap: 8px; align-items: center; }
.fld-label { font-size: 13.5px; line-height: 1.2; min-width: 0; }
.fld-label .sym { font-family: var(--font-num); font-size: 12px; color: var(--ink-3); margin-left: 4px; white-space: nowrap; }
.fld-label .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 3px; margin-left: 4px; vertical-align: 1px; background: var(--info-soft); color: var(--info); }
.fld-label .tag.check { background: var(--warn-soft); color: var(--warn); }
.num-in { display: flex; align-items: center; height: 28px; border: 1px solid var(--rule-2); border-radius: var(--radius); background: var(--sheet); overflow: hidden; }
.num-in:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.num-in input { flex: 1 1 auto; min-width: 0; width: 100%; height: 100%; border: 0; background: none; padding: 0 6px; font-family: var(--font-num); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; outline: none; }
.num-in .u { flex: none; padding: 0 6px 0 2px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.num-in.bad { border-color: var(--bad); background: var(--bad-soft); }
.num-in.warn { border-color: var(--warn); }
.slider { width: 100%; margin: 6px 0 0; height: 16px; accent-color: var(--accent); cursor: pointer; }
.fld-msg { font-size: 12.5px; margin-top: 4px; line-height: 1.3; }
.fld-msg.err { color: var(--bad); }
.fld-msg.warn { color: var(--warn); }
.fld-msg.hint { color: var(--ink-3); }
.fld.dim .fld-label, .fld.dim .num-in { opacity: 0.55; }
.derived { margin-top: 8px; padding: 7px 9px; background: var(--sheet-2); border-radius: var(--radius); font-size: 12.5px; }
.derived .kvr { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
.derived .kvr b { font-family: var(--font-num); font-weight: 400; font-variant-numeric: tabular-nums; text-align: right; }
.mode-list { display: grid; gap: 5px; }
.mode { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--radius); cursor: pointer; }
.mode:hover { background: var(--sheet-2); }
.mode input { position: absolute; opacity: 0; pointer-events: none; }
.mode.on { border-color: var(--accent); background: var(--accent-soft); }
.mode-letter { width: 22px; height: 22px; border-radius: 3px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 12.5px; background: var(--sheet-3); color: var(--ink-2); }
.mode.on .mode-letter { background: var(--accent); color: var(--on-accent); }
.mode-name { font-weight: 700; font-size: 13.5px; display: block; }
.mode-detail { font-size: 12.5px; color: var(--ink-2); display: block; }
.det { margin-top: 8px; font-size: 12.5px; padding: 6px 8px; border-radius: var(--radius); background: var(--sheet-2); }
.det b { font-weight: 700; }
.det.underdetermined { background: var(--warn-soft); color: var(--warn); }
.det.overconstrained { background: var(--bad-soft); color: var(--bad); }
.closures { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; }
.notmodeled { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
.notmodeled li { display: flex; gap: 7px; padding: 3px 0; color: var(--ink-2); }
.notmodeled li::before { content: "?"; flex: none; width: 15px; height: 15px; border-radius: 50%; border: 1px dashed var(--unv); color: var(--unv); font-size: 10px; display: grid; place-items: center; font-weight: 700; margin-top: 1px; }

/* ---------- Workspace and tabs ---------- */
.tabbar { display: flex; align-items: flex-end; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--rule); background: var(--paper); flex: none; overflow-x: auto; }
.tab { border: 1px solid transparent; border-bottom: 0; background: none; padding: 7px 13px 8px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; white-space: nowrap; position: relative; top: 1px; }
.tab:hover { color: var(--ink); background: var(--sheet-2); }
.tab[aria-selected="true"] { background: var(--sheet); border-color: var(--rule); color: var(--ink); }
.tab.aux { font-weight: 500; font-size: 13.5px; }
.tab-sep { flex: 1 1 auto; }
.tab .t-short { display: none; }
@container work (max-width: 900px) {
  .tab { padding: 7px 9px 8px; }
  .tab .t-long { display: none; }
  .tab .t-short { display: inline; }
  .tabbar { padding-left: 10px; padding-right: 10px; }
}
.tab .badge { margin-left: 6px; font-family: var(--font-num); font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--sheet-3); color: var(--ink-2); }
.tab .badge.ok { background: var(--ok-soft); color: var(--ok); }
.tab .badge.bad { background: var(--bad-soft); color: var(--bad); }
.tabpanel { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 28px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }
.card-h { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; padding: 9px 12px; border-bottom: 1px solid var(--rule); }
.card-t { font-family: var(--font-num); font-size: 13px; font-weight: 700; }
.card-s { font-size: 12.5px; color: var(--ink-2); }
.card-b { padding: 10px 12px 12px; }
.panel-intro { color: var(--ink-2); font-size: 13.5px; max-width: 110ch; margin-bottom: 10px; }
.sec-title { font-family: var(--font-num); font-size: 13.5px; font-weight: 700; margin: 18px 0 8px; }
.sec-title:first-child { margin-top: 0; }

/* Overview grid: side by side on wide workspaces, stacked (diagram first) on narrower ones */
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(380px, 1fr); gap: 12px; align-items: start; }
.ov-side { display: grid; gap: 12px; min-width: 0; }
@container work (max-width: 1260px) {
  .ov-grid { grid-template-columns: minmax(0, 1fr); }
  .ov-side { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }

}
@container work (max-width: 760px) { .ov-side { grid-template-columns: minmax(0, 1fr); } }

/* Charts */
.chart-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 8px; border-bottom: 1px solid var(--rule); }
.bar-grow { flex: 1 1 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 8px; padding: 5px 8px 6px; border-bottom: 1px solid var(--rule); }
.lg { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 5px; font-size: 13px; color: var(--ink); cursor: pointer; border-radius: 3px; }

.lg.static { cursor: default; }
.lg.static:hover { background: none; }
.lg.off { color: var(--ink-3); }

.chart-host { position: relative; background: var(--chart-bg); outline: none; overflow: hidden; }
.chart-host.main { height: clamp(420px, calc(100vh - 290px), 760px); }
.chart-host.mid { height: 330px; }
.chart-host.small { height: 260px; }
.chart-host.study { height: clamp(380px, calc(100vh - 420px), 640px); }
.chart-host:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.chart-svg, .chart-ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chart-svg { font-family: var(--font-num); user-select: none; -webkit-user-select: none; }
.chart-ov { touch-action: none; }
.surf-canvas { display: block; touch-action: none; }
.chart-tip { position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; min-width: 220px; max-width: 320px; padding: 8px 10px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-2); border-radius: var(--radius); box-shadow: var(--shadow-pop); font-size: 13px; }
.tt-h { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-num); font-size: 12px; font-weight: 700; padding-bottom: 5px; margin-bottom: 4px; border-bottom: 1px solid var(--rule); }
.tt-h span { color: var(--ink-2); font-weight: 400; }
.tt-r { display: flex; align-items: center; gap: 7px; padding: 1px 0; }
.tt-r i { width: 10px; height: 3px; border-radius: 2px; background: var(--ink-3); flex: none; }
.tt-r b { margin-left: auto; font-family: var(--font-num); font-size: 12px; font-weight: 400; white-space: nowrap; }
.tt-gov { font-weight: 600; }
.tt-gov i { background: var(--c-envelope); height: 6px; opacity: 0.55; }
.tt-f { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--rule); font-size: 12.5px; }
.tt-f + .tt-f { margin-top: 2px; padding-top: 0; border-top: 0; color: var(--ink-2); }
.ok-t { color: var(--ok); font-weight: 600; }
.bad-t { color: var(--bad); font-weight: 600; }
.warn-t { color: var(--warn); font-weight: 600; }
.chart-hint { font-size: 12.5px; color: var(--ink-3); padding: 6px 10px 8px; }
.empty-chart { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--ink-2); font-size: 14px; }

/* Mass budget */
.budget-eq { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-bottom: 8px; font-size: 13px; }
.budget-eq strong { font-family: var(--font-num); font-size: 15px; }
.budget-bar { position: relative; display: flex; height: 30px; margin-top: 24px; border-radius: 3px; overflow: visible; background: var(--sheet-3); }
.seg-m { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; text-overflow: ellipsis; color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap; }
.seg-m:first-child { border-radius: 3px 0 0 3px; }
.seg-m.empty { background: var(--m-empty); }
.seg-m.battery { background: var(--m-battery); }
.seg-m.reserve { background: var(--m-reserve); }
.seg-m.unusable { background: var(--m-unusable); color: var(--ink); }
.seg-m.payload { background: var(--m-payload); }

.seg-m.margin { background: transparent; color: var(--ink-2); border: 1.5px dashed var(--rule-2); border-left: 0; }
.seg-m.over { background: repeating-linear-gradient(45deg, var(--bad-soft) 0 5px, transparent 5px 9px); border: 1.5px solid var(--bad); color: var(--bad); }
.limit-mark { position: absolute; top: -6px; bottom: -6px; width: 0; border-left: 2px dashed var(--warn); }
.limit-mark span { position: absolute; top: -18px; transform: translateX(-50%); font-size: 11.5px; white-space: nowrap; color: var(--warn); font-weight: 600; }
.limit-mark.end span { transform: translateX(-100%); margin-left: -4px; }
.limit-mark.start span { transform: none; margin-left: 4px; }
.budget-legend { display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 3px 10px; margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; align-items: center; }
.budget-legend li { display: contents; }
.sw { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
.lgv { font-family: var(--font-num); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.lgv.alt { color: var(--ink-3); }
.budget-empty { padding: 14px; text-align: center; color: var(--ink-2); background: var(--sheet-2); border-radius: var(--radius); font-size: 13.5px; }
.overflow-note { margin-top: 8px; font-size: 13px; color: var(--bad); }

/* Check list */
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid var(--sheet-3); font-size: 13.5px; }
.checks li:first-child { border-top: 0; }
.ck { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; margin-top: 1px; color: #fff; }
.ck.pass { background: var(--ok); }
.ck.fail { background: var(--bad); }
.ck.indeterminate { background: var(--warn); }
.ck.unverified { background: none; border: 1px dashed var(--unv); color: var(--unv); }
.ck.off { background: var(--sheet-3); color: var(--ink-3); }
.ck-l { font-weight: 600; }
.ck-d { color: var(--ink-2); font-size: 12.5px; }
.ck-group { font-size: 12px; font-weight: 700; color: var(--ink-3); margin: 10px 0 2px; }
.ck-group:first-child { margin-top: 0; }
details.more > summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 6px; list-style: none; }
details.more > summary::-webkit-details-marker { display: none; }

/* Inspector */
.insp-sec { border-bottom: 1px solid var(--rule); padding: 10px 14px 12px; }
.insp-h { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 6px; }
.insp-t { font-family: var(--font-num); font-size: 12.5px; font-weight: 700; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; margin: 0; font-size: 13.5px; }
.kv dt { color: var(--ink-2); min-width: 0; }
.kv dd { margin: 0; text-align: right; font-family: var(--font-num); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; position: relative; }
.kv dd .alt { display: block; color: var(--ink-3); font-size: 11px; }
.kv dd.lead { font-weight: 700; font-size: 13px; }
.kv dd.ok { color: var(--ok); }
.kv dd.bad { color: var(--bad); }
.kv dd.warn { color: var(--warn); }
.kv dd.chg::before { content: ""; display: inline-block; vertical-align: middle; margin: -2px 6px 0 0; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.pt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pt-f label { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 3px; }
.pt-f .num-in { height: 32px; }
.pt-f .num-in input { font-size: 14px; font-weight: 700; }
.pt-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.status-box { padding: 8px 10px; border-radius: var(--radius); font-size: 13px; border-left: 4px solid; }
.status-box.feasible { background: var(--ok-soft); border-color: var(--ok); }
.status-box.infeasible { background: var(--bad-soft); border-color: var(--bad); }
.status-box.indeterminate { background: var(--warn-soft); border-color: var(--warn); }
.status-box .st { font-weight: 700; font-size: 14px; }
.status-box.feasible .st { color: var(--ok); }
.status-box.infeasible .st { color: var(--bad); }
.status-box.indeterminate .st { color: var(--warn); }
.status-box ul { margin: 4px 0 0; padding-left: 16px; }
.status-box p { margin-top: 3px; color: var(--ink-2); }
.change-box { font-size: 12.5px; background: var(--accent-soft); border-radius: var(--radius); padding: 7px 9px; }
.change-box .edit { font-weight: 700; margin-bottom: 3px; }
.change-box ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; }
.change-box li { display: contents; }
.change-box .d { font-family: var(--font-num); text-align: right; font-size: 11.5px; white-space: nowrap; }
.change-box .up { color: var(--ink); }
.cons-row { display: grid; grid-template-columns: 14px 1fr auto; gap: 7px; align-items: center; font-size: 13px; padding: 3px 0; }
.cons-row .dot { width: 10px; height: 10px; border-radius: 50%; }
.cons-row .mv { font-family: var(--font-num); font-size: 12px; text-align: right; white-space: nowrap; }
.gov-tag { font-size: 11px; font-weight: 700; padding: 0 5px; border-radius: 3px; background: var(--sheet-3); color: var(--ink-2); margin-left: 5px; }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 5px 9px; border-bottom: 1px solid var(--sheet-3); text-align: left; vertical-align: top; white-space: nowrap; }
.tbl thead th { background: var(--sheet-2); font-weight: 700; position: sticky; top: 0; z-index: 1; font-size: 12.5px; border-bottom: 1px solid var(--rule); }
.tbl td.n, .tbl th.n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.tbl td.wrap, .tbl th.wrap { white-space: normal; min-width: 220px; }
.tbl tr:last-child td, .tbl tr:last-child th { border-bottom: 0; }
.tbl tr.base td { background: var(--accent-soft); }
.tbl.fit th, .tbl.fit td { white-space: normal; }
.tbl td.r { text-align: right; }
.tbl .u { font-weight: 400; color: var(--ink-3); font-size: 11.5px; }
.tbl .pos { color: var(--ok); }
.tbl .neg { color: var(--bad); }
.tbl .eq { font-family: var(--font-num); font-size: 12px; }
.pf { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 3px; }
.pf.pass { background: var(--ok-soft); color: var(--ok); }
.pf.fail { background: var(--bad-soft); color: var(--bad); }
.pf.skip, .pf.unverified { background: var(--unv-soft); color: var(--unv); }
.pf.indeterminate { background: var(--warn-soft); color: var(--warn); }

/* Notices */
.notice { padding: 8px 10px; border-radius: var(--radius); font-size: 13px; margin: 0 0 8px; border-left: 3px solid; }
.notice.info { background: var(--info-soft); border-color: var(--info); color: var(--ink); }
.notice.warn { background: var(--warn-soft); border-color: var(--warn); }
.notice.bad { background: var(--bad-soft); border-color: var(--bad); }
.notice.ok { background: var(--ok-soft); border-color: var(--ok); }
.notice .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }

/* Sizing tab */
.sz-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@container work (max-width: 900px) { .sz-grid { grid-template-columns: minmax(0, 1fr); } }
.readouts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
.readout { background: var(--sheet); padding: 8px 10px; }
.readout dt { font-size: 12.5px; color: var(--ink-2); }
.readout dd { margin: 2px 0 0; }
.readout .r1 { font-family: var(--font-num); font-size: 15px; font-weight: 700; display: block; font-variant-numeric: tabular-nums; }
.readout .r2 { font-family: var(--font-num); font-size: 11.5px; color: var(--ink-3); display: block; }
.readout.good .r1 { color: var(--ok); }
.readout.bad .r1 { color: var(--bad); }
.readout .tag { font-size: 10.5px; font-weight: 700; padding: 0 4px; border-radius: 3px; background: var(--info-soft); color: var(--info); margin-left: 4px; }
.eqn { font-family: var(--font-num); font-size: 12.5px; background: var(--sheet-2); padding: 6px 9px; border-radius: var(--radius); margin: 6px 0; overflow-x: auto; white-space: nowrap; }

/* Studies */
.study-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: flex-end; margin-bottom: 10px; }
.fblock { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.fblock > span { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 10px; flex-wrap: wrap; }
.subtab { border: 0; background: none; padding: 6px 11px; font-weight: 600; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 13.5px; }
.subtab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.subtab:hover { color: var(--ink); }
.var-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.var-block { flex: 1 1 330px; border: 1px solid var(--rule); border-left: 3px solid var(--ink-3); border-radius: var(--radius); padding: 8px 10px; background: var(--sheet); min-width: 0; }
.var-block.a1 { border-left-color: #00737F; }
.var-block.a2 { border-left-color: #D9541A; }
.rng { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 6px; margin-top: 6px; }
.rng label { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rng .txt { height: 28px; font-family: var(--font-num); font-size: 12.5px; text-align: right; width: 100%; }
.rng-foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 5px; font-size: 12px; color: var(--ink-3); }
.opts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 8px; }
.inspect-box { margin-top: 8px; }

/* Optimization */
.opt-grid { display: grid; grid-template-columns: minmax(260px, 0.9fr) minmax(0, 1.3fr); gap: 12px; align-items: start; }
@container work (max-width: 860px) { .opt-grid { grid-template-columns: minmax(0, 1fr); } }
.obj-list { display: grid; gap: 4px; }
.obj { display: grid; grid-template-columns: 18px 1fr; gap: 7px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: var(--radius); cursor: pointer; }
.obj:hover { background: var(--sheet-2); }
.obj.on { border-color: var(--accent); background: var(--accent-soft); }
.obj input { margin: 2px 0 0; accent-color: var(--accent); }
.obj-title { font-weight: 700; font-size: 13.5px; display: block; }
.obj-desc { font-size: 12.5px; color: var(--ink-2); display: block; }
.rec-title { font-family: var(--font-num); font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
.conv { font-size: 12.5px; color: var(--ink-2); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--sheet-3); }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.pareto-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 12px; align-items: start; }
@container work (max-width: 780px) { .pareto-wrap { grid-template-columns: minmax(0, 1fr); } }

/* History */
.hist-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.hist-top .txt { width: 240px; }
.tbl td .nm { font-weight: 700; }
.tbl td .sv { font-size: 11.5px; color: var(--ink-3); }
.tbl td.nmcell { white-space: normal; min-width: 150px; max-width: 230px; }
.tbl td.actions { white-space: nowrap; }
.cmp-v { display: block; }
.cmp-d { display: block; font-size: 11px; color: var(--ink-2); }
.variant-box { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; padding: 10px; border: 1px dashed var(--rule-2); border-radius: var(--radius); margin-bottom: 12px; }

/* Verification and methodology */
.ver-sum { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.ver-chip { font-family: var(--font-num); font-size: 12.5px; padding: 3px 8px; border-radius: 3px; background: var(--sheet-2); border: 1px solid var(--rule); }
.ver-chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.ver-chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
details.vgrp { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); margin-bottom: 8px; }
details.vgrp > summary { cursor: pointer; padding: 8px 12px; display: flex; gap: 10px; align-items: center; font-weight: 700; list-style: none; }
details.vgrp > summary::-webkit-details-marker { display: none; }
details.vgrp > summary .cnt { margin-left: auto; font-family: var(--font-num); font-size: 12px; font-weight: 400; }
details.vgrp > .tbl-wrap { border: 0; border-top: 1px solid var(--rule); border-radius: 0; max-height: 520px; }
.method { max-width: 112ch; }
.method details { border: 1px solid var(--rule); border-radius: var(--radius); background: var(--sheet); margin-bottom: 8px; }
.method summary { cursor: pointer; padding: 9px 12px; font-weight: 700; font-size: 14.5px; }
.method .mb { padding: 2px 14px 12px; font-size: 13.5px; line-height: 1.5; }
.method .mb p { margin: 6px 0; }
.method .mb ul { margin: 6px 0; padding-left: 20px; }
.method .mb li { margin: 3px 0; }
.method h4 { font-size: 13.5px; margin: 12px 0 4px; }
.seq { counter-reset: s; list-style: none; padding: 0; margin: 6px 0; }
.seq li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 4px 0; }
.seq li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-family: var(--font-num); font-size: 12px; font-weight: 700; display: grid; place-items: center; }

/* Toasts and dialogs */
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 50; }
.toast { background: var(--ink); color: var(--sheet); padding: 9px 13px; border-radius: var(--radius); box-shadow: var(--shadow-pop); font-size: 13.5px; max-width: 420px; display: flex; gap: 10px; align-items: center; }
.toast.bad { background: var(--bad); color: #fff; }
.toast button { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 0; }
.drop-hint { font-size: 12.5px; color: var(--ink-3); }

</style>

    ft_to_m: 0.3048,
    ft2_to_m2: 0.09290304,
    TOP_a: 0.009,           // Roskam: S_GTO = 4.9·TOP + 0.009·TOP²   [ft]
    TOP_b: 4.9,
    SGL_k: 0.265,           // Roskam: S_GL  = 0.265·Vs_L²            [ft, Vs_L in kt]
  }, constOverrides || {}));

  /* Original MATLAB parameter set */
  const BASELINE = Object.freeze({
    CLmax_TO: 1.60,
    CLmax_L: 1.95,
    CD0: 0.025,
    AR: 10.5,
    e: 0.80,
    eta_p: 0.80,
    S_GTO: 1300,
    sigma_TO: 0.81,
    S_GL: 1300,
    WL_WTO: 1.00,
    sigma_L: 1.00,          // MATLAB landing calculation uses sea-level density
    V_cr_kt: 115,
    sigma_cr: 0.76,
    Wcr_WTO: 1.00,          // integrated build: cruise weight = takeoff weight (battery-electric)
  });

  /* Original MATLAB sampling / axis conventions */
  const BASELINE_PLOT = Object.freeze({
    wsMin: 0.5, wsMax: 55, n: 1800,     // WS = linspace(0.5, 55, 1800)
    xMin: 0, xMax: 55,                   // xlim([0 55])
    scaleFromWS: 10,                     // scaleRegion = WS >= 10 & WS <= 55
    headroom: 1.15,                      // yUpper = 1.15*max(scaleValues)
    yFloor: 35,                          // yUpper = max(yUpper, 35)
  });

  const PARAM_KEYS = Object.freeze(Object.keys(BASELINE));

  function baselineParams() { return Object.assign({}, BASELINE); }

  /* ------------------------------------------------------------------ *
   * 2. Input validation
   *    rule 'pos'  : finite and > 0
   *    rule 'frac' : finite, > 0 and <= 1   (efficiencies)
   *    warn(v)     : soft engineering-plausibility warning (never blocks)
   * ------------------------------------------------------------------ */
  const sigmaWarn = (v) => (v > 1.25 ? 'A density ratio above 1.25 is unusual (very cold or below sea level).'
    : v < 0.4 ? 'A density ratio below 0.40 implies an extreme density altitude.' : null);

  const RULES = Object.freeze({
    CLmax_TO: { name: 'Takeoff CLmax', rule: 'pos',
      warn: (v) => (v < 1.0 || v > 2.6) ? 'Outside the usual range for propeller GA aircraft (Roskam single-prop: 1.3–1.9).' : null },
    CLmax_L: { name: 'Landing CLmax', rule: 'pos',
      warn: (v) => (v < 1.2 || v > 3.2) ? 'Outside the usual range (Roskam single-prop: 1.6–2.3).' : null },
    CD0: { name: 'Clean zero-lift drag coefficient', rule: 'pos',
      warn: (v) => (v < 0.012 || v > 0.06) ? 'Unusual clean CD0 for a GA aircraft (single-engine retractable: 0.020–0.030).' : null },
    AR: { name: 'Aspect ratio', rule: 'pos',
      warn: (v) => (v < 4 || v > 25) ? 'Well outside typical GA aspect ratios.' : null },
    e: { name: 'Oswald efficiency', rule: 'frac',
      warn: (v) => (v < 0.5 ? 'Very low span efficiency.' : null) },
    eta_p: { name: 'Cruise propeller efficiency', rule: 'frac',
      warn: (v) => (v > 0.92 ? 'Above typical propeller efficiency (about 0.80–0.88).' : v < 0.5 ? 'Very low propeller efficiency.' : null) },
    S_GTO: { name: 'Takeoff ground roll', rule: 'pos', warn: null },
    sigma_TO: { name: 'Takeoff density ratio', rule: 'pos', warn: sigmaWarn },
    S_GL: { name: 'Landing ground roll', rule: 'pos', warn: null },
    WL_WTO: { name: 'Landing-to-takeoff weight ratio', rule: 'pos',
      warn: (v) => (v > 1 ? 'Landing weight exceeds takeoff weight.' : v < 0.5 ? 'Unusually low landing weight fraction.' : null) },
    sigma_L: { name: 'Landing density ratio', rule: 'pos', warn: sigmaWarn },
    V_cr_kt: { name: 'Cruise speed', rule: 'pos',
      warn: (v) => (v > 250 ? 'Compressibility effects are not modeled.' : v < 40 ? 'Very low cruise speed.' : null) },
    sigma_cr: { name: 'Cruise density ratio', rule: 'pos',
      warn: (v) => (v > 1.25 ? 'A density ratio above 1.25 is unusual.' : v < 0.2 ? 'Beyond typical GA cruise altitudes.' : null) },
    Wcr_WTO: { name: 'Cruise-to-takeoff weight ratio', rule: 'pos',
      warn: (v) => (v > 1 ? 'Cruise weight above takeoff weight is not physical for this model.'
        : v !== 1 ? 'A battery-electric aircraft keeps its mass in flight; a ratio other than 1.00 needs a justification.' : null) },
  });

  function validateParams(p) {
    const errors = {};
    const warnings = {};
    for (const key of PARAM_KEYS) {
      const r = RULES[key];
      const v = p ? p[key] : undefined;
      if (typeof v !== 'number' || !Number.isFinite(v)) {
        errors[key] = r.name + ': enter a finite numeric value.';
        continue;
      }
      if (r.rule === 'pos' && !(v > 0)) { errors[key] = r.name + ' must be greater than zero.'; continue; }
      if (r.rule === 'frac' && !(v > 0 && v <= 1)) { errors[key] = r.name + ' must be greater than 0 and no more than 1.'; continue; }
      const w = r.warn ? r.warn(v) : null;
      if (w) warnings[key] = w;
    }
    return { errors, warnings };
  }

  /* ------------------------------------------------------------------ *
   * 3. Optional ISA atmosphere (explicitly selectable; not used by the
   *    MATLAB baseline, which specifies density ratios directly)
   *    Pressure altitude in ft, temperature deviation from ISA in K (= °C).
   * ------------------------------------------------------------------ */
  const ISA = Object.freeze({ T0: 288.15, L: 0.0065, g0: 9.80665, R: 287.05287, h11: 11000, h20: 20000, T11: 216.65 });
  const ISA_N = ISA.g0 / (ISA.R * ISA.L); // ≈ 5.25588

  function densityAltitudeFt(sigma) {
    if (!(sigma > 0)) return NaN;
    const s11 = Math.pow(ISA.T11 / ISA.T0, ISA_N - 1);
    let h;
    if (sigma >= s11) h = (ISA.T0 / ISA.L) * (1 - Math.pow(sigma, 1 / (ISA_N - 1)));
    else h = ISA.h11 - (ISA.R * ISA.T11 / ISA.g0) * Math.log(sigma / s11);
    return h / CONST.ft_to_m;
  }

  function isaAtmosphere(hp_ft, dT) {
    if (typeof hp_ft !== 'number' || !Number.isFinite(hp_ft)) return { ok: false, error: 'Pressure altitude must be a finite number.' };
    if (typeof dT !== 'number' || !Number.isFinite(dT)) return { ok: false, error: 'ISA temperature deviation must be a finite number.' };
    const h = hp_ft * CONST.ft_to_m;
    if (h < -610 || h > ISA.h20) return { ok: false, error: 'Pressure altitude must lie between −2,000 ft and 65,617 ft (implemented ISA range).' };
    let Tstd, delta;
    if (h <= ISA.h11) {
      Tstd = ISA.T0 - ISA.L * h;
      delta = Math.pow(Tstd / ISA.T0, ISA_N);
    } else {
      Tstd = ISA.T11;
      delta = Math.pow(ISA.T11 / ISA.T0, ISA_N) * Math.exp(-ISA.g0 * (h - ISA.h11) / (ISA.R * ISA.T11));
    }
    const T = Tstd + dT;
    if (!(T > 0)) return { ok: false, error: 'The resulting static temperature must be above 0 K.' };
    const sigma = delta * ISA.T0 / T;
    return { ok: true, sigma, delta, theta: T / ISA.T0, T_K: T, Tstd_K: Tstd, oat_C: T - 273.15, densityAlt_ft: densityAltitudeFt(sigma) };
  }

  /* ------------------------------------------------------------------ *
   * 4. Constraint registry
   *    type 'power' : allowable W/P(W/S) curve; feasible region is BELOW it
   *    type 'wsmax' : maximum takeoff W/S; feasible region is LEFT of it
   *    New constraints are added by appending an implemented definition.
   * ------------------------------------------------------------------ */
  const CONSTRAINTS = [
    {
      id: 'takeoff', name: 'Takeoff ground roll', short: 'Takeoff', type: 'power', implemented: true,
      deps: ['S_GTO', 'sigma_TO', 'CLmax_TO'],
      category: 'Empirical correlation (Roskam, preliminary)',
      equation: 'S_GTO = 4.9·TOP + 0.009·TOP²  →  W/P = TOP·σ_TO·CLmax,TO / (W/S)',
      compute(p) {
        // MATLAB section 7: positive quadratic root
        const a = CONST.TOP_a, b = CONST.TOP_b, c = -p.S_GTO;
        const TOP = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
        // MATLAB section 10: WP_takeoff = TOP .* sigma_TO .* CLmax_TO ./ WS
        const K = TOP * p.sigma_TO * p.CLmax_TO;
        return { TOP, K, wp: (ws) => K / ws };
      },
      check(d) {
        return (Number.isFinite(d.TOP) && d.TOP > 0 && Number.isFinite(d.K) && d.K > 0) ? null
          : 'The takeoff parameter TOP is not a positive finite number.';
      },
    },
    {
      id: 'cruise', name: 'Cruise speed (level flight)', short: 'Cruise', type: 'power', implemented: true,
      deps: ['V_cr_kt', 'sigma_cr', 'CD0', 'AR', 'e', 'eta_p', 'Wcr_WTO'],
      category: 'Physics relation (parabolic drag polar, level flight)',
      equation: 'D/W = q·CD0/(W/S) + k·(W/S)/q  →  W/P = 550·ηp / (V·D/W)',
      compute(p) {
        const k = 1 / (Math.PI * p.e * p.AR);                 // MATLAB section 3
        const V = p.V_cr_kt * CONST.kt_to_fts;                // MATLAB section 11
        const rho = p.sigma_cr * CONST.rho_SL;
        const q = 0.5 * rho * (V * V);                        // MATLAB section 12
        const CD0 = p.CD0;
        const r = p.Wcr_WTO == null ? 1 : p.Wcr_WTO;          // integrated build (b)
        const kr = r === 1 ? k : k * r * r;                    // r = 1: same value, same arithmetic as MATLAB
        const num = CONST.hp * p.eta_p;
        const dw = (ws) => q * CD0 / ws + kr * ws / q;
        const wp = (ws) => num / (V * dw(ws));                // MATLAB section 13
        const dwMin = 2 * Math.sqrt(CD0 * kr);
        return { k, kr, r, V, rho, q, dw, wp, dwMin, LDmax: 1 / dwMin, LDmaxAero: 1 / (2 * Math.sqrt(CD0 * k)),
          wsBestLD: q * Math.sqrt(CD0 / kr), wpMax: num / (V * dwMin) };
      },
      check(d) {
        return ([d.k, d.V, d.rho, d.q].every((x) => Number.isFinite(x) && x > 0)) ? null
          : 'Cruise dynamic pressure or induced-drag factor is not a positive finite number.';
      },
    },
    {
      id: 'landing', name: 'Landing ground roll', short: 'Landing', type: 'wsmax', implemented: true,
      deps: ['S_GL', 'CLmax_L', 'WL_WTO', 'sigma_L'],
      category: 'Empirical correlation (Roskam, preliminary)',
      equation: 'S_GL = 0.265·Vs,L²  →  (W/S)_TO = ½·ρ·Vs,L²·CLmax,L / (W_L/W_TO)',
      compute(p) {
        const Vs_kt = Math.sqrt(p.S_GL / CONST.SGL_k);        // MATLAB section 8
        const Vs = Vs_kt * CONST.kt_to_fts;
        const rho = p.sigma_L * CONST.rho_SL;                 // sigma_L = 1 reproduces rho_SL exactly
        const wsAtLanding = 0.5 * rho * (Vs * Vs) * p.CLmax_L; // MATLAB section 9
        const wsMax = wsAtLanding / p.WL_WTO;
        return { Vs_kt, Vs, rho, wsAtLanding, wsMax };
      },
      check(d) {
        return (Number.isFinite(d.wsMax) && d.wsMax > 0) ? null : 'Landing wing-loading limit is not a positive finite number.';
      },
    },
    // ---- Future refinements: listed for the interface, intentionally not modeled ----
    { id: 'climb_roc', name: 'Sustained rate of climb', type: 'power', implemented: false,
      note: 'Needs a climb-speed schedule, rate-of-climb requirement and climb-configuration drag polar.' },
    { id: 'climb_grad', name: 'Climb gradient (takeoff and balked landing)', type: 'power', implemented: false,
      note: 'Needs flap and landing-gear drag increments and the certification gradient requirements.' },
    { id: 'ceiling', name: 'Service ceiling and high-altitude power', type: 'power', implemented: false,
      note: 'Needs motor/propeller power availability with altitude.' },
    { id: 'ttc', name: 'Time to climb', type: 'power', implemented: false,
      note: 'Needs an integrated climb model.' },
    { id: 'battery', name: 'Battery discharge-rate limit', type: 'power', implemented: false,
      note: 'Needs pack energy, C-rate limits and a mission power profile.' },
    { id: 'thermal', name: 'Motor and inverter thermal limit', type: 'power', implemented: false,
      note: 'Needs continuous versus peak power ratings and duty cycle.' },
    { id: 'cert_field', name: 'Certification field length (with obstacle)', type: 'power', implemented: false,
      note: 'Needs air-distance and obstacle-clearance segments beyond ground roll.' },
  ];

  /* ------------------------------------------------------------------ *
   * 5. Model assembly
   * ------------------------------------------------------------------ */
  function buildModel(p, enforce) {
    enforce = enforce || {};
    const val = validateParams(p);
    const list = [];
    for (const def of CONSTRAINTS) {
      if (!def.implemented) continue;
      const badDeps = def.deps.filter((k) => val.errors[k]);
      const c = {
        id: def.id, name: def.name, short: def.short, type: def.type, category: def.category,
        equation: def.equation, deps: def.deps.slice(),
        enabled: enforce[def.id] !== false,
        valid: badDeps.length === 0,
        badDeps, issue: null, data: null,
      };
      if (c.valid) {
        const d = def.compute(p);
        const issue = def.check(d);
        if (issue) { c.valid = false; c.issue = issue; } else c.data = d;
      } else {
        c.issue = badDeps.map((k) => val.errors[k]).join(' ');
      }
      list.push(c);
    }
    const byId = {};
    for (const c of list) byId[c.id] = c;
    const powerAll = list.filter((c) => c.type === 'power');
    const wsAll = list.filter((c) => c.type === 'wsmax');
    const activePower = powerAll.filter((c) => c.enabled && c.valid);
    const activeWS = wsAll.filter((c) => c.enabled && c.valid);
    const invalidEnabled = list.filter((c) => c.enabled && !c.valid);
    let wsLimit = Infinity, wsLimitId = null;
    for (const c of activeWS) if (c.data.wsMax < wsLimit) { wsLimit = c.data.wsMax; wsLimitId = c.id; }
    return {
      params: Object.assign({}, p), errors: val.errors, warnings: val.warnings,
      list, byId, powerAll, wsAll, activePower, activeWS, invalidEnabled,
      disabled: list.filter((c) => !c.enabled),
      indeterminate: invalidEnabled.length > 0,
      wsLimit, wsLimitId,
    };
  }

  /* Allowable W/P from every power constraint at one W/S, plus the governing envelope.
     Envelope = minimum over ENFORCED, VALID constraints (MATLAB: min(WP_all,[],1)).
     wp = +Infinity means no power-loading constraint is enforced (unbounded above). */
  function envelopeAt(model, ws) {
    const values = {};
    for (const c of model.powerAll) values[c.id] = c.valid ? c.data.wp(ws) : NaN;
    let wp = Infinity, gov = null, bad = false;
    for (const c of model.activePower) {
      const v = values[c.id];
      if (!Number.isFinite(v)) { bad = true; continue; }
      if (v < wp) { wp = v; gov = c.id; }   // strict '<' keeps the first constraint on ties, as MATLAB min does
    }
    if (bad) return { wp: NaN, gov: null, values };
    return { wp, gov, values };
  }

  /* ------------------------------------------------------------------ *
   * 6. Sampling (MATLAB section 1 and 14)
   * ------------------------------------------------------------------ */
  function linspace(d1, d2, n) {
    // Same internal formula as MATLAB's linspace: y = d1 + ((0:n1).*(d2-d1))./n1, y(end) = d2
    const y = new Float64Array(n);
    if (n === 1) { y[0] = d2; return y; }
    const n1 = n - 1, span = d2 - d1;
    for (let i = 0; i < n; i++) y[i] = d1 + (i * span) / n1;
    y[n - 1] = d2;
    return y;
  }

  function sampleModel(model, wsMin, wsMax, n) {
    const ws = linspace(wsMin, wsMax, n);
    const series = {};
    for (const c of model.powerAll) {
      if (!c.valid) continue;
      const arr = new Float64Array(n);
      for (let i = 0; i < n; i++) arr[i] = c.data.wp(ws[i]);
      series[c.id] = arr;
    }
    let dw = null;
    const cr = model.byId.cruise;
    if (cr && cr.valid) {
      dw = new Float64Array(n);
      for (let i = 0; i < n; i++) dw[i] = cr.data.dw(ws[i]);
    }
    const env = new Float64Array(n);
    const gov = new Array(n);
    const act = model.activePower;
    for (let i = 0; i < n; i++) {
      let m = Infinity, g = null;
      for (const c of act) { const v = series[c.id][i]; if (v < m) { m = v; g = c.id; } }
      env[i] = m; gov[i] = g;
    }
    return { ws, series, dw, env, gov, n, wsMin, wsMax };
  }

  /* Top boundary of the feasible region over the sampled range.
     MATLAB uses the samples with WS <= WS_landing; the exact landing limit is
     appended so the shaded edge sits on the analytic limit, not the nearest sample. */
  function feasibleBoundary(model, samp) {
    const lim = model.wsLimit;
    const xs = [], ys = [];
    let lastIndex = -1;
    for (let i = 0; i < samp.n; i++) {
      const x = samp.ws[i];
      if (x <= lim && !Number.isNaN(samp.env[i])) { xs.push(x); ys.push(samp.env[i]); lastIndex = i; }
    }
    if (Number.isFinite(lim) && xs.length && lim > xs[xs.length - 1] && lim < samp.wsMax) {
      xs.push(lim); ys.push(envelopeAt(model, lim).wp);
    }
    return { xs, ys, lastIndex, empty: xs.length === 0 };
  }

  /* Automatic upper W/P axis limit, MATLAB section 16 */
  function autoYUpper(ws, arrays, scaleFromWS, scaleToWS, headroom, floor) {
    let m = -Infinity;
    for (let i = 0; i < ws.length; i++) {
      const x = ws[i];
      if (x < scaleFromWS || x > scaleToWS) continue;
      for (const a of arrays) { const v = a[i]; if (Number.isFinite(v) && v > m) m = v; }
    }
    const y = Number.isFinite(m) ? headroom * m : floor;
    return Math.max(y, floor);
  }

  /* ------------------------------------------------------------------ *
   * 7. Design-point evaluation
   *    Power margin   = W/P_allowable − W/P_selected   (> 0 satisfied)
   *    Landing margin = W/S_limit     − W/S_selected   (> 0 satisfied)
   *    Points exactly on a boundary are feasible (≤), with relative tolerance tol.
   * ------------------------------------------------------------------ */
  function evaluatePoint(model, ws, wp, tol) {
    tol = tol == null ? 1e-9 : tol;
    const res = {
      ws, wp, pointErrors: [], rows: [], violations: [], invalid: [], notEnforced: [],
      envelope: null, governingPower: null, governingWS: model.wsLimitId, status: 'feasible', feasible: true,
    };
    const wsOK = typeof ws === 'number' && Number.isFinite(ws) && ws > 0;
    const wpOK = typeof wp === 'number' && Number.isFinite(wp) && wp > 0;
    if (!wsOK) res.pointErrors.push('W/S must be a positive, finite value (lb/ft²).');
    if (!wpOK) res.pointErrors.push('W/P must be a positive, finite value (lb/hp).');
    const pointOK = wsOK && wpOK;

    for (const c of model.list) {
      const row = { id: c.id, name: c.name, short: c.short, type: c.type, enabled: c.enabled, valid: c.valid, issue: c.issue,
        value: NaN, margin: NaN, marginPct: NaN, powerRatioPct: NaN, satisfied: null };
      if (c.valid) {
        if (c.type === 'power') {
          if (wsOK) row.value = c.data.wp(ws);
          if (pointOK) {
            row.margin = row.value - wp;
            row.marginPct = 100 * row.margin / row.value;
            row.powerRatioPct = 100 * (row.value / wp - 1);   // installed power above (+) / below (−) this requirement
            row.satisfied = row.margin >= -tol * Math.max(1, Math.abs(row.value));
          }
        } else {
          row.value = c.data.wsMax;
          if (pointOK) {
            row.margin = row.value - ws;
            row.marginPct = 100 * row.margin / row.value;
            row.satisfied = row.margin >= -tol * Math.max(1, Math.abs(row.value));
          }
        }
      }
      res.rows.push(row);
      if (!c.enabled) res.notEnforced.push(c.short);
      else if (!c.valid) res.invalid.push(row);
      else if (row.satisfied === false) res.violations.push(row);
    }
    if (wsOK) {
      res.envelope = envelopeAt(model, ws);
      res.governingPower = res.envelope.gov;
    }
    if (!pointOK) { res.status = 'invalid'; res.feasible = null; }
    else if (res.violations.length) { res.status = 'infeasible'; res.feasible = false; }
    else if (res.invalid.length) { res.status = 'indeterminate'; res.feasible = null; }
    else { res.status = 'feasible'; res.feasible = true; }
    return res;
  }

  function violationMessage(row, ws, wp) {
    const f2 = (v) => (Math.round(v * 100) / 100).toFixed(2);
    if (row.type === 'power') {
      const more = 100 * (wp / row.value - 1);
      return 'Design point violates the ' + row.short.toLowerCase() + ' power-loading constraint: W/P = ' + f2(wp) +
        ' lb/hp exceeds the allowable ' + f2(row.value) + ' lb/hp (short by ' + f2(-row.margin) + ' lb/hp; ' +
        more.toFixed(1) + '% more shaft power is required).';
    }
    return 'Design point violates the ' + row.short.toLowerCase() + ' wing-loading constraint: W/S = ' + f2(ws) +
      ' lb/ft² exceeds the limit of ' + f2(row.value) + ' lb/ft² (by ' + f2(-row.margin) + ' lb/ft²).';
  }

  /* ------------------------------------------------------------------ *
   * 8. Physical sizing at a design point (requires takeoff weight)
   * ------------------------------------------------------------------ */
  function sizing(W_lb, ws, wp, wpRequired, AR, etaElec) {
    const o = { W_lb, W_kg: W_lb * CONST.lb_to_kg };
    o.S_ft2 = W_lb / ws;
    o.S_m2 = o.S_ft2 * CONST.ft2_to_m2;
    o.P_hp = W_lb / wp;
    o.P_kW = o.P_hp * CONST.hp_to_kW;
    o.Preq_hp = (wpRequired > 0) ? W_lb / wpRequired : NaN;  // wpRequired = +Infinity → 0 (no power constraint)
    o.Preq_kW = o.Preq_hp * CONST.hp_to_kW;
    o.margin_hp = o.P_hp - o.Preq_hp;
    o.margin_kW = o.margin_hp * CONST.hp_to_kW;
    o.margin_pct = o.Preq_hp > 0 ? 100 * (o.P_hp / o.Preq_hp - 1) : NaN;
    if (AR > 0 && Number.isFinite(AR)) {
      o.span_ft = Math.sqrt(AR * o.S_ft2);
      o.span_m = o.span_ft * CONST.ft_to_m;
      o.chord_ft = o.S_ft2 / o.span_ft;
      o.chord_m = o.chord_ft * CONST.ft_to_m;
    }
    if (etaElec > 0 && etaElec <= 1) {
      o.etaElec = etaElec;
      o.Pelec_kW = o.P_kW / etaElec;
      o.PreqElec_kW = o.Preq_kW / etaElec;
    }
    o.W_fromS = ws * o.S_ft2;   // identity checks: W = (W/S)·S and W = (W/P)·P
    o.W_fromP = wp * o.P_hp;
    return o;
  }

  /* Implied stall speeds (TAS) at a takeoff wing loading */
  function stallSpeeds(p, ws) {
    const o = { landing_kt: NaN, takeoff_kt: NaN };
    if (ws > 0 && p.CLmax_L > 0 && p.sigma_L > 0 && p.WL_WTO > 0) {
      o.landing_kt = Math.sqrt(2 * ws * p.WL_WTO / (p.sigma_L * CONST.rho_SL * p.CLmax_L)) / CONST.kt_to_fts;
    }
    if (ws > 0 && p.CLmax_TO > 0 && p.sigma_TO > 0) {

  /* Non-dominated set for (minimize wing area, minimize shaft power) at fixed W_TO,

  function paretoFront(model, lo, hi, n) {
    n = n || 900;

      const ws = lo + (hi - lo) * i / (n - 1);

    }

    // so it agrees exactly with maxEnvelope().
    const best = maxEnvelope(model, lo, hi);
    if (!best.unbounded && Number.isFinite(best.wp)) {

      return { all, front: [{ ws: best.ws, wp: best.wp, gov: best.gov, binding: best.binding }].concat(rest) };
    }
    return { all, front };
  }

  /* ------------------------------------------------------------------ *

    L.push('', '=====================================================', ' PRELIMINARY W/P - W/S CONSTRAINT ANALYSIS', '=====================================================');
    L.push('', 'AERODYNAMICS');
    L.push('CLmax takeoff:               ' + f(p.CLmax_TO, 2));
    L.push('CLmax landing:               ' + f(p.CLmax_L, 2));
    L.push('CD0 clean:                   ' + f(p.CD0, 3));
    L.push('Aspect ratio:                ' + f(p.AR, 2));
    L.push('Oswald efficiency:           ' + f(p.e, 2));
    L.push('Induced drag factor k:       ' + f(k, 4));
    L.push('', 'TAKEOFF');
    L.push('Takeoff ground roll target:  ' + f(p.S_GTO, 0) + ' ft');
    L.push('Calculated TOP:              ' + f(TO ? TO.TOP : NaN, 2));
    L.push('Takeoff density ratio:       ' + f(p.sigma_TO, 4));
    L.push('', 'LANDING');
    L.push('Landing ground roll target:  ' + f(p.S_GL, 0) + ' ft');
    L.push('Derived landing stall speed: ' + f(LD ? LD.Vs_kt : NaN, 1) + ' kt');
    L.push('Landing W/S limit:           ' + f(LD ? LD.wsMax : NaN, 2) + ' lb/ft^2');
    L.push('Landing/takeoff weight ratio ' + f(p.WL_WTO, 2));

    L.push('Cruise density ratio:        ' + f(p.sigma_cr, 3));
    L.push('Cruise prop efficiency:      ' + f(p.eta_p, 2));

    L.push('Lower W/P means more installed power.');
    L.push('Feasible power region is BELOW the governing curves.');
    L.push('Feasible wing-loading region is LEFT of landing limit.');

  }

    VERSION: '1.1.0', SOURCE_VERSION: '1.0.0', makeEngine,
    CONST, BASELINE, BASELINE_PLOT, PARAM_KEYS, RULES, CONSTRAINTS,
