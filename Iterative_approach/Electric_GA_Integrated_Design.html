      else { rows.push([EC.VARIABLES[g.k1].label, EC.VARIABLES[g.k2].label, EC.OUTPUTS[g.outKey].label].concat(cols)); g.cells.forEach((row, j) => row.forEach((s, i) => rows.push([g.v1[i], g.v2[j], s.y].concat(sumRow(s))))); }
    } else if (D.kind === 'breakdown') { rows.push(['Design', 'Status', 'Takeoff mass [kg]', 'Empty [kg]', 'Battery [kg]', 'Payload [kg]', 'Energy [kWh]', 'MTOW margin [kg]', 'L/D', 'S [ft2]', 'P [hp]']); for (const x of D.res) rows.push([x.label, x.sz.status, x.sz.takeoffMass, x.sz.emptyMass, x.sz.batteryMass, x.sz.payloadMass, x.sz.batteryEnergy, x.sz.mtowMargin, x.r.aero.LD, x.r.geometry.S_ft2, x.r.power.inst_hp]); }
    else if (D.kind === 'scenarios') { rows.push([EC.VARIABLES[D.key].label, 'Takeoff allowable W/P [lbf/hp]', 'Cruise allowable W/P [lbf/hp]', 'Landing W/S limit [lbf/ft2]', 'L/D', 'MTOW [kg]', 'S [ft2]', 'P [hp]', 'Status']); for (const it of D.items) { const m = it.r.model, ws = R.point.ws; rows.push([it.value, m.byId.takeoff.valid ? m.byId.takeoff.data.wp(ws) : NaN, m.byId.cruise.valid ? m.byId.cruise.data.wp(ws) : NaN, m.byId.landing.valid ? m.byId.landing.data.wsMax : NaN, it.r.aero.LD, it.r.weight.m_kg, it.r.geometry.S_ft2, it.r.power.inst_hp, it.r.status]); } }
    download('ega_' + name + (kind === 'csvm' ? '_matrix' : '') + '_' + stamp() + '.csv', csvDoc(rows, head), 'text/csv;charset=utf-8');
  }
  function reportRows(r, s) {
    const rows = [['Section', 'Quantity', 'Value', 'Unit']];
    const add = (sec, q, v, u) => rows.push([sec, q, v, u || '']);
    add('Inputs', 'Sizing formulation', s.formulation.mode + (s.formulation.mode === 'D' ? ' (' + s.formulation.batterySpec + '; ' + s.formulation.closures.join('+') + ')' : ''));
    add('Inputs', 'L/D source', s.ldMode); add('Inputs', 'Design point definition', s.pointDef); add('Inputs', 'Reference constants', s.constants);
    for (const [k, u] of [['range', 'nm'], ['payload', 'kg'], ['takeoffMass', 'kg'], ['batteryMass', 'kg'], ['batteryEnergy', 'kWh'], ['ewf', '-'], ['gravity', 'm/s2'], ['specificEnergy', 'Wh/kg'], ['usable', '-'], ['etaSys', '-'], ['etaProp', '-'], ['ldManual', '-'], ['AR', '-'], ['e', '-'], ['CD0', '-'], ['Wcr_WTO', '-'], ['ws', 'lbf/ft2'], ['wp', 'lbf/hp'], ['S', 'ft2'], ['P', 'hp'], ['V_cr_kt', 'kt'], ['CLmax_TO', '-'], ['CLmax_L', '-'], ['S_GTO', 'ft'], ['S_GL', 'ft'], ['WL_WTO', '-'], ['Pcont', 'kW'], ['Pelec', 'kW']]) add('Inputs', F[k] ? F[k].label : k, s[k], u);
    add('Inputs', 'Range basis', s.rangeBasis); add('Inputs', 'Reserve', s.reserveKind); add('Inputs', 'Reserve margin', s.reservePct, '%'); add('Inputs', 'Reserve energy', s.reserveEnergy, 'kWh'); add('Inputs', 'Reserve time', s.reserveMin, 'min'); add('Inputs', 'Reserve condition', s.reserveCond); add('Inputs', 'Reserve TAS', s.reserveV, 'kt');
    for (const w of ['cr', 'to', 'ld']) { add('Atmosphere', w + ' mode', s.atmo[w].mode); add('Atmosphere', w + ' density ratio', r.atmo[w].sigma, '-'); add('Atmosphere', w + ' density', r.atmo[w].rho, 'slug/ft3'); }
    add('Status', 'Overall', r.status); for (const x of r.statusReasons) add('Status', 'Reason', x);
    const sz = r.sizing;
    add('Sizing', 'Status', sz.status); add('Sizing', 'Takeoff mass', r.weight.m_kg, 'kg'); add('Sizing', 'Takeoff mass', r.weight.m_lb, 'lb'); add('Sizing', 'Takeoff weight', r.weight.W_lbf, 'lbf'); add('Sizing', 'Takeoff weight', r.weight.W_N, 'N');
    for (const [k, u] of [['emptyMass', 'kg'], ['batteryMass', 'kg'], ['payloadMass', 'kg'], ['batteryFraction', '-'], ['payloadFraction', '-'], ['batteryEnergy', 'kWh'], ['range', 'nm'], ['mtowMargin', 'kg'], ['rangeFactor', 'nm'], ['closureResidual', 'kg']]) add('Sizing', k, sz[k], u);
    if (sz.energy) for (const [k, v] of Object.entries(sz.energy)) add('Energy', k, v, k.endsWith('kWh') ? 'kWh' : '-');
    const a = r.aero;
    for (const [k, u] of [['q', 'lbf/ft2'], ['CL', '-'], ['CD0', '-'], ['CDi', '-'], ['CD', '-'], ['LD', '-'], ['LDmax', '-'], ['CLstar', '-'], ['V_bestLD_kt', 'kt'], ['V_minP_kt', 'kt']]) add('Aerodynamics', k, a[k], u);
    add('Aerodynamics', 'L/D passed to sizing (W_TO/D)', r.ld.eff, '-'); if (s.ldMode === 'manual') add('Aerodynamics', 'Prescribed minus drag-polar L/D', r.ld.diff, '-');
    for (const [k, u] of [['S_ft2', 'ft2'], ['S_m2', 'm2'], ['b_ft', 'ft'], ['b_m', 'm'], ['c_ft', 'ft'], ['c_m', 'm']]) add('Geometry', k, r.geometry[k], u);
    add('Geometry', 'W/S', r.point.ws, 'lbf/ft2'); add('Geometry', 'W/P', r.point.wp, 'lbf/hp');
    for (const [k, u] of [['inst_hp', 'hp'], ['inst_kW', 'kW'], ['req_hp', 'hp'], ['req_kW', 'kW'], ['margin_hp', 'hp'], ['margin_pct', '%'], ['cr_shaft_hp', 'hp'], ['cr_shaft_kW', 'kW'], ['cr_elec_kW', 'kW'], ['inst_elec_kW', 'kW'], ['throttle', '-'], ['cRate_cruise', '1/h'], ['cRate_takeoff', '1/h'], ['endurance_h', 'h']]) add('Power', k, r.power[k], u);
    add('Power', 'Continuous rating check', r.power.cont.known ? (r.power.cont.ok ? 'pass' : 'fail') : 'unverified');
    add('Power', 'Electrical capability check', r.power.elec.known ? (r.power.elec.ok ? 'pass' : 'fail') : 'unverified');
    for (const row of r.ev.rows) { add('Constraints', row.name + ' value', row.value, row.type === 'power' ? 'lbf/hp' : 'lbf/ft2'); add('Constraints', row.name + ' margin', row.margin, row.type === 'power' ? 'lbf/hp' : 'lbf/ft2'); add('Constraints', row.name + ' status', !row.enabled ? 'not enforced' : row.satisfied === null ? 'indeterminate' : row.satisfied ? 'satisfied' : 'violated'); }
    for (const u of EC.UNVERIFIED) add('Constraints', u.name, 'unverified (not modeled)');
    return rows;
  }
  function exportReportCSV() { download('ega_design_report_' + stamp() + '.csv', csvDoc(reportRows(R, SPEC), ['Electric GA integrated design: current design report', 'Generated ' + new Date().toISOString()]), 'text/csv;charset=utf-8'); }
  function exportConstraintCSV() {
    const s = SAMP, m = R.model;
    const rows = [['W/S [lbf/ft2]', 'Takeoff allowable W/P [lbf/hp]', 'Cruise allowable W/P [lbf/hp]', 'Governing allowable W/P [lbf/hp]', 'Governing constraint', 'Cruise D/W [-]', 'Cruise L/D [-]']];
    for (let i = 0; i < s.n; i++) rows.push([s.ws[i], s.series.takeoff ? s.series.takeoff[i] : NaN, s.series.cruise ? s.series.cruise[i] : NaN, s.env[i], s.gov[i] || '', s.dw ? s.dw[i] : NaN, s.dw ? (R.aero.valid ? R.aero.r : 1) / s.dw[i] : NaN]);
    download('ega_constraint_data_' + stamp() + '.csv', csvDoc(rows, ['Electric GA integrated design: constraint curves', 'Landing W/S limit: ' + (m.byId.landing.valid ? m.byId.landing.data.wsMax : 'NaN') + ' lbf/ft2', 'Generated ' + new Date().toISOString()]), 'text/csv;charset=utf-8');
  }
  function exportComparisonCSV() {
    const { cols } = cmpColumns();
    const rows = [['Quantity', 'Unit'].concat(cols.map((c) => c.name))];
    for (const [l, g, u] of CMP_INPUTS) rows.push([l, u].concat(cols.map((c) => g(c.spec))));
    for (const [l, g, u] of CMP_OUTPUTS) rows.push([l, u].concat(cols.map((c) => g(c.r))));
    const base = cols[0];
    for (const [l, g, u] of CMP_OUTPUTS) { const b = g(base.r); if (typeof b !== 'number') continue; rows.push(['Change in ' + l + ' vs ' + base.name, '%'].concat(cols.map((c) => { const v = g(c.r); return isNum(v) && isNum(b) && Math.abs(b) > 1e-12 ? 100 * (v - b) / Math.abs(b) : NaN; }))); }
    download('ega_comparison_' + stamp() + '.csv', csvDoc(rows, ['Electric GA integrated design: iteration comparison', 'Generated ' + new Date().toISOString()]), 'text/csv;charset=utf-8');
  }
  function exportVerificationCSV() {
    const res = VER.result;
    if (!res) { toast('Run the verification suite first.', 'bad'); return; }
    const rows = [['Group', 'Check', 'Expected', 'Actual', 'Error', 'Tolerance', 'Result', 'Detail']];
    for (const x of res.results) rows.push([x.group, x.name, x.expected, x.actual, x.err == null ? '' : x.err, x.tol == null ? '' : x.tol, x.pass ? 'pass' : 'fail', x.detail || '']);
    download('ega_verification_' + stamp() + '.csv', csvDoc(rows, ['Electric GA integrated design: verification results', res.passed + ' of ' + res.total + ' passed', 'Generated ' + new Date().toISOString()]), 'text/csv;charset=utf-8');
  }
  function exportWorkspace() {
    const doc = { format: FORMAT, version: 1, kind: 'workspace', exportedAt: new Date().toISOString(), design: designOf(state), units: state.units, study: state.study, opt: state.opt, iterations: state.iterations, currentResults: summarize(R) };
    download('ega_workspace_' + stamp() + '.json', JSON.stringify(doc, null, 2), 'application/json');
  }
  function exportIteration(id) {
    const it = state.iterations.find((x) => x.id === id); if (!it) return;
    download('ega_iteration_' + it.name.replace(/[^a-z0-9]+/gi, '-').slice(0, 40) + '.json', JSON.stringify({ format: FORMAT, version: 1, kind: 'iteration', exportedAt: new Date().toISOString(), iteration: it }, null, 2), 'application/json');
  }
  function importFile(e) {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => importJSON(String(rd.result));
    rd.onerror = () => toast('Could not read the file.', 'bad');
    rd.readAsText(f);
  }
  function importJSON(text) {
    let doc;
    try { doc = JSON.parse(text); } catch (_) { toast('The file is not valid JSON.', 'bad'); return; }
    if (!doc || doc.format !== FORMAT) { toast('This file was not exported by this tool.', 'bad'); return; }
    const incoming = doc.kind === 'iteration' ? [doc.iteration] : Array.isArray(doc.iterations) ? doc.iterations : [];
    const tmp = sanitizeState(mergeInto(defaultState(), { iterations: incoming }));
    const ids = new Set(state.iterations.map((x) => x.id));
    let n = 0;
    for (const it of tmp.iterations) { if (ids.has(it.id)) it.id = uid('it'); state.iterations.push(it); n++; }

    if (doc.kind === 'workspace' && doc.design) toast('Imported ' + n + ' iteration' + (n === 1 ? '' : 's') + '.', null, { label: 'Also load its current design', fn: () => { beginEdit(); applyDesign(doc.design); noteEdit('Loaded imported design', null, null); commitEdit(); refresh(); } });
    else toast('Imported ' + n + ' iteration' + (n === 1 ? '' : 's') + '.');
    refresh();
  }

  /* ================= 24. Toasts, theme, tabs ================= */
  function toast(msg, kind, action) {
    const host = $('#toasts');
    const t = h('div', { class: 'toast' + (kind === 'bad' ? ' bad' : ''), role: 'status' }, h('span', {}, msg));
    if (action) t.append(h('button', { type: 'button', onclick: () => { action.fn(); t.remove(); } }, action.label));
    host.append(t);
    setTimeout(() => t.remove(), action ? 9000 : 5200);
  }
  function applyTheme() {
    if (state.ui.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', state.ui.theme);
  }
  function cycleTheme() {
    state.ui.theme = state.ui.theme === 'auto' ? 'light' : state.ui.theme === 'light' ? 'dark' : 'auto';
    applyTheme(); STUDY.sig = null; refresh();
    toast('Theme: ' + state.ui.theme + (state.ui.theme === 'auto' ? ' (follows the system)' : '') + '.');
  }
  const TAB_DEFS = [['overview', 'Overview', false, 'Overview'], ['sizing', 'Weight sizing', false, 'Sizing'], ['studies', 'Trade studies', false, 'Studies'], ['opt', 'Optimization', false, 'Optimize'], ['history', 'Design history', false, 'History'], [null], ['verify', 'Verification', true, 'Checks'], ['method', 'Methodology', true, 'Method']];
  const PANELS = {};
  function buildTabs() {
    const bar = $('#tabbar');
    for (const [id, label, aux, short] of TAB_DEFS) {
      if (!id) { bar.append(h('span', { class: 'tab-sep' })); continue; }
      bar.append(h('button', { type: 'button', class: 'tab' + (aux ? ' aux' : ''), role: 'tab', id: 'tab-' + id, 'aria-controls': 'panel-' + id, 'data-tab': id, title: label, onclick: () => setTab(id) },
        h('span', { class: 't-long' }, label), h('span', { class: 't-short', 'aria-hidden': 'true' }, short), h('span', { class: 'badge', id: 'badge-' + id, hidden: true })));
      const p = h('section', { class: 'tabpanel', role: 'tabpanel', id: 'panel-' + id, 'aria-labelledby': 'tab-' + id, hidden: true });
      PANELS[id] = p;
      $('#work').append(p);
    }
    bar.addEventListener('keydown', (e) => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      const ids = TAB_DEFS.filter((t) => t[0]).map((t) => t[0]);
      const i = ids.indexOf(state.ui.tab), j = (i + (e.key === 'ArrowRight' ? 1 : -1) + ids.length) % ids.length;
      setTab(ids[j]); $('#tab-' + ids[j]).focus();
    });
    buildOverview(PANELS.overview); buildSizing(PANELS.sizing); buildStudies(PANELS.studies); buildOpt(PANELS.opt); buildHistory(PANELS.history); buildVerify(PANELS.verify); buildMethod(PANELS.method);
  }
  function setTab(id) {
    state.ui.tab = id; saveSoon();
    renderTabs();
    renderTab();
    if (id === 'verify' && !VER.result) startVerification();
  }
  function renderTabs() {
    for (const [id] of TAB_DEFS) {

      $('#tab-' + id).setAttribute('aria-selected', String(on));

  }
  function renderTab() {
    const tab = state.ui.tab;
    if (tab === 'overview') renderOverview();
    else if (tab === 'sizing') renderSizing();
    else if (tab === 'studies') renderStudies();

    else if (tab === 'history') renderHistory();
    else if (tab === 'verify') renderVerify();
  }

  /* ================= 25. Refresh and init ================= */
  let heavyTimer = 0;
  function refresh(opts) {
    opts = opts || {};
    compute();
    renderStrip(); renderInputs(); renderInspector();
    if (state.ui.tab === 'overview') renderOverview();
    else if (opts.light && (state.ui.tab === 'studies' || state.ui.tab === 'opt' || state.ui.tab === 'sizing')) { clearTimeout(heavyTimer); heavyTimer = setTimeout(renderTab, 240); }
    else renderTab();
    renderTabs();

  }
  function init() {

  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
