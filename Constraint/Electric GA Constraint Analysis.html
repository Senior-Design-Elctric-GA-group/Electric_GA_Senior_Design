<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Constraint Diagram · Electric GA Preliminary Sizing</title>
<meta name="description" content="Interactive Roskam-style wing-loading versus power-loading constraint diagram for preliminary electric general-aviation aircraft sizing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612:wght@400;700&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* ---------- Tokens ---------- */
:root {
  color-scheme: light;
  --paper: #E7EBEF;
  --sheet: #FFFFFF;
  --sheet-2: #F4F6F8;
  --sheet-3: #EBEFF3;
  --ink: #16202B;
  --ink-2: #47576A;
  --ink-3: #6A7889;
  --rule: #D3DAE1;
  --rule-2: #B9C3CD;
  --accent: #0B5CAD;
  --accent-2: #084A8C;
  --accent-soft: #E2EDF8;
  --on-accent: #FFFFFF;
  --ok: #1D7539;
  --ok-soft: #E3F1E7;
  --bad: #B42318;
  --bad-soft: #FBE9E7;
  --warn: #875800;
  --warn-soft: #FAF0D8;
  --info: #36536E;
  --info-soft: #E5ECF3;
  --c-takeoff: #0072BD;
  --c-cruise: #D95319;
  --c-landing: #7E2F8E;
  --c-envelope: #3D8B37;
  --c-feasible: #D1EBD6;
  --feasible-opacity: 0.75;
  --c-point: #16202B;
  --c-opt: #A0730A;
  --c-compare: #9CC3E6;
  --chart-bg: #FFFFFF;
  --chart-plot: #FFFFFF;
  --chart-grid: #DAE0E7;
  --chart-grid-minor: #EFF2F5;
  --chart-axis: #2E3A47;
  --chart-cross: #7D8B99;
  --font-ui: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", "Segoe UI", system-ui, sans-serif;
  --font-num: "B612", Verdana, "DejaVu Sans", "Segoe UI", sans-serif;
  --radius: 4px;
  --shadow-pop: 0 8px 28px rgba(14, 26, 40, 0.2);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0C1116; --sheet: #141B22; --sheet-2: #19222B; --sheet-3: #1F2933;
    --ink: #E1E7ED; --ink-2: #A2AFBD; --ink-3: #7D8C9B; --rule: #26303A; --rule-2: #36424F;
    --accent: #5AA9FF; --accent-2: #86C0FF; --accent-soft: #15283C; --on-accent: #06121F;
    --ok: #5CC77A; --ok-soft: #122D1C; --bad: #FF7B6B; --bad-soft: #391714; --warn: #F0B545; --warn-soft: #30240B; --info: #9DB8D3; --info-soft: #17222D;
    --c-takeoff: #4DB3FF; --c-cruise: #FF8A4C; --c-landing: #C58BD9; --c-envelope: #6CCB5F; --c-feasible: #2E6B3E; --feasible-opacity: 0.55;
    --c-point: #E1E7ED; --c-opt: #F2C14E; --c-compare: #2D5E8C;
    --chart-bg: #141B22; --chart-plot: #10161C; --chart-grid: #26313B; --chart-grid-minor: #19212A; --chart-axis: #9AA8B6; --chart-cross: #6D7C8B;
    --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0C1116; --sheet: #141B22; --sheet-2: #19222B; --sheet-3: #1F2933;
  --ink: #E1E7ED; --ink-2: #A2AFBD; --ink-3: #7D8C9B; --rule: #26303A; --rule-2: #36424F;
  --accent: #5AA9FF; --accent-2: #86C0FF; --accent-soft: #15283C; --on-accent: #06121F;
  --ok: #5CC77A; --ok-soft: #122D1C; --bad: #FF7B6B; --bad-soft: #391714; --warn: #F0B545; --warn-soft: #30240B; --info: #9DB8D3; --info-soft: #17222D;
  --c-takeoff: #4DB3FF; --c-cruise: #FF8A4C; --c-landing: #C58BD9; --c-envelope: #6CCB5F; --c-feasible: #2E6B3E; --feasible-opacity: 0.55;
  --c-point: #E1E7ED; --c-opt: #F2C14E; --c-compare: #2D5E8C;
  --chart-bg: #141B22; --chart-plot: #10161C; --chart-grid: #26313B; --chart-grid-minor: #19212A; --chart-axis: #9AA8B6; --chart-cross: #6D7C8B;
  --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55);
}

/* ---------- Base ---------- */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.35;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
sub { font-size: 0.72em; line-height: 0; }
h1, h2, h3 { margin: 0; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Layout ---------- */
.app {
  height: 100%;
  display: grid;
  grid-template-columns: 316px minmax(0, 1fr) 356px;
  grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "inputs center readout";
}
.topbar {
  grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 8px 16px; background: var(--sheet); border-bottom: 1px solid var(--rule); min-height: 54px;
}
.pane-inputs { grid-area: inputs; overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--rule); }
.center { grid-area: center; overflow-y: auto; min-width: 0; }
.pane-readout { grid-area: readout; overflow-y: auto; background: var(--sheet); border-left: 1px solid var(--rule); }
.diagram { padding: 14px 18px 6px; }
.tabs { margin: 8px 18px 28px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--radius); }

/* ---------- Top bar ---------- */
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-mark svg { width: 30px; height: 30px; display: block; }
.brand-mark .bg { fill: var(--accent); }
.brand-mark .fg { stroke: var(--on-accent); }
.brand-mark .fgf { fill: var(--on-accent); }
.brand-name { font-family: var(--font-num); font-weight: 700; font-size: 14.5px; }
.brand-sub { font-size: 13px; color: var(--ink-2); }
.top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Diagram ---------- */
.diagram-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 10px; }
.diagram-title { font-family: var(--font-num); font-size: 17px; font-weight: 700; letter-spacing: 0.005em; }
.diagram-sub { margin: 4px 0 0; color: var(--ink-2); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 48%; }
.chip { font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.info { color: var(--info); background: var(--info-soft); }
.chart-bar {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 6px 8px;
  background: var(--sheet); border: 1px solid var(--rule); border-bottom: 0; border-radius: var(--radius) var(--radius) 0 0;
}
.bar-grow { flex: 1 1 auto; }
.legend {
  display: flex; flex-wrap: wrap; gap: 2px 8px; padding: 5px 8px 6px;
  background: var(--sheet); border: 1px solid var(--rule); border-bottom: 0;
}
.legend.static { border: 0; padding: 0 0 6px; background: none; }
.lg {
  display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 5px;
  font-size: 13px; color: var(--ink); cursor: pointer; border-radius: 3px;
}
.lg:hover { background: var(--sheet-2); }
.lg.static { cursor: default; }
.lg.static:hover { background: none; }
.lg.off { color: var(--ink-3); }
.lg.off svg { opacity: 0.3; }
.lg.off span { text-decoration: line-through; }
.chart-host { position: relative; background: var(--chart-bg); border: 1px solid var(--rule); outline: none; overflow: hidden; }
.chart-host.main { height: clamp(380px, calc(100vh - 300px), 720px); border-radius: 0 0 var(--radius) var(--radius); }
.chart-host.small { height: 360px; border-radius: var(--radius); }
.chart-host:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.chart-svg, .chart-ov { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chart-svg { font-family: var(--font-num); user-select: none; -webkit-user-select: none; }
.chart-ov { touch-action: none; }
.chart-tip {
  position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none; min-width: 220px; max-width: 300px;
  padding: 8px 10px; background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-2);
  border-radius: var(--radius); box-shadow: var(--shadow-pop); font-size: 13px;
}
.tt-h { display: flex; justify-content: space-between; gap: 10px; font-family: var(--font-num); font-size: 12px; font-weight: 700; padding-bottom: 5px; margin-bottom: 4px; border-bottom: 1px solid var(--rule); }
.tt-h span { color: var(--ink-2); font-weight: 400; }
.tt-r { display: flex; align-items: center; gap: 7px; padding: 1px 0; }
.tt-r i { width: 10px; height: 3px; border-radius: 2px; background: var(--ink-3); flex: none; }
.tt-r b { margin-left: auto; font-family: var(--font-num); font-size: 12px; font-weight: 400; }
.tt-gov { font-weight: 600; }
.tt-gov i { background: var(--c-envelope); height: 6px; opacity: 0.55; }
.tt-f { margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--rule); font-size: 12.5px; }
.tt-f + .tt-f { margin-top: 2px; padding-top: 0; border-top: 0; color: var(--ink-2); }
.ok-t { color: var(--ok); font-weight: 600; }
.bad-t { color: var(--bad); font-weight: 600; }
.warn-t { color: var(--warn); font-weight: 600; }
.chart-hint { font-size: 12.5px; color: var(--ink-3); margin: 6px 2px 0; max-width: 110ch; }

/* ---------- Panes ---------- */
.pane-head { padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
.pane-title { font-family: var(--font-num); font-size: 13.5px; font-weight: 700; }
.pane-note { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-3); }
.grp { border-bottom: 1px solid var(--rule); }
.grp > summary {
  list-style: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  cursor: pointer; font-weight: 600; font-size: 15px; user-select: none;
}
.grp > summary::-webkit-details-marker { display: none; }
.grp > summary::before {
  content: ""; width: 7px; height: 7px; flex: none; border-right: 1.6px solid var(--ink-2); border-bottom: 1.6px solid var(--ink-2);
  transform: rotate(-45deg); transition: transform 0.15s;
}
.grp[open] > summary::before { transform: rotate(45deg); }
.grp > summary:hover { background: var(--sheet-2); }
.grp-title { flex: 1; }
.grp-flag { font-size: 12px; font-weight: 600; }
.grp-flag.err { color: var(--bad); }
.grp-flag.warn { color: var(--warn); }
.grp-body { padding: 0 14px 14px; }
.sub-title { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 12px 0 2px; }

/* ---------- Fields ---------- */
.field {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; align-items: center;
  padding: 8px 0 6px; border-top: 1px dashed var(--rule);
}
.grp-body > .field:first-child, .grp-body > div > .field:first-child { border-top: 0; }
.field-label { display: flex; flex-direction: column; min-width: 0; cursor: text; }
.field-label .sym { font-family: var(--font-num); font-size: 12.5px; font-weight: 700; }
.field-label .desc { font-size: 13px; color: var(--ink-2); line-height: 1.2; }
.field-ctl { display: flex; align-items: center; gap: 6px; }
.num, .txt, .select {
  border: 1px solid var(--rule-2); border-radius: var(--radius); background: var(--sheet); color: var(--ink);
  padding: 5px 7px; font-size: 13.5px;
}
.num { width: 92px; font-family: var(--font-num); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.num.sm { width: 64px; }
.num:focus, .txt:focus, .select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.num.is-err { border-color: var(--bad); background: var(--bad-soft); }
.num.is-warn { border-color: var(--warn); }
.unit { width: 42px; font-size: 12.5px; color: var(--ink-3); }
.slider { grid-column: 1 / -1; width: 100%; margin: 6px 0 0; height: 14px; accent-color: var(--accent); cursor: pointer; }
.msg { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.25; margin-top: 3px; color: var(--ink-3); }
.msg:empty { display: none; }
.msg.err { color: var(--bad); }
.msg.warn { color: var(--warn); }
.outs { margin: 8px 0 2px; padding: 6px 10px 7px; background: var(--sheet-2); border-left: 3px solid var(--rule-2); border-radius: 0 var(--radius) var(--radius) 0; }
.outs-cap { font-size: 12px; color: var(--ink-3); margin-bottom: 2px; }
.out { display: grid; grid-template-columns: minmax(0, 1fr) auto 46px; gap: 8px; align-items: baseline; padding: 2px 0; font-size: 13px; }
.out-k { color: var(--ink-2); }
.out-v { font-family: var(--font-num); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.out-u { font-size: 12px; color: var(--ink-3); }
.corr { margin-top: 8px; padding: 7px 10px; border: 1px solid var(--rule); border-radius: var(--radius); font-size: 12.5px; }
.corr-cap { font-size: 12px; color: var(--ink-3); }
.corr-eq { font-family: var(--font-num); font-size: 12px; margin: 2px 0; }
.corr-src { color: var(--ink-2); }
.atmo { margin: 6px 0 2px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); }
.atmo-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 8px; }
.atmo-label { font-size: 13px; font-weight: 600; }
.atmo .field { border-top: 0; padding-bottom: 2px; }
.atmo .atmo-isa { display: none; }
.atmo.isa-on .atmo-isa { display: block; }
.atmo.isa-on .atmo-ratio { display: none; }
.fine { font-size: 12.5px; color: var(--ink-3); margin: 8px 0 0; max-width: 75ch; }
.seg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0 4px; font-size: 13.5px; }
.x-fields, .y-fields { display: none; }
.x-manual .x-fields, .y-manual .y-fields { display: block; }
.y-manual .y-auto-fields { display: none; }
.toggles { display: flex; flex-direction: column; gap: 7px; padding: 6px 0; }

/* ---------- Segmented control and switches ---------- */
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: var(--radius); overflow: hidden; flex: none; }
.seg-btn { border: 0; background: var(--sheet); color: var(--ink-2); font-size: 13px; font-weight: 600; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
.seg-btn + .seg-btn { border-left: 1px solid var(--rule-2); }
.seg-btn:hover { background: var(--sheet-2); }
.seg-btn.on { background: var(--accent); color: var(--on-accent); }
.seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13.5px; position: relative; }
.sw-input { position: absolute; opacity: 0; width: 1px; height: 1px; margin: 0; }
.sw-track { width: 30px; height: 17px; border-radius: 999px; background: var(--rule-2); position: relative; flex: none; transition: background 0.12s; }
.sw-track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%;
  background: #FFFFFF; transition: transform 0.12s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}
.sw-input:checked + .sw-track { background: var(--accent); }
.sw-input:checked + .sw-track::after { transform: translateX(13px); }
.sw-input:focus-visible + .sw-track { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Constraint table ---------- */
.cons { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 4px; }
.cons th, .cons td { padding: 6px 4px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; }
.cons thead th { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.cons td { width: 52px; text-align: center; }
.cons tbody th { font-weight: 600; }
.cons-cat { display: block; font-weight: 400; font-size: 12px; color: var(--ink-3); }
.cons .na { color: var(--ink-3); }
.future { margin-top: 12px; }
.future-title { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.future ul { list-style: none; margin: 4px 0 0; padding: 0; }
.future li { padding: 5px 0; border-top: 1px dashed var(--rule); font-size: 13px; }
.future-name { display: block; color: var(--ink-2); }
.future-note { display: block; font-size: 12px; color: var(--ink-3); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 13.5px; font-weight: 600; color: var(--ink); background: var(--sheet);
  border: 1px solid var(--rule-2); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--sheet-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-2); border-color: var(--accent-2); }
.btn.sm { font-size: 12.5px; padding: 3px 8px; }
.btn.ghost { background: transparent; }
.btn.icon { padding: 4px 6px; }
.btn.icon svg { width: 17px; height: 17px; display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-align: left; }
.linkbtn:hover { text-decoration: underline; }
.row-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }

/* ---------- Readout ---------- */
.ro-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule); }
.ro-head-ctl { display: flex; gap: 4px; align-items: center; }
.ro-head-ctl .select { max-width: 132px; padding: 4px 6px; }
.ro-body { padding: 12px 14px 20px; display: flex; flex-direction: column; gap: 14px; }
.ro-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ro-name { display: flex; align-items: center; gap: 8px; }
.ro-name label { font-size: 13px; color: var(--ink-2); }
.ro-name .txt { flex: 1; min-width: 0; }
.ro-coords { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.coord { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 6px; }
.coord label { grid-column: 1 / -1; }
.coord .sym { font-family: var(--font-num); font-weight: 700; font-size: 12.5px; }
.coord .num { width: 100%; font-size: 16px; padding: 6px 8px; }
.coord .unit { width: auto; }
.coord .msg { grid-column: 1 / -1; }
.ro-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.status { border-left: 4px solid var(--rule-2); padding: 9px 11px; border-radius: 0 var(--radius) var(--radius) 0; background: var(--sheet-2); }
.status.ok { border-color: var(--ok); background: var(--ok-soft); }
.status.bad { border-color: var(--bad); background: var(--bad-soft); }
.status.warn { border-color: var(--warn); background: var(--warn-soft); }
.status-title { font-family: var(--font-num); font-weight: 700; font-size: 15px; }
.status.ok .status-title { color: var(--ok); }
.status.bad .status-title { color: var(--bad); }
.status.warn .status-title { color: var(--warn); }
.status ul { margin: 6px 0 0; padding-left: 17px; }
.status li { margin: 4px 0; font-size: 13px; }
.status p { margin: 4px 0 0; font-size: 13px; }
.status .note { color: var(--ink-2); }
.block-title { font-family: var(--font-num); font-size: 12.5px; font-weight: 700; margin: 0 0 6px; }
.checks { width: 100%; border-collapse: collapse; font-size: 13px; }
.checks th, .checks td { padding: 5px 4px; border-bottom: 1px solid var(--rule); text-align: left; }
.checks thead th { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.checks td.n { text-align: right; font-family: var(--font-num); font-size: 12px; white-space: nowrap; }
.checks tr.gov th, .checks tr.gov td { border-bottom: 0; font-weight: 600; }
.units-note { font-size: 12px; color: var(--ink-3); margin: 5px 0 0; }
.pill { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.off { color: var(--ink-3); background: var(--sheet-3); }
.kv { margin: 0; }
.kv-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 13px; align-items: baseline; }
.kv-row:last-child { border-bottom: 0; }
.kv dt { color: var(--ink-2); }
.kv dt small { display: block; color: var(--ink-3); font-size: 12px; }
.kv dd { margin: 0; text-align: right; font-family: var(--font-num); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.kv dd .si { display: block; color: var(--ink-3); font-size: 11.5px; }
.kv-row.lead dd { font-size: 15px; font-weight: 700; }
.empty { color: var(--ink-3); font-size: 13px; margin: 0; }

/* ---------- Tabs ---------- */
.tabbar { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--rule); padding: 0 6px; }
.tab {
  border: 0; background: none; font-size: 14px; font-weight: 600; color: var(--ink-2);
  padding: 10px 10px 8px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabpanel { padding: 14px 16px 18px; }
.panel-intro { color: var(--ink-2); font-size: 13.5px; max-width: 78ch; margin: 0 0 12px; }
.sec-title { font-family: var(--font-num); font-size: 13px; font-weight: 700; margin: 18px 0 8px; }
.sec-title.inline { margin: 0; }
.tbl-wrap { overflow-x: auto; }
.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th, .tbl td { padding: 5px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; white-space: nowrap; }
.tbl thead th { background: var(--sheet-2); font-size: 12.5px; color: var(--ink-2); font-weight: 600; vertical-align: bottom; }
.tbl th.n, .tbl td.n { text-align: right; }
.tbl td.n { font-family: var(--font-num); font-size: 12px; font-variant-numeric: tabular-nums; }
.tbl td.wrap, .tbl th.wrap { white-space: normal; min-width: 220px; }
.tbl tr.is-active td { background: var(--accent-soft); }
.tbl tr.grp-row th { background: var(--sheet-3); font-family: var(--font-num); font-size: 12px; color: var(--ink); }
.tbl tr.diff td { background: var(--warn-soft); }
.tbl .u { font-weight: 400; color: var(--ink-3); font-size: 11.5px; }
.tbl .actions { text-align: right; }
.tbl .actions .btn + .btn { margin-left: 4px; }
.mini-label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.f-inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.f-inline > span:first-child { color: var(--ink-2); font-weight: 600; }

/* Optimization */
.opt-grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(280px, 1.1fr); gap: 16px; align-items: start; }
.obj-list { display: flex; flex-direction: column; gap: 6px; }
.obj { display: flex; gap: 9px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--radius); cursor: pointer; }
.obj:hover { background: var(--sheet-2); }
.obj input { margin: 3px 0 0; accent-color: var(--accent); }
.obj:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.obj-title { display: block; font-weight: 600; font-size: 14px; }
.obj-desc { display: block; font-size: 12.5px; color: var(--ink-2); }
.rec { border: 1px solid var(--rule); border-left: 4px solid var(--c-opt); border-radius: 0 var(--radius) var(--radius) 0; padding: 10px 12px; }
.rec-title { font-family: var(--font-num); font-weight: 700; font-size: 14px; margin-bottom: 6px; }
.rec-note { font-size: 13px; color: var(--ink-2); margin: 8px 0 0; }
.rec .row-actions { margin: 10px 0 0; }
.note-card { border: 1px solid var(--rule); border-radius: var(--radius); padding: 10px 12px; font-size: 13.5px; color: var(--ink-2); }
.note-card p { margin: 0; }
.pareto-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 16px; align-items: start; }
.pareto-side { display: flex; flex-direction: column; gap: 8px; }
.slider-label { font-size: 13.5px; font-weight: 600; }
.pareto-side .slider { margin: 0; }
.slider-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }

/* Scenarios */
.scen-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.scen-form { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 10px; }
.scen-form .txt { width: 230px; }
.sc-range { display: none; gap: 12px; flex-wrap: wrap; }
.scen-range .sc-range { display: inline-flex; }
.scen-range .sc-list { display: none; }
.scen-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 12px; }
.swatch-dot { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* Compare */
.cmp-pick { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 14px 0 10px; }
.cmp-pick .select { min-width: 220px; }
.cmp-tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; margin-top: 14px; }

/* Data and verification */
.verify-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.verify-sum { font-family: var(--font-num); font-weight: 700; font-size: 14px; }
.verify-sum.ok { color: var(--ok); }
.verify-sum.bad { color: var(--bad); }
.console {
  margin: 0; padding: 12px 14px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: var(--radius);
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.45; overflow-x: auto; max-height: 420px;
}
.assume h3 { font-family: var(--font-num); font-size: 13px; margin: 18px 0 8px; }
.assume h3:first-child { margin-top: 0; }
.assume p, .assume li { font-size: 13.5px; max-width: 80ch; color: var(--ink); }
.assume ul { padding-left: 18px; }
.assume li { margin: 4px 0; }
.assume code, .eq { font-family: var(--font-num); font-size: 12px; }

/* Export */
.export-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.ex-sec { border: 1px solid var(--rule); border-radius: var(--radius); padding: 12px 14px; }
.ex-sec .sec-title { margin-top: 0; }
.ex-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.ex-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.file-btn { position: relative; display: inline-flex; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.area { width: 100%; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; margin-top: 8px; }

/* ---------- Toasts and dialog ---------- */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast {
  display: flex; align-items: center; gap: 12px; max-width: 420px; padding: 9px 12px; border-radius: var(--radius);
  background: var(--ink); color: var(--sheet); box-shadow: var(--shadow-pop); font-size: 13.5px;
}
.toast.bad { background: var(--bad); color: #FFFFFF; }
.toast.warn { background: var(--warn); color: #FFFFFF; }
.toast-btn { border: 1px solid currentColor; background: none; color: inherit; border-radius: var(--radius); padding: 2px 8px; font-weight: 700; cursor: pointer; }
dialog.dlg { border: 1px solid var(--rule-2); border-radius: 6px; padding: 0; width: min(760px, 94vw); background: var(--sheet); color: var(--ink); box-shadow: var(--shadow-pop); }
dialog.dlg::backdrop { background: rgba(8, 14, 22, 0.5); }
.dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--rule); }
.dlg-head strong { font-family: var(--font-num); font-size: 13.5px; }
.dlg-body { padding: 4px 14px 12px; }
.dlg-text { width: 100%; min-height: 260px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.dlg-img { max-width: 100%; border: 1px solid var(--rule); display: block; margin-top: 8px; }
.dlg-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--rule); }

/* ---------- Responsive ---------- */
@media (max-width: 1280px) {
  .app {
    height: auto; min-height: 100%;
    grid-template-columns: 300px minmax(0, 1fr);
    grid-template-rows: auto;
    grid-template-areas: "top top" "inputs diagram" "inputs readout" "inputs tabs";
  }
  .center { display: contents; }
  .diagram { grid-area: diagram; }
  .tabs { grid-area: tabs; align-self: start; }
  .pane-readout { grid-area: readout; margin: 4px 18px 0; border: 1px solid var(--rule); border-radius: var(--radius); }
  .ro-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--sheet); }
  .pane-inputs { grid-area: inputs; position: sticky; top: 54px; max-height: calc(100vh - 54px); align-self: start; }
  .chart-host.main { height: clamp(380px, 62vh, 640px); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "diagram" "readout" "inputs" "tabs"; }
  .pane-inputs { position: static; max-height: none; border-right: 0; margin: 12px 12px 0; border: 1px solid var(--rule); border-radius: var(--radius); }
  .pane-readout { margin: 4px 12px 0; }
  .ro-body { grid-template-columns: minmax(0, 1fr); }
  .diagram { padding: 12px 12px 6px; }
  .tabs { margin: 12px 12px 24px; }
  .topbar { flex-wrap: wrap; position: static; }
  .diagram-head { flex-direction: column; }
  .chips { max-width: none; justify-content: flex-start; }
  .chart-host.main { height: 440px; }
  .opt-grid, .pareto-wrap { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar"></header>
  <aside class="pane-inputs" id="inputs" aria-label="Engineering inputs"></aside>
  <main class="center" id="center">
    <section class="diagram" id="diagram" aria-label="Constraint diagram"></section>
    <section class="tabs" id="tabs" aria-label="Analysis workspace"></section>
  </main>
  <aside class="pane-readout" id="readout" aria-label="Selected design"></aside>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<dialog class="dlg" id="saveDlg" aria-labelledby="saveDlgTitle">
  <div class="dlg-head"><strong id="saveDlgTitle">Export</strong><button type="button" class="btn" id="saveDlgClose">Close</button></div>
  <div class="dlg-body"><p class="fine" id="saveDlgNote"></p><div id="saveDlgBody"></div></div>
  <div class="dlg-foot"><button type="button" class="btn primary" id="saveDlgCopy">Copy to clipboard</button></div>
</dialog>
<noscript><p style="padding:24px;font-family:sans-serif">This analysis tool needs JavaScript to run.</p></noscript>
<script>
/*!
 * Electric GA constraint analysis: numerical engine (v1.0)
 *
 * Mirrors the supplied MATLAB script (Roskam-style W/S–W/P matching diagram):
 *   1. Takeoff ground-roll constraint   (Roskam empirical correlation)
 *   2. Landing ground-roll constraint   (Roskam empirical correlation)
 *   3. Steady level-flight cruise       (parabolic drag polar)
 *
 * Pure functions only: no DOM access.
 * Browser: window.CAEngine    Node: module.exports
 *
 * Arithmetic is written in the same operation order as the MATLAB source so
 * results agree with MATLAB to floating-point round-off.
 */
(function (root, factory) {
  'use strict';
  const api = factory();
  if (typeof module === 'object' && module && module.exports) module.exports = api;
  if (root) root.CAEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * 1. Constants (MATLAB section 2) and unit conversions
   * ------------------------------------------------------------------ */
  const CONST = Object.freeze({
    rho_SL: 0.0023769,      // sea-level density [slug/ft^3]
    kt_to_fts: 1.68781,     // knots -> ft/s
    hp: 550,                // 1 hp = 550 ft·lbf/s
    hp_to_kW: 0.745699872,  // mechanical horsepower -> kW
    lb_to_kg: 0.45359237,
    ft_to_m: 0.3048,
    ft2_to_m2: 0.09290304,
    TOP_a: 0.009,           // Roskam: S_GTO = 4.9·TOP + 0.009·TOP²   [ft]
    TOP_b: 4.9,
    SGL_k: 0.265,           // Roskam: S_GL  = 0.265·Vs_L²            [ft, Vs_L in kt]
  });

  /* Original MATLAB parameter set */
  const BASELINE = Object.freeze({
    CLmax_TO: 1.60,
    CLmax_L: 1.95,
    CD0: 0.025,
    AR: 10.5,
    e: 0.80,
    eta_p: 0.80,
    S_GTO: 1300,
    sigma_TO: 0.81,
    S_GL: 1300,
    WL_WTO: 1.00,
    sigma_L: 1.00,          // MATLAB landing calculation uses sea-level density
    V_cr_kt: 115,
    sigma_cr: 0.76,
  });

  /* Original MATLAB sampling / axis conventions */
  const BASELINE_PLOT = Object.freeze({
    wsMin: 0.5, wsMax: 55, n: 1800,     // WS = linspace(0.5, 55, 1800)
    xMin: 0, xMax: 55,                   // xlim([0 55])
    scaleFromWS: 10,                     // scaleRegion = WS >= 10 & WS <= 55
    headroom: 1.15,                      // yUpper = 1.15*max(scaleValues)
    yFloor: 35,                          // yUpper = max(yUpper, 35)
  });

  const PARAM_KEYS = Object.freeze(Object.keys(BASELINE));

  function baselineParams() { return Object.assign({}, BASELINE); }

  /* ------------------------------------------------------------------ *
   * 2. Input validation
   *    rule 'pos'  : finite and > 0
   *    rule 'frac' : finite, > 0 and <= 1   (efficiencies)
   *    warn(v)     : soft engineering-plausibility warning (never blocks)
   * ------------------------------------------------------------------ */
  const sigmaWarn = (v) => (v > 1.25 ? 'A density ratio above 1.25 is unusual (very cold or below sea level).'
    : v < 0.4 ? 'A density ratio below 0.40 implies an extreme density altitude.' : null);

  const RULES = Object.freeze({
    CLmax_TO: { name: 'Takeoff CLmax', rule: 'pos',
      warn: (v) => (v < 1.0 || v > 2.6) ? 'Outside the usual range for propeller GA aircraft (Roskam single-prop: 1.3–1.9).' : null },
    CLmax_L: { name: 'Landing CLmax', rule: 'pos',
      warn: (v) => (v < 1.2 || v > 3.2) ? 'Outside the usual range (Roskam single-prop: 1.6–2.3).' : null },
    CD0: { name: 'Clean zero-lift drag coefficient', rule: 'pos',
      warn: (v) => (v < 0.012 || v > 0.06) ? 'Unusual clean CD0 for a GA aircraft (single-engine retractable: 0.020–0.030).' : null },
    AR: { name: 'Aspect ratio', rule: 'pos',
      warn: (v) => (v < 4 || v > 25) ? 'Well outside typical GA aspect ratios.' : null },
    e: { name: 'Oswald efficiency', rule: 'frac',
      warn: (v) => (v < 0.5 ? 'Very low span efficiency.' : null) },
    eta_p: { name: 'Cruise propeller efficiency', rule: 'frac',
      warn: (v) => (v > 0.92 ? 'Above typical propeller efficiency (about 0.80–0.88).' : v < 0.5 ? 'Very low propeller efficiency.' : null) },
    S_GTO: { name: 'Takeoff ground roll', rule: 'pos', warn: null },
    sigma_TO: { name: 'Takeoff density ratio', rule: 'pos', warn: sigmaWarn },
    S_GL: { name: 'Landing ground roll', rule: 'pos', warn: null },
    WL_WTO: { name: 'Landing-to-takeoff weight ratio', rule: 'pos',
      warn: (v) => (v > 1 ? 'Landing weight exceeds takeoff weight.' : v < 0.5 ? 'Unusually low landing weight fraction.' : null) },
    sigma_L: { name: 'Landing density ratio', rule: 'pos', warn: sigmaWarn },
    V_cr_kt: { name: 'Cruise speed', rule: 'pos',
      warn: (v) => (v > 250 ? 'Compressibility effects are not modeled.' : v < 40 ? 'Very low cruise speed.' : null) },
    sigma_cr: { name: 'Cruise density ratio', rule: 'pos',
      warn: (v) => (v > 1.25 ? 'A density ratio above 1.25 is unusual.' : v < 0.2 ? 'Beyond typical GA cruise altitudes.' : null) },
  });

  function validateParams(p) {
    const errors = {};
    const warnings = {};
    for (const key of PARAM_KEYS) {
      const r = RULES[key];
      const v = p ? p[key] : undefined;
      if (typeof v !== 'number' || !Number.isFinite(v)) {
        errors[key] = r.name + ': enter a finite numeric value.';
        continue;
      }
      if (r.rule === 'pos' && !(v > 0)) { errors[key] = r.name + ' must be greater than zero.'; continue; }
      if (r.rule === 'frac' && !(v > 0 && v <= 1)) { errors[key] = r.name + ' must be greater than 0 and no more than 1.'; continue; }
      const w = r.warn ? r.warn(v) : null;
      if (w) warnings[key] = w;
    }
    return { errors, warnings };
  }

  /* ------------------------------------------------------------------ *
   * 3. Optional ISA atmosphere (explicitly selectable; not used by the
   *    MATLAB baseline, which specifies density ratios directly)
   *    Pressure altitude in ft, temperature deviation from ISA in K (= °C).
   * ------------------------------------------------------------------ */
  const ISA = Object.freeze({ T0: 288.15, L: 0.0065, g0: 9.80665, R: 287.05287, h11: 11000, h20: 20000, T11: 216.65 });
  const ISA_N = ISA.g0 / (ISA.R * ISA.L); // ≈ 5.25588

  function densityAltitudeFt(sigma) {
    if (!(sigma > 0)) return NaN;
    const s11 = Math.pow(ISA.T11 / ISA.T0, ISA_N - 1);
    let h;
    if (sigma >= s11) h = (ISA.T0 / ISA.L) * (1 - Math.pow(sigma, 1 / (ISA_N - 1)));
    else h = ISA.h11 - (ISA.R * ISA.T11 / ISA.g0) * Math.log(sigma / s11);
    return h / CONST.ft_to_m;
  }

  function isaAtmosphere(hp_ft, dT) {
    if (typeof hp_ft !== 'number' || !Number.isFinite(hp_ft)) return { ok: false, error: 'Pressure altitude must be a finite number.' };
    if (typeof dT !== 'number' || !Number.isFinite(dT)) return { ok: false, error: 'ISA temperature deviation must be a finite number.' };
    const h = hp_ft * CONST.ft_to_m;
    if (h < -610 || h > ISA.h20) return { ok: false, error: 'Pressure altitude must lie between −2,000 ft and 65,617 ft (implemented ISA range).' };
    let Tstd, delta;
    if (h <= ISA.h11) {
      Tstd = ISA.T0 - ISA.L * h;
      delta = Math.pow(Tstd / ISA.T0, ISA_N);
    } else {
      Tstd = ISA.T11;
      delta = Math.pow(ISA.T11 / ISA.T0, ISA_N) * Math.exp(-ISA.g0 * (h - ISA.h11) / (ISA.R * ISA.T11));
    }
    const T = Tstd + dT;
    if (!(T > 0)) return { ok: false, error: 'The resulting static temperature must be above 0 K.' };
    const sigma = delta * ISA.T0 / T;
    return { ok: true, sigma, delta, theta: T / ISA.T0, T_K: T, Tstd_K: Tstd, oat_C: T - 273.15, densityAlt_ft: densityAltitudeFt(sigma) };
  }

  /* ------------------------------------------------------------------ *
   * 4. Constraint registry
   *    type 'power' : allowable W/P(W/S) curve; feasible region is BELOW it
   *    type 'wsmax' : maximum takeoff W/S; feasible region is LEFT of it
   *    New constraints are added by appending an implemented definition.
   * ------------------------------------------------------------------ */
  const CONSTRAINTS = [
    {
      id: 'takeoff', name: 'Takeoff ground roll', short: 'Takeoff', type: 'power', implemented: true,
      deps: ['S_GTO', 'sigma_TO', 'CLmax_TO'],
      category: 'Empirical correlation (Roskam, preliminary)',
      equation: 'S_GTO = 4.9·TOP + 0.009·TOP²  →  W/P = TOP·σ_TO·CLmax,TO / (W/S)',
      compute(p) {
        // MATLAB section 7: positive quadratic root
        const a = CONST.TOP_a, b = CONST.TOP_b, c = -p.S_GTO;
        const TOP = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a);
        // MATLAB section 10: WP_takeoff = TOP .* sigma_TO .* CLmax_TO ./ WS
        const K = TOP * p.sigma_TO * p.CLmax_TO;
        return { TOP, K, wp: (ws) => K / ws };
      },
      check(d) {
        return (Number.isFinite(d.TOP) && d.TOP > 0 && Number.isFinite(d.K) && d.K > 0) ? null
          : 'The takeoff parameter TOP is not a positive finite number.';
      },
    },
    {
      id: 'cruise', name: 'Cruise speed (level flight)', short: 'Cruise', type: 'power', implemented: true,
      deps: ['V_cr_kt', 'sigma_cr', 'CD0', 'AR', 'e', 'eta_p'],
      category: 'Physics relation (parabolic drag polar, level flight)',
      equation: 'D/W = q·CD0/(W/S) + k·(W/S)/q  →  W/P = 550·ηp / (V·D/W)',
      compute(p) {
        const k = 1 / (Math.PI * p.e * p.AR);                 // MATLAB section 3
        const V = p.V_cr_kt * CONST.kt_to_fts;                // MATLAB section 11
        const rho = p.sigma_cr * CONST.rho_SL;
        const q = 0.5 * rho * (V * V);                        // MATLAB section 12
        const CD0 = p.CD0;
        const num = CONST.hp * p.eta_p;
        const dw = (ws) => q * CD0 / ws + k * ws / q;
        const wp = (ws) => num / (V * dw(ws));                // MATLAB section 13
        const dwMin = 2 * Math.sqrt(CD0 * k);
        return { k, V, rho, q, dw, wp, dwMin, LDmax: 1 / dwMin, wsBestLD: q * Math.sqrt(CD0 / k), wpMax: num / (V * dwMin) };
      },
      check(d) {
        return ([d.k, d.V, d.rho, d.q].every((x) => Number.isFinite(x) && x > 0)) ? null
          : 'Cruise dynamic pressure or induced-drag factor is not a positive finite number.';
      },
    },
    {
      id: 'landing', name: 'Landing ground roll', short: 'Landing', type: 'wsmax', implemented: true,
      deps: ['S_GL', 'CLmax_L', 'WL_WTO', 'sigma_L'],
      category: 'Empirical correlation (Roskam, preliminary)',
      equation: 'S_GL = 0.265·Vs,L²  →  (W/S)_TO = ½·ρ·Vs,L²·CLmax,L / (W_L/W_TO)',
      compute(p) {
        const Vs_kt = Math.sqrt(p.S_GL / CONST.SGL_k);        // MATLAB section 8
        const Vs = Vs_kt * CONST.kt_to_fts;
        const rho = p.sigma_L * CONST.rho_SL;                 // sigma_L = 1 reproduces rho_SL exactly
        const wsAtLanding = 0.5 * rho * (Vs * Vs) * p.CLmax_L; // MATLAB section 9
        const wsMax = wsAtLanding / p.WL_WTO;
        return { Vs_kt, Vs, rho, wsAtLanding, wsMax };
      },
      check(d) {
        return (Number.isFinite(d.wsMax) && d.wsMax > 0) ? null : 'Landing wing-loading limit is not a positive finite number.';
      },
    },
    // ---- Future refinements: listed for the interface, intentionally not modeled ----
    { id: 'climb_roc', name: 'Sustained rate of climb', type: 'power', implemented: false,
      note: 'Needs a climb-speed schedule, rate-of-climb requirement and climb-configuration drag polar.' },
    { id: 'climb_grad', name: 'Climb gradient (takeoff and balked landing)', type: 'power', implemented: false,
      note: 'Needs flap and landing-gear drag increments and the certification gradient requirements.' },
    { id: 'ceiling', name: 'Service ceiling and high-altitude power', type: 'power', implemented: false,
      note: 'Needs motor/propeller power availability with altitude.' },
    { id: 'ttc', name: 'Time to climb', type: 'power', implemented: false,
      note: 'Needs an integrated climb model.' },
    { id: 'battery', name: 'Battery discharge-rate limit', type: 'power', implemented: false,
      note: 'Needs pack energy, C-rate limits and a mission power profile.' },
    { id: 'thermal', name: 'Motor and inverter thermal limit', type: 'power', implemented: false,
      note: 'Needs continuous versus peak power ratings and duty cycle.' },
    { id: 'cert_field', name: 'Certification field length (with obstacle)', type: 'power', implemented: false,
      note: 'Needs air-distance and obstacle-clearance segments beyond ground roll.' },
  ];

  /* ------------------------------------------------------------------ *
   * 5. Model assembly
   * ------------------------------------------------------------------ */
  function buildModel(p, enforce) {
    enforce = enforce || {};
    const val = validateParams(p);
    const list = [];
    for (const def of CONSTRAINTS) {
      if (!def.implemented) continue;
      const badDeps = def.deps.filter((k) => val.errors[k]);
      const c = {
        id: def.id, name: def.name, short: def.short, type: def.type, category: def.category,
        equation: def.equation, deps: def.deps.slice(),
        enabled: enforce[def.id] !== false,
        valid: badDeps.length === 0,
        badDeps, issue: null, data: null,
      };
      if (c.valid) {
        const d = def.compute(p);
        const issue = def.check(d);
        if (issue) { c.valid = false; c.issue = issue; } else c.data = d;
      } else {
        c.issue = badDeps.map((k) => val.errors[k]).join(' ');
      }
      list.push(c);
    }
    const byId = {};
    for (const c of list) byId[c.id] = c;
    const powerAll = list.filter((c) => c.type === 'power');
    const wsAll = list.filter((c) => c.type === 'wsmax');
    const activePower = powerAll.filter((c) => c.enabled && c.valid);
    const activeWS = wsAll.filter((c) => c.enabled && c.valid);
    const invalidEnabled = list.filter((c) => c.enabled && !c.valid);
    let wsLimit = Infinity, wsLimitId = null;
    for (const c of activeWS) if (c.data.wsMax < wsLimit) { wsLimit = c.data.wsMax; wsLimitId = c.id; }
    return {
      params: Object.assign({}, p), errors: val.errors, warnings: val.warnings,
      list, byId, powerAll, wsAll, activePower, activeWS, invalidEnabled,
      disabled: list.filter((c) => !c.enabled),
      indeterminate: invalidEnabled.length > 0,
      wsLimit, wsLimitId,
    };
  }

  /* Allowable W/P from every power constraint at one W/S, plus the governing envelope.
     Envelope = minimum over ENFORCED, VALID constraints (MATLAB: min(WP_all,[],1)).
     wp = +Infinity means no power-loading constraint is enforced (unbounded above). */
  function envelopeAt(model, ws) {
    const values = {};
    for (const c of model.powerAll) values[c.id] = c.valid ? c.data.wp(ws) : NaN;
    let wp = Infinity, gov = null, bad = false;
    for (const c of model.activePower) {
      const v = values[c.id];
      if (!Number.isFinite(v)) { bad = true; continue; }
      if (v < wp) { wp = v; gov = c.id; }   // strict '<' keeps the first constraint on ties, as MATLAB min does
    }
    if (bad) return { wp: NaN, gov: null, values };
    return { wp, gov, values };
  }

  /* ------------------------------------------------------------------ *
   * 6. Sampling (MATLAB section 1 and 14)
   * ------------------------------------------------------------------ */
  function linspace(d1, d2, n) {
    // Same internal formula as MATLAB's linspace: y = d1 + ((0:n1).*(d2-d1))./n1, y(end) = d2
    const y = new Float64Array(n);
    if (n === 1) { y[0] = d2; return y; }
    const n1 = n - 1, span = d2 - d1;
    for (let i = 0; i < n; i++) y[i] = d1 + (i * span) / n1;
    y[n - 1] = d2;
    return y;
  }

  function sampleModel(model, wsMin, wsMax, n) {
    const ws = linspace(wsMin, wsMax, n);
    const series = {};
    for (const c of model.powerAll) {
      if (!c.valid) continue;
      const arr = new Float64Array(n);
      for (let i = 0; i < n; i++) arr[i] = c.data.wp(ws[i]);
      series[c.id] = arr;
    }
    let dw = null;
    const cr = model.byId.cruise;
    if (cr && cr.valid) {
      dw = new Float64Array(n);
      for (let i = 0; i < n; i++) dw[i] = cr.data.dw(ws[i]);
    }
    const env = new Float64Array(n);
    const gov = new Array(n);
    const act = model.activePower;
    for (let i = 0; i < n; i++) {
      let m = Infinity, g = null;
      for (const c of act) { const v = series[c.id][i]; if (v < m) { m = v; g = c.id; } }
      env[i] = m; gov[i] = g;
    }
    return { ws, series, dw, env, gov, n, wsMin, wsMax };
  }

  /* Top boundary of the feasible region over the sampled range.
     MATLAB uses the samples with WS <= WS_landing; the exact landing limit is
     appended so the shaded edge sits on the analytic limit, not the nearest sample. */
  function feasibleBoundary(model, samp) {
    const lim = model.wsLimit;
    const xs = [], ys = [];
    let lastIndex = -1;
    for (let i = 0; i < samp.n; i++) {
      const x = samp.ws[i];
      if (x <= lim && !Number.isNaN(samp.env[i])) { xs.push(x); ys.push(samp.env[i]); lastIndex = i; }
    }
    if (Number.isFinite(lim) && xs.length && lim > xs[xs.length - 1] && lim < samp.wsMax) {
      xs.push(lim); ys.push(envelopeAt(model, lim).wp);
    }
    return { xs, ys, lastIndex, empty: xs.length === 0 };
  }

  /* Automatic upper W/P axis limit, MATLAB section 16 */
  function autoYUpper(ws, arrays, scaleFromWS, scaleToWS, headroom, floor) {
    let m = -Infinity;
    for (let i = 0; i < ws.length; i++) {
      const x = ws[i];
      if (x < scaleFromWS || x > scaleToWS) continue;
      for (const a of arrays) { const v = a[i]; if (Number.isFinite(v) && v > m) m = v; }
    }
    const y = Number.isFinite(m) ? headroom * m : floor;
    return Math.max(y, floor);
  }

  /* ------------------------------------------------------------------ *
   * 7. Design-point evaluation
   *    Power margin   = W/P_allowable − W/P_selected   (> 0 satisfied)
   *    Landing margin = W/S_limit     − W/S_selected   (> 0 satisfied)
   *    Points exactly on a boundary are feasible (≤), with relative tolerance tol.
   * ------------------------------------------------------------------ */
  function evaluatePoint(model, ws, wp, tol) {
    tol = tol == null ? 1e-9 : tol;
    const res = {
      ws, wp, pointErrors: [], rows: [], violations: [], invalid: [], notEnforced: [],
      envelope: null, governingPower: null, governingWS: model.wsLimitId, status: 'feasible', feasible: true,
    };
    const wsOK = typeof ws === 'number' && Number.isFinite(ws) && ws > 0;
    const wpOK = typeof wp === 'number' && Number.isFinite(wp) && wp > 0;
    if (!wsOK) res.pointErrors.push('W/S must be a positive, finite value (lb/ft²).');
    if (!wpOK) res.pointErrors.push('W/P must be a positive, finite value (lb/hp).');
    const pointOK = wsOK && wpOK;

    for (const c of model.list) {
      const row = { id: c.id, name: c.name, short: c.short, type: c.type, enabled: c.enabled, valid: c.valid, issue: c.issue,
        value: NaN, margin: NaN, marginPct: NaN, powerRatioPct: NaN, satisfied: null };
      if (c.valid) {
        if (c.type === 'power') {
          if (wsOK) row.value = c.data.wp(ws);
          if (pointOK) {
            row.margin = row.value - wp;
            row.marginPct = 100 * row.margin / row.value;
            row.powerRatioPct = 100 * (row.value / wp - 1);   // installed power above (+) / below (−) this requirement
            row.satisfied = row.margin >= -tol * Math.max(1, Math.abs(row.value));
          }
        } else {
          row.value = c.data.wsMax;
          if (pointOK) {
            row.margin = row.value - ws;
            row.marginPct = 100 * row.margin / row.value;
            row.satisfied = row.margin >= -tol * Math.max(1, Math.abs(row.value));
          }
        }
      }
      res.rows.push(row);
      if (!c.enabled) res.notEnforced.push(c.short);
      else if (!c.valid) res.invalid.push(row);
      else if (row.satisfied === false) res.violations.push(row);
    }
    if (wsOK) {
      res.envelope = envelopeAt(model, ws);
      res.governingPower = res.envelope.gov;
    }
    if (!pointOK) { res.status = 'invalid'; res.feasible = null; }
    else if (res.violations.length) { res.status = 'infeasible'; res.feasible = false; }
    else if (res.invalid.length) { res.status = 'indeterminate'; res.feasible = null; }
    else { res.status = 'feasible'; res.feasible = true; }
    return res;
  }

  function violationMessage(row, ws, wp) {
    const f2 = (v) => (Math.round(v * 100) / 100).toFixed(2);
    if (row.type === 'power') {
      const more = 100 * (wp / row.value - 1);
      return 'Design point violates the ' + row.short.toLowerCase() + ' power-loading constraint: W/P = ' + f2(wp) +
        ' lb/hp exceeds the allowable ' + f2(row.value) + ' lb/hp (short by ' + f2(-row.margin) + ' lb/hp; ' +
        more.toFixed(1) + '% more shaft power is required).';
    }
    return 'Design point violates the ' + row.short.toLowerCase() + ' wing-loading constraint: W/S = ' + f2(ws) +
      ' lb/ft² exceeds the limit of ' + f2(row.value) + ' lb/ft² (by ' + f2(-row.margin) + ' lb/ft²).';
  }

  /* ------------------------------------------------------------------ *
   * 8. Physical sizing at a design point (requires takeoff weight)
   * ------------------------------------------------------------------ */
  function sizing(W_lb, ws, wp, wpRequired, AR, etaElec) {
    const o = { W_lb, W_kg: W_lb * CONST.lb_to_kg };
    o.S_ft2 = W_lb / ws;
    o.S_m2 = o.S_ft2 * CONST.ft2_to_m2;
    o.P_hp = W_lb / wp;
    o.P_kW = o.P_hp * CONST.hp_to_kW;
    o.Preq_hp = (wpRequired > 0) ? W_lb / wpRequired : NaN;  // wpRequired = +Infinity → 0 (no power constraint)
    o.Preq_kW = o.Preq_hp * CONST.hp_to_kW;
    o.margin_hp = o.P_hp - o.Preq_hp;
    o.margin_kW = o.margin_hp * CONST.hp_to_kW;
    o.margin_pct = o.Preq_hp > 0 ? 100 * (o.P_hp / o.Preq_hp - 1) : NaN;
    if (AR > 0 && Number.isFinite(AR)) {
      o.span_ft = Math.sqrt(AR * o.S_ft2);
      o.span_m = o.span_ft * CONST.ft_to_m;
      o.chord_ft = o.S_ft2 / o.span_ft;
      o.chord_m = o.chord_ft * CONST.ft_to_m;
    }
    if (etaElec > 0 && etaElec <= 1) {
      o.etaElec = etaElec;
      o.Pelec_kW = o.P_kW / etaElec;
      o.PreqElec_kW = o.Preq_kW / etaElec;
    }
    o.W_fromS = ws * o.S_ft2;   // identity checks: W = (W/S)·S and W = (W/P)·P
    o.W_fromP = wp * o.P_hp;
    return o;
  }

  /* Implied stall speeds (TAS) at a takeoff wing loading */
  function stallSpeeds(p, ws) {
    const o = { landing_kt: NaN, takeoff_kt: NaN };
    if (ws > 0 && p.CLmax_L > 0 && p.sigma_L > 0 && p.WL_WTO > 0) {
      o.landing_kt = Math.sqrt(2 * ws * p.WL_WTO / (p.sigma_L * CONST.rho_SL * p.CLmax_L)) / CONST.kt_to_fts;
    }
    if (ws > 0 && p.CLmax_TO > 0 && p.sigma_TO > 0) {
      o.takeoff_kt = Math.sqrt(2 * ws / (p.sigma_TO * CONST.rho_SL * p.CLmax_TO)) / CONST.kt_to_fts;
    }
    return o;
  }

  /* ------------------------------------------------------------------ *
   * 9. Envelope analysis and design-point recommendation
   * ------------------------------------------------------------------ */
  function governingSwitches(model, lo, hi, n) {
    n = n || 2400;
    if (model.activePower.length < 2 || !(hi > lo)) return [];
    const out = [];
    let prevWs = lo, prev = envelopeAt(model, lo);
    for (let i = 1; i < n; i++) {
      const ws = lo + (hi - lo) * i / (n - 1);
      const cur = envelopeAt(model, ws);
      if (cur.gov && prev.gov && cur.gov !== prev.gov) {
        const A = model.byId[prev.gov].data.wp, B = model.byId[cur.gov].data.wp;
        let a = prevWs, b = ws;
        for (let k = 0; k < 200 && (b - a) > 1e-13 * Math.max(1, b); k++) {
          const m = 0.5 * (a + b);
          if (A(m) <= B(m)) a = m; else b = m;
        }
        const x = 0.5 * (a + b);
        out.push({ ws: x, wp: Math.min(A(x), B(x)), from: prev.gov, to: cur.gov });
      }
      prev = cur; prevWs = ws;
    }
    return out;
  }

  function maxEnvelope(model, lo, hi) {
    if (!model.activePower.length) return { unbounded: true };
    const f = (x) => { const v = envelopeAt(model, x).wp; return Number.isFinite(v) ? v : -Infinity; };
    const N = 4001, h = (hi - lo) / (N - 1);
    let bi = 0, bv = -Infinity;
    for (let i = 0; i < N; i++) { const v = f(lo + i * h); if (v > bv) { bv = v; bi = i; } }
    let a = lo + Math.max(0, bi - 1) * h, b = lo + Math.min(N - 1, bi + 1) * h;
    const g = (Math.sqrt(5) - 1) / 2;
    let c = b - g * (b - a), d = a + g * (b - a), fc = f(c), fd = f(d);
    for (let it = 0; it < 300 && (b - a) > 1e-13 * Math.max(1, Math.abs(a) + Math.abs(b)); it++) {
      if (fc >= fd) { b = d; d = c; fd = fc; c = b - g * (b - a); fc = f(c); }
      else { a = c; c = d; fc = fd; d = a + g * (b - a); fd = f(d); }
    }
    let ws = 0.5 * (a + b), wp = f(ws);
    for (const x of [lo + bi * h, lo, hi]) { const v = f(x); if (v > wp) { wp = v; ws = x; } }
    const span = hi - lo;
    const e = envelopeAt(model, ws);
    const binding = model.activePower.filter((c) => Math.abs(c.data.wp(ws) - wp) <= 1e-6 * Math.abs(wp)).map((c) => c.id);
    return { ws, wp, gov: e.gov, binding, atLower: (ws - lo) <= 1e-7 * span, atUpper: (hi - ws) <= 1e-7 * span };
  }

  function searchDomain(model, wsMin, wsMax) {
    let hi = wsMax, hiBy = 'sampling';
    if (Number.isFinite(model.wsLimit) && model.wsLimit < hi) { hi = model.wsLimit; hiBy = model.wsLimitId; }
    return { lo: wsMin, hi, hiBy, empty: !(hi > wsMin) };
  }

  /* Non-dominated set for (minimize wing area, minimize shaft power) at fixed W_TO,
     i.e. maximize both W/S and W/P along the governing envelope. */
  function paretoFront(model, lo, hi, n) {
    n = n || 900;
    const all = [];
    for (let i = 0; i < n; i++) {
      const ws = lo + (hi - lo) * i / (n - 1);
      const e = envelopeAt(model, ws);
      if (Number.isFinite(e.wp) && e.wp > 0) all.push({ ws, wp: e.wp, gov: e.gov });
    }
    const front = [];
    let runMax = -Infinity;
    for (let i = all.length - 1; i >= 0; i--) {
      if (all[i].wp > runMax) { front.push(all[i]); runMax = all[i].wp; }
    }
    front.reverse();
    // Start the front at the refined minimum-power point (not the nearest grid sample),
    // so it agrees exactly with maxEnvelope().
    const best = maxEnvelope(model, lo, hi);
    if (!best.unbounded && Number.isFinite(best.wp)) {
      const rest = front.filter((q) => q.ws > best.ws && q.wp < best.wp);
      return { all, front: [{ ws: best.ws, wp: best.wp, gov: best.gov, binding: best.binding }].concat(rest) };
    }
    return { all, front };
  }

  /* ------------------------------------------------------------------ *
   * 10. MATLAB console printout (section 28) for side-by-side comparison
   * ------------------------------------------------------------------ */
  function matlabPrintout(model) {
    const p = model.params;
    const f = (v, d) => (typeof v === 'number' && Number.isFinite(v)) ? v.toFixed(d) : 'NaN';
    const TO = model.byId.takeoff && model.byId.takeoff.data;
    const CR = model.byId.cruise && model.byId.cruise.data;
    const LD = model.byId.landing && model.byId.landing.data;
    const k = CR ? CR.k : (p.e > 0 && p.AR > 0 ? 1 / (Math.PI * p.e * p.AR) : NaN);
    const L = [];
    L.push('', '=====================================================', ' PRELIMINARY W/P - W/S CONSTRAINT ANALYSIS', '=====================================================');
    L.push('', 'AERODYNAMICS');
    L.push('CLmax takeoff:               ' + f(p.CLmax_TO, 2));
    L.push('CLmax landing:               ' + f(p.CLmax_L, 2));
    L.push('CD0 clean:                   ' + f(p.CD0, 3));
    L.push('Aspect ratio:                ' + f(p.AR, 2));
    L.push('Oswald efficiency:           ' + f(p.e, 2));
    L.push('Induced drag factor k:       ' + f(k, 4));
    L.push('', 'TAKEOFF');
    L.push('Takeoff ground roll target:  ' + f(p.S_GTO, 0) + ' ft');
    L.push('Calculated TOP:              ' + f(TO ? TO.TOP : NaN, 2));
    L.push('Takeoff density ratio:       ' + f(p.sigma_TO, 4));
    L.push('', 'LANDING');
    L.push('Landing ground roll target:  ' + f(p.S_GL, 0) + ' ft');
    L.push('Derived landing stall speed: ' + f(LD ? LD.Vs_kt : NaN, 1) + ' kt');
    L.push('Landing W/S limit:           ' + f(LD ? LD.wsMax : NaN, 2) + ' lb/ft^2');
    L.push('Landing/takeoff weight ratio ' + f(p.WL_WTO, 2));
    L.push('', 'CRUISE');
    L.push('Cruise speed:                ' + f(p.V_cr_kt, 1) + ' kt');
    L.push('Cruise density ratio:        ' + f(p.sigma_cr, 3));
    L.push('Cruise prop efficiency:      ' + f(p.eta_p, 2));
    L.push('', 'MATCHING DIAGRAM CONVENTION');
    L.push('Lower W/P means more installed power.');
    L.push('Feasible power region is BELOW the governing curves.');
    L.push('Feasible wing-loading region is LEFT of landing limit.');
    return L.join('\n');
  }

  return Object.freeze({
    VERSION: '1.0.0',
    CONST, BASELINE, BASELINE_PLOT, PARAM_KEYS, RULES, CONSTRAINTS,
    baselineParams, validateParams, isaAtmosphere, densityAltitudeFt,
    buildModel, envelopeAt, linspace, sampleModel, feasibleBoundary, autoYUpper,
    evaluatePoint, violationMessage, sizing, stallSpeeds,
    governingSwitches, maxEnvelope, searchDomain, paretoFront, matlabPrintout,
  });
});
