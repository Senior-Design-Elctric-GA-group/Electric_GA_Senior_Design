      WP_cruise: [1.3319314438497485, 1.4125744292388243, 9.177254418513701, 22.749173092264837, 24.551323020209022, 34.14636044902177, 36.82504240871315, 35.35996293843933, 32.54376131167596, 29.558920760397548, 29.549206425665332],
      DW_cruise: [1.7019602342365334, 1.6047963953184785, 0.24701225974387403, 0.09964732972787968, 0.09233287958842645, 0.06638758340133624, 0.061558499430951194, 0.06410907036605552, 0.06965680243445654, 0.07669070094056553, 0.07671591309445736],
      WP_envelope: [1.3319314438497485, 1.4125744292388243, 9.177254418513701, 22.749173092264837, 23.969978976721503, 13.572031470990009, 9.124637652958409, 6.872575978479279, 5.512122957737876, 4.603817309998027, 4.601281476520894],
    },
    isa_sigma_7000: 0.8106441723272931,   // classic (1 − 6.87559e-6·h)^4.2559 formula
    isa_sigma_9000: 0.7619630157730017,
    // Values printed by the MATLAB script (fprintf formats)
    printout: { k: '0.0379', TOP: '195.27', Vs: '70.0', WSL: '32.39' },
  });

  /* A second, vectorized transcription of the MATLAB script that shares no code with the engine. */
  function matlabTranscription() {
    const n = 1800, d1 = 0.5, d2 = 55, n1 = n - 1;
    const WS = new Array(n);
    for (let i = 0; i < n; i++) WS[i] = d1 + (i * (d2 - d1)) / n1;
    WS[n - 1] = d2;
    const rho_SL = 0.0023769, knot_to_fts = 1.68781, hp_conversion = 550;
    const CLmax_TO = 1.60, CLmax_L = 1.95, CD0_clean = 0.025, AR = 10.5, e = 0.80;
    const k = 1 / (Math.PI * e * AR);
    const eta_prop_cruise = 0.80, sigma_TO = 0.81;
    const a_TOP = 0.009, b_TOP = 4.9, c_TOP = -1300;
    const TOP = (-b_TOP + Math.sqrt(b_TOP * b_TOP - 4 * a_TOP * c_TOP)) / (2 * a_TOP);
    const Vs_L_kts = Math.sqrt(1300 / 0.265);
    const Vs_L = Vs_L_kts * knot_to_fts;
    const WS_landing = (0.5 * rho_SL * (Vs_L * Vs_L) * CLmax_L) / 1.00;
    const WP_takeoff = WS.map((w) => TOP * sigma_TO * CLmax_TO / w);
    const V_cruise = 115 * knot_to_fts;
    const rho_cruise = 0.76 * rho_SL;
    const q_cruise = 0.5 * rho_cruise * (V_cruise * V_cruise);
    const DW_cruise = WS.map((w) => q_cruise * CD0_clean / w + k * w / q_cruise);
    const WP_cruise = DW_cruise.map((d) => hp_conversion * eta_prop_cruise / (V_cruise * d));
    const WP_envelope = WS.map((_, i) => Math.min(WP_takeoff[i], WP_cruise[i]));
    return { WS, WP_takeoff, WP_cruise, DW_cruise, WP_envelope, k, TOP, Vs_L_kts, WS_landing, q_cruise };
  }

  function run(E) {
    const R = [];
    const relErr = (a, b) => (b === 0 ? Math.abs(a) : Math.abs(a - b) / Math.abs(b));
    const fmt = (v) => (typeof v === 'number' ? (Number.isFinite(v) ? Number(v.toPrecision(12)).toString() : String(v)) : String(v));
    function near(group, name, actual, expected, tol) {
      const err = relErr(actual, expected);
      R.push({ group, name, expected: fmt(expected), actual: fmt(actual), err, tol, pass: typeof actual === 'number' && Number.isFinite(actual) && err <= tol });
    }
    function truth(group, name, cond, detail) {
      R.push({ group, name, expected: 'true', actual: cond ? 'true' : 'false', detail: detail || '', err: null, tol: null, pass: !!cond });
    }
    function guard(group, name, fn) {
      try { fn(); } catch (err) { R.push({ group, name, expected: 'no exception', actual: String(err && err.message || err), pass: false }); }
    }

    const ALL = { takeoff: true, cruise: true, landing: true };
    const P0 = E.baselineParams();
    const M = E.buildModel(P0, ALL);
    const TO = M.byId.takeoff.data, CR = M.byId.cruise.data, LD = M.byId.landing.data;
    const T = 1e-12; // relative tolerance for MATLAB-equivalent quantities

    guard('Baseline scalars', 'scalars', () => {
      truth('Baseline scalars', 'Baseline parameters validate without errors', Object.keys(M.errors).length === 0);
      near('Baseline scalars', 'Induced drag factor k = 1/(π·e·AR)', CR.k, REF.k, T);
      near('Baseline scalars', 'Takeoff parameter TOP (positive root)', TO.TOP, REF.TOP, T);
      near('Baseline scalars', 'TOP satisfies S_GTO = 4.9·TOP + 0.009·TOP² = 1,300 ft', 4.9 * TO.TOP + 0.009 * TO.TOP * TO.TOP, 1300, 1e-12);
      near('Baseline scalars', 'Takeoff product TOP·σ·CLmax,TO', TO.K, REF.K_TO, T);
      near('Baseline scalars', 'Landing stall speed (kt)', LD.Vs_kt, REF.Vs_L_kts, T);
      near('Baseline scalars', 'Landing stall speed (ft/s)', LD.Vs, REF.Vs_L_fts, T);
      near('Baseline scalars', 'Landing wing-loading limit (lb/ft²)', LD.wsMax, REF.WS_landing, T);
      near('Baseline scalars', 'Cruise speed (ft/s)', CR.V, REF.V_cruise_fts, T);
      near('Baseline scalars', 'Cruise density (slug/ft³)', CR.rho, REF.rho_cruise, T);
      near('Baseline scalars', 'Cruise dynamic pressure q (lb/ft²)', CR.q, REF.q_cruise, T);
    });

    guard('Cruise drag', 'dw', () => {
      for (const w of [5, 10, 20, 27.5, 40, 55]) near('Cruise drag', 'D/W at W/S = ' + w + ' lb/ft²', CR.dw(w), REF.DW_at[w], T);
    });

    guard('Constraint curves', 'curves', () => {
      for (const w of [5, 10, 20, 32, 40]) {
        near('Constraint curves', 'Takeoff allowable W/P at W/S = ' + w, TO.wp(w), REF.WPto_at[w], T);
        near('Constraint curves', 'Cruise allowable W/P at W/S = ' + w, CR.wp(w), REF.WPcr_at[w], T);
      }
    });

    guard('Sampled vectors', 'samples', () => {
      const S = E.sampleModel(M, 0.5, 55, 1800);
      truth('Sampled vectors', 'W/S vector: 1,800 points from 0.5 to 55 lb/ft²', S.n === 1800 && S.ws[0] === 0.5 && S.ws[1799] === 55);
      const r = REF.samples;
      for (let j = 0; j < r.idx.length; j++) {
        const i = r.idx[j] - 1;
        near('Sampled vectors', 'WS(' + r.idx[j] + ')', S.ws[i], r.WS[j], T);
        near('Sampled vectors', 'WP_takeoff(' + r.idx[j] + ')', S.series.takeoff[i], r.WP_takeoff[j], T);
        near('Sampled vectors', 'WP_cruise(' + r.idx[j] + ')', S.series.cruise[i], r.WP_cruise[j], T);
        near('Sampled vectors', 'DW_cruise(' + r.idx[j] + ')', S.dw[i], r.DW_cruise[j], T);
        near('Sampled vectors', 'WP_envelope(' + r.idx[j] + ')', S.env[i], r.WP_envelope[j], T);
      }
      const X = matlabTranscription();
      let maxErr = 0;
      for (let i = 0; i < 1800; i++) {
        maxErr = Math.max(maxErr, relErr(S.ws[i], X.WS[i]), relErr(S.series.takeoff[i], X.WP_takeoff[i]),
          relErr(S.series.cruise[i], X.WP_cruise[i]), relErr(S.dw[i], X.DW_cruise[i]), relErr(S.env[i], X.WP_envelope[i]));
      }
      truth('Sampled vectors', 'All 1,800 samples match an independent MATLAB transcription (max rel. diff ≤ 1e-12)', maxErr <= 1e-12,
        'max relative difference ' + maxErr.toExponential(2));
      let govOK = true;
      for (let i = 0; i < 1800; i++) {
        const expect = S.series.takeoff[i] <= S.series.cruise[i] ? 'takeoff' : 'cruise';
        if (S.gov[i] !== expect) { govOK = false; break; }
      }
      truth('Governing envelope', 'Envelope equals min(WP_takeoff, WP_cruise) and identifies the governing curve at every sample', govOK);
      const Y = E.autoYUpper(S.ws, [S.series.takeoff, S.series.cruise], 10, 55, 1.15, 35);
      near('Plot conventions', 'Automatic y-axis upper limit (MATLAB section 16)', Y, REF.yUpper, T);
      const fb = E.feasibleBoundary(M, S);
      truth('Plot conventions', 'Last shaded sample index matches MATLAB (WS <= WS_landing → index 1053)', fb.lastIndex + 1 === REF.lastValidIndex);
      truth('Plot conventions', 'Shaded region ends exactly at the analytic landing limit', Math.abs(fb.xs[fb.xs.length - 1] - REF.WS_landing) < 1e-12);
    });

    guard('Governing envelope', 'switch', () => {
      const sw = E.governingSwitches(M, 0.5, 55);
      truth('Governing envelope', 'Exactly one takeoff/cruise crossover in the sampled range', sw.length === 1, sw.length + ' found');
      if (sw.length) {
        near('Governing envelope', 'Crossover W/S (lb/ft²)', sw[0].ws, REF.ws_cross, 1e-9);
        near('Governing envelope', 'Crossover W/P (lb/hp)', sw[0].wp, REF.wp_cross, 1e-9);
        truth('Governing envelope', 'Cruise governs below the crossover, takeoff above it', sw[0].from === 'cruise' && sw[0].to === 'takeoff');
      }
    });

    guard('Feasibility', 'points', () => {
      const cases = [
        { ws: 20, wp: 10, status: 'feasible', viol: [] },
        { ws: 20, wp: 14, status: 'infeasible', viol: ['takeoff'] },
        { ws: 5, wp: 15, status: 'infeasible', viol: ['cruise'] },
        { ws: 10, wp: 23, status: 'feasible', viol: [] },
        { ws: 10, wp: 24, status: 'infeasible', viol: ['cruise'] },
        { ws: 35, wp: 5, status: 'infeasible', viol: ['landing'] },
        { ws: 40, wp: 20, status: 'infeasible', viol: ['takeoff', 'landing'] },
        { ws: 32.3, wp: 7.8, status: 'feasible', viol: [] },
      ];
      for (const c of cases) {
        const ev = E.evaluatePoint(M, c.ws, c.wp);
        const ids = ev.violations.map((v) => v.id).sort().join(',');
        truth('Feasibility', 'Point (W/S ' + c.ws + ', W/P ' + c.wp + ') → ' + c.status + (c.viol.length ? ' (violates ' + c.viol.join(' and ') + ')' : ''),
          ev.status === c.status && ids === c.viol.slice().sort().join(','), 'got ' + ev.status + (ids ? ' [' + ids + ']' : ''));
      }
      const onTO = E.evaluatePoint(M, 20, TO.wp(20));
      truth('Feasibility', 'A point exactly on the takeoff curve is feasible (boundary inclusive)', onTO.status === 'feasible');
      const aboveTO = E.evaluatePoint(M, 20, TO.wp(20) * (1 + 1e-6));
      truth('Feasibility', 'A point 1 ppm above the takeoff curve is infeasible (higher W/P = less power)', aboveTO.status === 'infeasible');
      const onL = E.evaluatePoint(M, LD.wsMax, 7.0);
      truth('Feasibility', 'A point on the landing limit is feasible', onL.status === 'feasible');
      const rightL = E.evaluatePoint(M, LD.wsMax * (1 + 1e-6), 7.0);
      truth('Feasibility', 'A point 1 ppm right of the landing limit is infeasible', rightL.status === 'infeasible' && rightL.violations[0].id === 'landing');
      const neg = E.evaluatePoint(M, -5, 10);
      truth('Feasibility', 'Non-positive W/S is rejected as an invalid design point', neg.status === 'invalid');
      const zero = E.evaluatePoint(M, 20, 0);
      truth('Feasibility', 'Zero W/P is rejected as an invalid design point', zero.status === 'invalid');
      const ev = E.evaluatePoint(M, 20, 10);
      const toRow = ev.rows.find((r) => r.id === 'takeoff');
      near('Feasibility', 'Takeoff margin at (20, 10) = WP_TO − WP_selected', toRow.margin, REF.WPto_at[20] - 10, 1e-12);
      const ldRow = ev.rows.find((r) => r.id === 'landing');
      near('Feasibility', 'Landing margin at W/S 20 = WS_limit − WS_selected', ldRow.margin, REF.WS_landing - 20, 1e-12);
      truth('Feasibility', 'Governing power constraint at W/S 20 is takeoff', ev.governingPower === 'takeoff');
    });

    guard('Constraint enforcement', 'enforce', () => {
      const noCr = E.buildModel(P0, { takeoff: true, cruise: false, landing: true });
      const ev = E.evaluatePoint(noCr, 5, 15);
      truth('Constraint enforcement', 'Disabling cruise makes a cruise-only violation feasible and reports it as not enforced',
        ev.status === 'feasible' && ev.notEnforced.indexOf('Cruise') >= 0);
      const S = E.sampleModel(noCr, 0.5, 55, 1800);
      let same = true;
      for (let i = 0; i < 1800; i++) if (S.env[i] !== S.series.takeoff[i]) { same = false; break; }
      truth('Constraint enforcement', 'With cruise disabled the envelope equals the takeoff curve', same);
      truth('Constraint enforcement', 'A disabled constraint is still computed (visible but not enforced)', !!noCr.byId.cruise.data);
      const noL = E.buildModel(P0, { takeoff: true, cruise: true, landing: false });
      truth('Constraint enforcement', 'Disabling landing removes the wing-loading limit', noL.wsLimit === Infinity && E.evaluatePoint(noL, 35, 5).status === 'feasible');
    });

    guard('Physical sizing', 'sizing', () => {
      const W = 2500;
      for (const [ws, wp] of [[20, 10], [32.386, 7.5], [12.5, 22]]) {
        const s = E.sizing(W, ws, wp, E.envelopeAt(M, ws).wp, P0.AR, 0.9);
        near('Physical sizing', 'W_TO = (W/S)·S at (' + ws + ', ' + wp + ')', s.W_fromS, W, 1e-12);
        near('Physical sizing', 'W_TO = (W/P)·P at (' + ws + ', ' + wp + ')', s.W_fromP, W, 1e-12);
      }
      const s = E.sizing(2500, 20, 10, REF.WPto_at[20], 10.5, 0.9);
      near('Physical sizing', 'Wing area at W 2,500 lb, W/S 20 (ft²)', s.S_ft2, 125, 1e-14);
      near('Physical sizing', 'Installed shaft power at W/P 10 (hp)', s.P_hp, 250, 1e-14);
      near('Physical sizing', 'Shaft power in kW (1 hp = 0.745699872 kW)', s.P_kW, 250 * 0.745699872, 1e-14);
      near('Physical sizing', 'Minimum required shaft power uses the governing allowable W/P', s.Preq_hp, 2500 / REF.WPto_at[20], 1e-12);
      near('Physical sizing', 'Electrical input power = shaft power / η_elec', s.Pelec_kW, 250 * 0.745699872 / 0.9, 1e-14);
      near('Physical sizing', 'Wing span b = √(AR·S)', s.span_ft, Math.sqrt(10.5 * 125), 1e-14);
    });

    guard('Atmosphere', 'isa', () => {
      const a0 = E.isaAtmosphere(0, 0);
      near('Atmosphere', 'ISA density ratio at sea level', a0.sigma, 1, 1e-12);
      near('Atmosphere', 'ISA density ratio at 7,000 ft (MATLAB comment: ≈0.81)', E.isaAtmosphere(7000, 0).sigma, REF.isa_sigma_7000, 2e-4);
      near('Atmosphere', 'ISA density ratio at 9,000 ft (MATLAB comment: ≈0.76)', E.isaAtmosphere(9000, 0).sigma, REF.isa_sigma_9000, 2e-4);
      near('Atmosphere', 'Density altitude round trip at 7,000 ft', E.isaAtmosphere(7000, 0).densityAlt_ft, 7000, 1e-9);
      truth('Atmosphere', 'A hot day (ISA +20 °C) lowers the density ratio', E.isaAtmosphere(7000, 20).sigma < E.isaAtmosphere(7000, 0).sigma);
      truth('Atmosphere', 'Altitude outside the implemented ISA range is rejected', E.isaAtmosphere(80000, 0).ok === false);
    });

    guard('Input validation', 'validation', () => {
      const bad = [
        ['AR', 0, 'Zero aspect ratio'], ['AR', -3, 'Negative aspect ratio'], ['e', 1.2, 'Oswald efficiency above 1'],
        ['e', 0, 'Zero Oswald efficiency'], ['eta_p', 0, 'Zero propeller efficiency'], ['eta_p', 1.05, 'Propeller efficiency above 1'],
        ['CD0', -0.01, 'Negative CD0'], ['CLmax_TO', 0, 'Zero takeoff CLmax'], ['CLmax_L', -1, 'Negative landing CLmax'],
        ['sigma_TO', 0, 'Zero takeoff density ratio'], ['sigma_cr', -0.5, 'Negative cruise density ratio'],
        ['S_GTO', 0, 'Zero takeoff ground roll'], ['S_GL', -100, 'Negative landing ground roll'], ['V_cr_kt', 0, 'Zero cruise speed'],
        ['WL_WTO', 0, 'Zero landing weight ratio'], ['AR', NaN, 'Non-numeric aspect ratio'], ['CD0', Infinity, 'Non-finite CD0'],
      ];
      for (const [key, v, label] of bad) {
        const p = Object.assign({}, P0, { [key]: v });
        const m = E.buildModel(p, ALL);
        const affected = m.list.filter((c) => c.deps.indexOf(key) >= 0);
        const ok = !!m.errors[key] && affected.every((c) => !c.valid) && E.evaluatePoint(m, 20, 10).status === 'indeterminate';
        truth('Input validation', label + ' → engineering error, dependent constraint not evaluated, feasibility indeterminate', ok, m.errors[key] || 'no error raised');
      }
      const p = Object.assign({}, P0, { e: 1.2 });
      const m = E.buildModel(p, ALL);
      truth('Input validation', 'Invalid input is never clamped: the takeoff constraint still evaluates, cruise does not', m.byId.takeoff.valid && !m.byId.cruise.valid);
      truth('Input validation', 'A violation of a valid constraint still makes the point infeasible when another input is invalid',
        E.evaluatePoint(m, 20, 14).status === 'infeasible');
    });

    guard('Acceptance behaviour', 'acceptance', () => {
      const mk = (o) => E.buildModel(Object.assign({}, P0, o), ALL);
      const a1 = mk({ S_GTO: 1000 });
      truth('Acceptance behaviour', 'Takeoff ground roll 1,300 → 1,000 ft lowers allowable takeoff W/P (more power needed)',
        a1.byId.takeoff.data.wp(20) < TO.wp(20), TO.wp(20).toFixed(3) + ' → ' + a1.byId.takeoff.data.wp(20).toFixed(3) + ' lb/hp at W/S 20');
      const a2 = mk({ CLmax_L: 2.3 });
      near('Acceptance behaviour', 'Raising landing CLmax 1.95 → 2.30 raises the landing W/S limit proportionally', a2.byId.landing.data.wsMax, LD.wsMax * 2.3 / 1.95, 1e-12);
      const a3 = mk({ V_cr_kt: 140 });
      truth('Acceptance behaviour', 'Cruise speed 115 → 140 kt lowers the peak allowable cruise W/P', a3.byId.cruise.data.wpMax < CR.wpMax,
        CR.wpMax.toFixed(3) + ' → ' + a3.byId.cruise.data.wpMax.toFixed(3) + ' lb/hp');
      const s100 = mk({ sigma_TO: 1.0 }), s81 = mk({ sigma_TO: 0.81 });
      near('Acceptance behaviour', 'Takeoff density ratio 1.00 → 0.81 scales allowable takeoff W/P by 0.81', s81.byId.takeoff.data.wp(20) / s100.byId.takeoff.data.wp(20), 0.81, 1e-12);
      truth('Acceptance behaviour', 'Higher aspect ratio raises allowable cruise W/P at W/S 30', mk({ AR: 12 }).byId.cruise.data.wp(30) > CR.wp(30));
      truth('Acceptance behaviour', 'Higher Oswald efficiency raises allowable cruise W/P at W/S 30', mk({ e: 0.9 }).byId.cruise.data.wp(30) > CR.wp(30));
      truth('Acceptance behaviour', 'Higher CD0 lowers allowable cruise W/P at W/S 20', mk({ CD0: 0.03 }).byId.cruise.data.wp(20) < CR.wp(20));
    });

    guard('Design recommendation', 'optimization', () => {
      const r = E.maxEnvelope(M, 0.5, LD.wsMax);
      near('Design recommendation', 'Minimum-power point lies at the takeoff/cruise crossover (W/S)', r.ws, REF.ws_cross, 1e-7);
      near('Design recommendation', 'Maximum governing W/P at that point (lb/hp)', r.wp, REF.wp_cross, 1e-9);
      truth('Design recommendation', 'Both power constraints are binding at the minimum-power point', r.binding.length === 2);
      const pf = E.paretoFront(M, 0.5, LD.wsMax, 600);
      let mono = pf.front.length > 2;
      for (let i = 1; i < pf.front.length; i++) if (!(pf.front[i].ws > pf.front[i - 1].ws && pf.front[i].wp < pf.front[i - 1].wp)) mono = false;
      truth('Design recommendation', 'Pareto front: smaller wing area always costs more shaft power', mono, pf.front.length + ' points');
      truth('Design recommendation', 'Pareto front ends at the landing limit (minimum wing area)', Math.abs(pf.front[pf.front.length - 1].ws - LD.wsMax) < 1e-9);
    });

    guard('MATLAB printout', 'printout', () => {
      const txt = E.matlabPrintout(M);
      truth('MATLAB printout', 'Reproduces the MATLAB fprintf values (k 0.0379, TOP 195.27, Vs 70.0 kt, W/S 32.39)',
        txt.indexOf('Induced drag factor k:       ' + REF.printout.k) >= 0 && txt.indexOf('Calculated TOP:              ' + REF.printout.TOP) >= 0 &&
        txt.indexOf('Derived landing stall speed: ' + REF.printout.Vs + ' kt') >= 0 && txt.indexOf('Landing W/S limit:           ' + REF.printout.WSL) >= 0);
    });

    const passed = R.filter((r) => r.pass).length;
    return { results: R, passed, failed: R.length - passed, total: R.length };
  }

  return Object.freeze({ REF, run, matlabTranscription });
});

</script>
<script>
/*!
 * Constraint-diagram plotting engine (v1.0)
 * SVG rendering with geometric clipping, engineering graph-paper grid, nice ticks,
 * collision-aware label placement, zoom/pan, hover inspection, draggable markers,
 * and SVG/PNG export. No dependencies.
 */
(function (root) {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = (v) => Math.round(v * 100) / 100;

  /* ---------------- ticks ---------------- */
  function niceStep(range, target) {
    const raw = range / Math.max(1, target);
    if (!(raw > 0) || !Number.isFinite(raw)) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }
  function makeTicks(a, b, target) {
    const step = niceStep(b - a, target);
    const values = [];
    for (let k = Math.ceil(a / step - 1e-9); k * step <= b + step * 1e-9 && values.length < 400; k++) values.push(k * step);
    return { step, values };
  }
  function tickText(v, step) {
    let d = step >= 1 ? 0 : Math.ceil(-Math.log10(step) - 1e-9);
    const scaled = step * Math.pow(10, d);
    if (Math.abs(scaled - Math.round(scaled)) > 1e-6) d += 1;
    let t = v.toFixed(Math.min(d, 10));
    if (/^-0(\.0+)?$/.test(t)) t = t.slice(1);
    return t.replace('-', '\u2212');
  }

  /* ---------------- clipping ---------------- */
  function clipSeg(x0, y0, x1, y1, R) {
    let t0 = 0, t1 = 1;
    const dx = x1 - x0, dy = y1 - y0;
    const p = [-dx, dx, -dy, dy];
    const q = [x0 - R.x0, R.x1 - x0, y0 - R.y0, R.y1 - y0];
    for (let i = 0; i < 4; i++) {
      if (p[i] === 0) { if (q[i] < 0) return null; continue; }
      const t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return null; if (t > t0) t0 = t; }
      else { if (t < t0) return null; if (t < t1) t1 = t; }
    }
    return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy, t0, t1];
  }
  function polylinePath(xs, ys, sx, sy, R) {
    let d = '', pen = false, px = 0, py = 0, pOK = false;
    const n = Math.min(xs.length, ys.length);
    for (let i = 0; i < n; i++) {

    const cross = [

      (a, b) => [R.x1, a[1] + (R.x1 - a[0]) / (b[0] - a[0]) * (b[1] - a[1])],
      (a, b) => [a[0] + (R.y0 - a[1]) / (b[1] - a[1]) * (b[0] - a[0]), R.y0],

  /* ---------------- text metrics ---------------- */

  /* ---------------- legend swatches ---------------- */

  /* ---------------- label placement ---------------- */
  function placeLabels(spec, g, FONT) {
    const { sx, sy, ix, R } = g;
    const res = [], placed = [];
    const inner = { x0: R.x0 + 3, x1: R.x1 - 3, y0: R.y0 + 3, y1: R.y1 - 3 };
    const inside = (b) => b.x >= inner.x0 && b.y >= inner.y0 && b.x + b.w <= inner.x1 && b.y + b.h <= inner.y1;
    const hit = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

        const cx = R.x0 + f * R.w;

        if (!Number.isFinite(yc)) continue;

        for (let j = 0; j <= 12; j++) {

    }

        if (best) break;

      if (best) { placed.push(best); res.push({ kind: 'vbox', box: best, text: v.label, color: v.labelColor || v.color, fs, weight }); }
    }

    const rl = spec.regionLabel;
    if (rl && rl.text) {
      const fsR = 13, fontR = `700 ${fsR}px ${FONT}`;

      const xa = Math.max(R.x0 + 4, sx(rl.xMin)), xb = Math.min(R.x1 - 4, sx(rl.xMax));

          if (!(avail >= h + 10)) continue;
          let y = yb - 0.42 * avail - h / 2;
          y = Math.min(y, yb - h - 5);
          y = Math.max(y, top + 5);
          const b = { x: cx - w / 2, y, w, h };
          if (!clear(b)) continue;
          const score = avail - 0.12 * Math.abs(cx - (xa + xb) / 2);

  function labelMarkup(labs, pal) {

      } else {

  /* ---------------- markers ---------------- */

      const px = sx(p.x), py = sy(p.y);

      const X = r2(px), Y = r2(py), c = p.color || pal.ink;

          `<circle cx="${X}" cy="${Y}" r="11" fill="none" stroke="${c}" stroke-width="1.4"/>` +
          `<path d="M${r2(px - 17)} ${Y}H${r2(px - 7)}M${r2(px + 7)} ${Y}H${r2(px + 17)}M${X} ${r2(py - 17)}V${r2(py - 7)}M${X} ${r2(py + 7)}V${r2(py + 17)}" stroke="${c}" stroke-width="1.4"/>` +
          `<circle cx="${X}" cy="${Y}" r="4.6" fill="${p.fill || c}" stroke="${pal.plot}" stroke-width="1.6"/>`;

      } else if (p.kind === 'hollow') {

      }
      if (p.label) {

  }

  /* ---------------- full render ---------------- */

    const titleH = opt.title ? (opt.subtitle ? 54 : 34) : 0;
    const legendRows = opt.legend && spec.legend && spec.legend.length ? layoutLegend(spec.legend, W - 80, '12px ' + FONT) : [];
    const legendH = legendRows.length ? legendRows.length * 20 + 14 : 0;

    const pw = Math.max(20, W - m.l - m.r), ph = Math.max(20, H - m.t - m.b);

    const out = [];
    if (opt.background) out.push(`<rect width="${W}" height="${H}" fill="${pal.bg}"/>`);
    out.push(`<defs><clipPath id="${id}-clip"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath></defs>`);
    out.push(`<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="${pal.plot}"/>`);

      if (my * ky >= 7) for (let k = Math.ceil(y0 / my - 1e-9), n = 0; k * my <= y1 + 1e-9 && n < 800; k++, n++) minor += `M${R.x0} ${r2(sy(k * my))}H${R.x1}`;
      for (const v of xt.values) major += `M${r2(sx(v))} ${R.y0}V${R.y1}`;
      for (const v of yt.values) major += `M${R.x0} ${r2(sy(v))}H${R.x1}`;
      if (minor) body.push(`<path d="${minor}" stroke="${pal.gridMinor}" stroke-width="1" fill="none"/>`);

      const c = clipPolygon(pts, RP);
      if (c.length >= 3) body.push(`<path d="M${c.map((q) => r2(q[0]) + ' ' + r2(q[1])).join('L')}Z" fill="${f.color}" fill-opacity="${f.opacity == null ? 1 : f.opacity}" stroke="none"/>`);

    for (const ln of spec.lines || []) {
      const d = polylinePath(ln.x, ln.y, sx, sy, RP);

      if (px >= R.x0 - 1 && px <= R.x1 + 1) body.push(`<line x1="${r2(px)}" y1="${R.y0}" x2="${r2(px)}" y2="${R.y1}" stroke="${v.color}" stroke-width="${v.width || 2}"${v.dash ? ` stroke-dasharray="${v.dash}"` : ''}${v.opacity != null ? ` stroke-opacity="${v.opacity}"` : ''}/>`);
    }
    out.push(`<g clip-path="url(#${id}-clip)">${body.join('')}</g>`);
    if (spec.showLabels !== false) out.push(labelMarkup(placeLabels(spec, { sx, sy, ix, iy, R }, FONT), pal));
    for (const v of spec.vlines || []) {
      if (!v.offAxisNote || !Number.isFinite(v.x)) continue;
      const px = sx(v.x);
      if (px >= R.x0 && px <= R.x1) continue;
      const right = px > R.x1;
      out.push(`<text x="${right ? R.x1 - 8 : R.x0 + 8}" y="${R.y0 + 18}" text-anchor="${right ? 'end' : 'start'}" font-size="11.5" font-weight="700" fill="${v.color}" stroke="${pal.plot}" stroke-width="3" paint-order="stroke">${esc((right ? '' : '\u2039 ') + v.offAxisNote + (right ? ' \u203A' : ''))}</text>`);
    }

    out.push(markerMarkup(spec.markers, sx, sy, R, pal, FONT, hits));
    let tk = '', tl = '';
    for (const v of xt.values) { const X = r2(sx(v)); tk += `M${X} ${R.y1}v5`; tl += `<text x="${X}" y="${r2(R.y1 + 19)}" text-anchor="middle">${tickText(v, xt.step)}</text>`; }
    for (const v of yt.values) { const Y = r2(sy(v)); tk += `M${R.x0} ${Y}h-5`; tl += `<text x="${r2(R.x0 - 8)}" y="${r2(Y + 4)}" text-anchor="end">${tickText(v, yt.step)}</text>`; }
    out.push(`<rect x="${R.x0}" y="${R.y0}" width="${pw}" height="${ph}" fill="none" stroke="${pal.axis}" stroke-width="1.2"/>`);
    out.push(`<path d="${tk}" stroke="${pal.axis}" stroke-width="1.2" fill="none"/>`);
    out.push(`<g font-size="11.5" fill="${pal.muted}">${tl}</g>`);
    out.push(`<text x="${r2(R.x0 + pw / 2)}" y="${r2(R.y1 + 42)}" text-anchor="middle" font-size="13" font-weight="700" fill="${pal.ink}">${esc(spec.xLabel || '')}</text>`);
    out.push(`<text transform="translate(18 ${r2(R.y0 + ph / 2)}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="${pal.ink}">${esc(spec.yLabel || '')}</text>`);
    if (opt.title) {
      out.push(`<text x="${m.l}" y="24" font-size="16" font-weight="700" fill="${pal.ink}">${esc(opt.title)}</text>`);
      if (opt.subtitle) out.push(`<text x="${m.l}" y="44" font-size="12" fill="${pal.muted}">${esc(opt.subtitle)}</text>`);
    }
    if (legendRows.length) {
      let y = R.y1 + 66;
      for (const row of legendRows) {
        const xs = Math.max(10, (W - row.w) / 2);
        for (const cell of row.items) {
          out.push(swatch(cell.it, r2(xs + cell.x), r2(y)));
          out.push(`<text x="${r2(xs + cell.x + 30)}" y="${r2(y + 4)}" font-size="12" fill="${pal.ink}">${esc(cell.it.label)}</text>`);
        }
        y += 20;
      }
    }
    return { markup: out.join(''), sx, sy, ix, iy, R, hits };
  }

  /* ---------------- interactive chart ---------------- */

      for (const el of [this.svg, this.ov]) {

  /* ================= 10. Selected-design readout ================= */

  function setIfIdle(inp, v) { if (inp && document.activeElement !== inp && inp.value !== v) inp.value = v; }
  let lastSelKey = '';

  function statusHTML(A) {
    const ev = A.ev;
    const nEnf = C.model.list.filter((c) => c.enabled).length;
    let cls, title, body;
    if (ev.status === 'feasible') {
      cls = 'ok'; title = 'Feasible';
      body = nEnf ? `<p>All ${nEnf} enforced constraint${nEnf > 1 ? 's are' : ' is'} satisfied.</p>` : '<p>No constraints are enforced, so every positive design point is accepted.</p>';
    } else if (ev.status === 'infeasible') {
      cls = 'bad'; title = 'Infeasible';
      body = '<ul>' + ev.violations.map((r) => `<li>${esc(E.violationMessage(r, A.ws, A.wp))}</li>`).join('') + '</ul>';
    } else if (ev.status === 'invalid') {
      cls = 'warn'; title = 'Invalid design point';
      body = '<ul>' + ev.pointErrors.map((t) => `<li>${esc(t)}</li>`).join('') + '</ul>';
    } else {
      cls = 'warn'; title = 'Feasibility cannot be determined';
      body = '<ul>' + ev.invalid.map((r) => `<li>The ${esc(r.name.toLowerCase())} constraint is not evaluated. ${esc(r.issue)}</li>`).join('') + '</ul>';
    }

  }
  function pill(status) {
    const map = { feasible: ['ok', 'Feasible'], infeasible: ['bad', 'Infeasible'], indeterminate: ['warn', 'Indeterminate'], invalid: ['warn', 'Invalid point'], pass: ['ok', 'Pass'], fail: ['bad', 'Fail'], off: ['off', 'Off'], err: ['warn', 'Invalid'] };

  function checksHTML(A) {
    const ev = A.ev;

      const isP = r.type === 'power';
      const st = !r.enabled ? 'off' : !r.valid ? 'err' : r.satisfied === true ? 'pass' : r.satisfied === false ? 'fail' : null;
      const lim = Number.isFinite(r.value) ? (isP ? 'W/P ≤ ' : 'W/S ≤ ') + fmt(r.value, 2) : '—';
      rows += `<tr><th>${esc(r.short)}</th><td class="n">${lim}</td><td class="n">${fmtSigned(r.margin, 2)}</td><td>${st ? pill(st) : '—'}</td></tr>`;

  /* ================= 11. Design-point actions ================= */
  function addPoint(at) {
    const A = activePt();
    const ws = at && Number.isFinite(at.ws) ? rawOf(at.ws) : Number.isFinite(num(A.ws)) ? A.ws : INITIAL_POINT.ws;
    const wp = at && Number.isFinite(at.wp) ? rawOf(at.wp) : Number.isFinite(num(A.wp)) ? A.wp : INITIAL_POINT.wp;
    const p = { id: uid('p'), name: (at && at.name) || 'P' + state.nextPt, ws, wp };

    state.points.push(p);

  function deletePoint(id) {
    if (state.points.length < 2) return;
    const i = state.points.findIndex((p) => p.id === id);

    if (state.activeId === id) state.activeId = state.points[Math.max(0, i - 1)].id;
    refresh();
    toast('Deleted ' + (removed.name || 'point') + '.', null, { label: 'Undo', fn: () => { state.points.splice(i, 0, removed); state.activeId = removed.id; refresh(); } });
  }

  /* ---- Optimization tab ---- */
  let paretoChart = null;
  function optResult() {
    const { model, dom } = C;
    const obj = state.opt.objective;
    if (obj === 'pareto') return { ok: true, pareto: true };
    if (model.indeterminate) return { ok: false, msg: 'An enforced constraint cannot be evaluated because of invalid inputs. Fix them first.' };
    if (dom.empty) return { ok: false, msg: 'No feasible wing loading lies inside the sampled range: the wing-loading limit (' + fmt(model.wsLimit, 2) + ' lb/ft²) is below the first sampled W/S.' };
    const hiNote = dom.hiBy === 'sampling' ? 'No wing-loading constraint is enforced, so the search stops at the end of the sampled range (' + fmt(dom.hi, 2) + ' lb/ft²). The result is set by the plot range, not by a requirement.' : null;
    const bindText = (ids) => (ids.length > 1 ? ids.map(govName).join(' and ') + ' constraints intersect here.' : govName(ids[0]) + ' constraint is binding here.');
    if (obj === 'minPower' || obj === 'maxMargin') {
      const r = E.maxEnvelope(model, dom.lo, dom.hi);
      if (r.unbounded) return { ok: false, msg: 'No power-loading constraint is enforced, so installed power has no lower bound.' };
      const notes = [];
      if (r.atLower) notes.push('The best value lies at the first sampled W/S (' + fmt(dom.lo, 2) + ' lb/ft²): with the enforced constraints the objective keeps improving as the wing grows. Enforce the cruise constraint or extend the sampling range.');
      if (r.atUpper && hiNote) notes.push(hiNote);
      if (obj === 'minPower') return { ok: true, title: 'Minimum installed shaft power', ws: r.ws, wp: r.wp, binding: bindText(r.binding), notes };
      const A = C.active;
      if (!(A.wp > 0)) return { ok: false, msg: 'Enter a valid W/P for the selected point first.' };
      const margin = r.wp - A.wp;
      if (margin < 0) return { ok: false, msg: 'No wing loading satisfies the power constraints at the selected W/P of ' + fmt(A.wp, 2) + ' lb/hp. The largest allowable W/P anywhere is ' + fmt(r.wp, 2) + ' lb/hp, so more installed power is needed.' };
      notes.unshift('The selected point’s installed W/P is kept. The most margin occurs where the governing allowable W/P peaks, which is also the minimum-power wing loading.');
      return { ok: true, title: 'Maximum power margin at W/P ' + fmt(A.wp, 2), ws: r.ws, wp: A.wp, margin, marginPct: 100 * (r.wp / A.wp - 1), binding: bindText(r.binding), notes };
    }
    const e = E.envelopeAt(model, dom.hi);
    const wp = e.wp === Infinity ? NaN : e.wp;
    const notes = hiNote ? [hiNote] : [];
    if (!Number.isFinite(wp)) notes.push('No power-loading constraint is enforced, so any W/P is acceptable at this wing loading.');
    const why = dom.hiBy === 'sampling' ? 'Limited by the sampled range.' : govName(dom.hiBy) + ' wing-loading limit sets this point; W/P is the governing allowable value there.';
    return { ok: true, title: obj === 'minArea' ? 'Minimum wing area' : 'Maximum wing loading', ws: dom.hi, wp, binding: why, notes };
  }

  function paretoData() {
    const m = C.model, d = C.dom;
    if (m.indeterminate) return { err: 'Fix the invalid inputs to compute the tradeoff.' };
    if (d.empty) return { err: 'No feasible wing loading lies inside the sampled range.' };
    if (!m.activePower.length) return { err: 'Enforce at least one power-loading constraint to compute the tradeoff.' };
    const pf = E.paretoFront(m, d.lo, d.hi, 700);
    if (pf.front.length < 2) return { err: 'Minimum power and minimum wing area coincide for these inputs, so the objectives do not conflict.' };
    const W = C.W.ok ? C.W.lb : null;
    return { pf, W, X: (ws) => (W ? W / ws : 1 / ws), Y: (wp) => (W ? W / wp : 1 / wp), lo: d.lo, hi: d.hi };
  }
  function paretoPick(pd) { const f = pd.pf.front; return f[Math.round(state.opt.t * (f.length - 1))]; }
  function buildParetoSpec(pd) {
    const col = colorSet(false);
    const { pf, X, Y, W } = pd;
    const ordered = pf.all.slice().reverse();
    const poly = [[X(ordered[0].ws), 1e9]].concat(ordered.map((p) => [X(p.ws), Y(p.wp)]), [[X(ordered[ordered.length - 1].ws), 1e9]]);
    const fA = pf.front[0], fB = pf.front[pf.front.length - 1];
    const markers = [
      { id: 'minP', x: X(fA.ws), y: Y(fA.wp), kind: 'ref', color: col.envelope, label: 'Least power' },
      { id: 'minS', x: X(fB.ws), y: Y(fB.wp), kind: 'ref', color: col.envelope, label: 'Smallest wing' },
    ];
    const pick = paretoPick(pd);
    if (pick) markers.push({ id: 'pick', x: X(pick.ws), y: Y(pick.wp), kind: 'opt', color: col.opt, label: 'Slider' });
    const A = C.active;
    const xs = [X(fA.ws), X(fB.ws)], ys = [Y(fA.wp), Y(fB.wp)];
    if (A.ws > 0 && A.wp > 0) {
      markers.push({ id: 'act', x: X(A.ws), y: Y(A.wp), kind: 'point', color: A.ev.status === 'feasible' ? col.ok : col.bad, label: A.pt.name });
      xs.push(X(A.ws)); ys.push(Y(A.wp));
    }
    const xa = Math.min(...xs), xb = Math.max(...xs), ya = Math.min(...ys), yb = Math.max(...ys);
    const dx = xb - xa || xa * 0.2, dy = yb - ya || ya * 0.2;
    return {
      xLabel: W ? 'Wing area S (ft²)' : 'Wing area per unit weight S/W (ft²/lb)',
      yLabel: W ? 'Installed shaft power P (hp)' : 'Shaft power per unit weight P/W (hp/lb)',
      home: { x0: Math.max(0, xa - 0.2 * dx), x1: xb + 0.3 * dx, y0: Math.max(0, ya - 0.25 * dy), y1: yb + 0.25 * dy },
      grid: true, showLabels: false,
      fills: [{ points: poly, color: col.feasible, opacity: col.feasibleOpacity }],
      lines: [
        { x: pf.all.map((p) => X(p.ws)), y: pf.all.map((p) => Y(p.wp)), color: col.muted, width: 1.4, dash: '4 3' },
        { x: pf.front.map((p) => X(p.ws)), y: pf.front.map((p) => Y(p.wp)), color: col.envelope, width: 3.2 },
      ],
      vlines: [], markers,
    };
  }

  /* ---- Saving files: Claude downloads capability, direct download, or copy dialog ---- */
  const Saver = {
    mode: 'pending', ns: null, ready: null,
    init() {
      const c = window.claude;
      if (c && typeof c.use === 'function') {
        this.ready = Promise.resolve().then(() => c.use('downloads')).then(
          (ns) => { this.ns = ns || null; this.mode = ns ? 'platform' : 'dialog'; },
          () => { this.mode = 'dialog'; });
      } else { this.mode = 'native'; this.ready = Promise.resolve(); }
      this.ready.then(() => { if (state.ui.tab === 'export') refresh(); });

    async save(filename, data) {
      try { await this.ready; } catch (_) { /* ignore */ }

        try { await this.ns.save({ filename, data }); toast('Saved ' + filename + '.'); return; }
        catch (err) {
          const code = err && err.code;
          if (code === 'declined') { toast('Save cancelled.'); return; }
          if (code === 'rate_limited') { toast('A save prompt is already open. Finish it, then try again.', 'warn'); return; }
          showSaveDialog(filename, data, 'Saving is not available in this view (' + (code || 'unavailable') + '). Copy the contents instead.');
          return;
        }
      }
      if (this.mode === 'native') {
        try {
          const blob = data instanceof Blob ? data : new Blob([data], { type: mimeOf(filename) });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 5000);
          toast('Saved ' + filename + '.');

      h('div', { class: 'top-actions' },
        h('button', { class: 'btn', type: 'button', title: 'Restore every model parameter, constraint switch and plot setting to the values in the original MATLAB script', onclick: restoreBaseline }, 'Restore MATLAB baseline'),
        h('button', { class: 'btn', type: 'button', onclick: exportWorkspace }, 'Save session'),
        segmented([['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], () => state.ui.theme, (v) => { state.ui.theme = v; applyTheme(); }, 'Color theme')));
  }
  let rafId = 0;
  function refresh() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => { rafId = 0; update(); });
  }
  function update() {
    compute();
    syncSegs();
    syncSwitches();
    renderInputs();
    renderDiagram();
    renderReadout();
    renderTabs();
    saveSoon();
  }
  function init() {
    applyTheme();
    buildTopbar();
    buildInputs();
    buildDiagram();
    buildReadout();
    buildTabs();
    $('#saveDlgClose').addEventListener('click', () => $('#saveDlg').close());
    Saver.init();
    runTests();
    update();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => refresh());
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      const fn = () => { if (state.ui.theme === 'auto') refresh(); };
      if (mq.addEventListener) mq.addEventListener('change', fn); else if (mq.addListener) mq.addListener(fn);
    }
    window.CAApp = { get state() { return state; }, get C() { return C; }, refresh, update, get mainChart() { return mainChart; }, Saver };
  }
  init();
})();

</script>
</body>
</html>
